0個と言われています。人間の骨の数は約206個です。"},{"l":"m","u":11,"s":2,"q":"子犬が家族になって成長する中で学ぶこととして、テキストに挙げられていないものはどれですか。","c":["道路に飛び出さないこと","お座り・伏せ","トイレトレーニング","テーブルでおねだりをすること"],"a":3,"e":"テーブルでおねだりを「しない」ことを学びます。"},{"l":"m","u":14,"s":5,"q":"犬の平熱が約38.5℃であることから考えて、安静時に体温を測ったときに受診を考えたほうがよい状態はどれですか。","c":["38.3℃","運動直後に39.5℃だったが、休むと38.5℃に戻った","38.6℃","安静にしていても40℃近い、または40℃を超える"],"a":3,"e":"【テキスト外の応用】犬の平熱は約38.5℃で、運動後は40℃近くまで上がることがありますが、安静にしていても40℃前後ある場合は発熱や熱中症などが疑われるため、受診を考えます。"},{"l":"m","u":15,"s":3,"q":"脂質の働きとして、テキストに書かれているものはどれですか。","c":["腸内環境を整える","骨や歯を作る","体の調子を整える","運動や散歩のエネルギー源、細胞膜の材料、毛や皮膚を健康に保つ"],"a":3,"e":"脂質は運動や散歩のエネルギー源となり、細胞膜の材料、毛や皮膚を健康に保ちます。摂りすぎると肥満になります。"},{"l":"m","u":22,"s":2,"q":"動物愛護管理法の指標に取り入れられている「5つの自由」は、何という考え方の基本となるものですか。","c":["終生飼養","動物福祉（アニマルウエルフェア）","公衆衛生","ワンヘルス"],"a":1,"e":"この指標には「5つの自由」という動物福祉（アニマルウエルフェア）の基本となる考え方が取り入れられています。"},{"l":"m","u":14,"s":2,"q":"歯磨きを習慣づける時間として、散歩前のほかにテキストに挙げられているものはどれですか。","c":["食事の直後の興奮時","散歩の途中","シャンプーの最中","寝る前のリラックス時"],"a":3,"e":"散歩前（気持ちが高揚し我慢しやすい）や、寝る前のリラックス時に習慣にします。夜中の菌の繁殖を防ぐため毎日一回が目安です。"},{"l":"m","u":23,"s":4,"q":"介在動物に犬が選ばれる理由として、テキストで紹介されている2014年の研究はどの国の機関によるものですか。また、その内容として正しいものを選びなさい。","c":["イギリスの病院 ― 犬は色を人と同じように見分けた","日本の研究所 ― 犬は人と同じように汗をかいた","アメリカの大学 ― 犬は人の言葉を100%理解した","ハンガリー科学アカデミー ― MRI内で人間の声を約200種類聞かせると、人間と同じ反応を見せた"],"a":3,"e":"2014年、ハンガリー科学アカデミーが行なった研究では、MRI内で犬たちに人間の声を約200種類聞かせ、脳内をスキャンすると、人間と同じ反応を見せていたことがわかりました。犬は家畜化の過程で「人とのコミュニケーション」が強化されてきたと考えられます。"},{"l":"m","u":16,"s":2,"q":"テキストでは、犬の入浴はどのような時にするのがよいとしていますか。","c":["犬がひどく汚れている時や排泄物にまみれた時だけ","週に3回以上","犬が眠そうな時","毎日の散歩の後"],"a":0,"e":"入浴は、犬がひどく汚れている時や排泄物にまみれた時だけにしましょう、と書かれています。"},{"l":"m","u":8,"s":2,"q":"災害時に備えて、迎え入れる前に準備しておくものとして、テキストに挙げられているものはどれですか。","c":["高価なおもちゃ","犬用ベッドを3つ以上","ドッグショーの衣装","数日間のフード"],"a":3,"e":"もしもの時に備えて、数日間のフードを準備しておきます。"},{"l":"m","u":14,"s":3,"q":"犬の口臭が強くなる原因として、テキストに挙げられているものはどれですか。","c":["白内障","換毛","歯周病","乳糖"],"a":2,"e":"口臭が強くなる原因は歯周病（歯槽膿漏・歯髄炎・歯周炎）です。"},{"l":"m","u":12,"s":2,"q":"テキストの「一年間でかならずかかるお金」で、大きさに関係なく同じ金額の項目はどれですか。","c":["健康診断","シャンプー・トリミング","ドッグフード","ノミ・ダニ予防薬"],"a":0,"e":"狂犬病予防注射3,500円・混合ワクチン接種8,000円・健康診断4,000円は大きさに関係なく同じです。"},{"l":"m","u":23,"s":1,"q":"飼い主のいない犬が収容される施設として、最も一般的なものはどれですか。","c":["ペットホテル","自治体が運営する動物愛護センターや保健所","ドッグラン","トリミングサロン"],"a":1,"e":"飼い主のいない犬が収容される施設として、最も一般的なのが自治体が運営する動物愛護センターや保健所です。そこでは収容された犬に手厚いケアを行うことで譲渡数を増やすことを目指しています。"},{"l":"m","u":15,"s":4,"q":"食器の扱いとして、テキストに書かれているものはどれですか。","c":["洗わずに次の食事に使う","洗って乾燥させ、最後に石けんで手を洗う","水だけ入れ替えればよい","週に一度だけ洗う"],"a":1,"e":"フードの残りカスや水分は微生物の繁殖場所になります。食器は洗って乾燥させ、最後に石けんで手を洗います。"},{"l":"m","u":24,"s":2,"q":"テキストでは、在宅介護は何に例えられることがあるとしていますか。","c":["ジェットコースター","短距離走","終りのないマラソン","宝探し"],"a":2,"e":"在宅介護を選ぶ際は、終りのないマラソンのようなものに例えられることがあります。そのため、長く続けるためには息抜きや休息が必要です。"},{"l":"m","u":18,"s":3,"q":"「どこへ避難するか」「何を持ち出すか」などを決めるために、テキストですすめていることはどれですか。","c":["家族でよく話し合う","近所の人に全部任せる","災害が起きてから考える","犬だけで避難させる"],"a":0,"e":"どこへ避難するか、避難経路、連絡方法、何を持ち出すか、犬をどうするかを家族でよく話し合います。"},{"l":"m","u":1,"s":1,"q":"人間と犬は、およそいつごろから共生してきたと言われていますか。","c":["約20万〜30万年前","約2万〜3万年前","約2千〜3千年前","約200万年前"],"a":1,"e":"原始の人は犬をパートナーとして狩りを行い、番犬の役割もさせ、約2〜3万年前から共生してきたと言われています。"},{"l":"m","u":6,"s":1,"q":"子どもが「犬を飼いたい」と口にした時、テキストではどうするのがよいとしていますか。","c":["子どもにはまだ早いので、話を聞かないようにする","子どもの気持ちが変わらないうちに、すぐに飼い始める","子どもが自分ひとりで世話をすると約束させて飼う","家族で生き物と一緒に生きる生活について考えるいい機会とする"],"a":3,"e":"お子さんが「犬を飼いたい」と口にした時は、家族で生き物と一緒に生きる生活について考えるいい機会としましょう、と書かれています。"},{"l":"m","u":18,"s":1,"q":"非常時に犬を飼養することが考えられるため、普段から慣れさせておくとよいものはどれですか。","c":["トリミングサロン","ペットショップ","ドッグラン","クレート（ケージ）"],"a":3,"e":"非常時には、クレート（ケージ）で犬を飼養することが考えられます。普段から、クレートに慣れさせるようにしましょう。"},{"l":"m","u":17,"s":3,"q":"人工呼吸で吹き込みすぎてはいけない理由として、テキストに書かれているものはどれですか。","c":["吹き込む人がめまいを起こすから","鼻が冷えるから","犬が驚くから","胃に空気が入ってしまうから"],"a":3,"e":"人工呼吸は胃に入らないよう吹き込みすぎないようにします。"},{"l":"m","u":7,"s":2,"q":"テキストでは、犬種によって何が変わるので、家庭の事情に見合った犬種を選ぶようにとしていますか。","c":["登録や予防接種の義務","名前の付け方や呼び方","かかりやすい病気や散歩の量","好きなおもちゃの色践問題 第6回5/7"],"a":2,"e":"犬種によって、かかりやすい病気や散歩の量が変わります。家庭の事情に見合った犬種を選びましょう。"},{"l":"m","u":5,"s":3,"q":"ゴールデン・レトリバーやラブラドール・レトリバーは、テキストのどのタイプに分類されていますか。","c":["使役犬","鳥獣犬","牧羊犬・牧畜犬","視覚ハウンドタイプ"],"a":1,"e":"アメリカン／イングリッシュ・コッカー・スパニエル、ゴールデン・ラブラドール・フラットコーテッド・レトリバーは鳥獣犬です。"},{"l":"m","u":8,"s":2,"q":"ワクチン接種は午前中に受けるのがよいとされています。その理由として正しいものはどれですか。","c":["数時間後にアレルギー反応が出ても、受診できる時間帯だから","犬が空腹のほうがワクチンが効くから","散歩の前に打つ必要があるから","午後はワクチンを打てない決まりだから"],"a":0,"e":"犬によってワクチン接種の数時間後にアレルギー反応症状が出る場合があります。もし発症しても受診できる時間帯なら安心です。接種後30分は院内にとどまって見守る時間をとることもあります。"},{"l":"m","u":4,"s":3,"q":"犬が人には聞こえない高い音を聞き取れることと、犬種や体の大きさとの関係について、テキストではどのように考えられていますか。","c":["小型犬ほどよく聞こえる","耳の立った犬だけが聞こえる","相関性はないと考えられている","大型犬ほどよく聞こえる"],"a":2,"e":"聞こえる範囲は、犬種や体の大きさとは相関性はないと考えられています。"},{"l":"m","u":13,"s":2,"q":"アジリティの説明として正しいものはどれですか。","c":["犬にソリを引かせて走る","コース上のハードルやシーソーなどを時間内に正しくクリアし、ミスの回数とタイムを総合して争う","音楽に併せて犬と一緒に踊る","ディスクを空中でキャッチして得点を争う"],"a":1,"e":"広い会場のコース上におかれたハードルやシーソーなどを定められた時間内に正しくクリアしていき、ミスの回数とタイムを総合して争うスポーツをアジリティと言います。"},{"l":"m","u":22,"s":4,"q":"第一種動物取扱業の店舗で、動物取扱責任者を選任しなければどうなりますか。","c":["罰金を払えば営業できる","業の登録・更新ができない","翌年に選べばよい","何も問題はない"],"a":1,"e":"動物取扱責任者は常勤の職員から必ず1名選任することが法律で定められており、選任しなければ業の登録・更新が出来ません。"},{"l":"m","u":19,"s":3,"q":"見た目や行動などの体の外の変化について、テキストでは誰が観察（確認）できるとしていますか。","c":["獣医師だけ","誰も確認できない","オーナー自身","トリマーだけ"],"a":2,"e":"体の外、つまり見た目や行動についてはオーナー自身が普段、犬と接する中で観察（確認）することが可能です。"},{"l":"m","u":15,"s":3,"q":"「注意が必要な食べ物」とその理由の組み合わせとして、誤っているものはどれですか。","c":["煮干し・海藻・のり ― マグネシウムの過剰","ほうれん草 ― シュウ酸","レバー ― ビタミンA","生たまご ― カルシウムの過剰"],"a":3,"e":"生たまごはビオチン欠乏が注意点です。"},{"l":"m","u":12,"s":4,"q":"テキストの年間コストの合計（必ずかかるお金＋臨時でかかるお金）で、中型犬の金額として正しいものはどれですか。","c":["306,000円","434,500円","523,500円","345,500円"],"a":1,"e":"年間コスト合計は、小型犬345,500円・中型犬434,500円・大型犬523,500円です。"},{"l":"m","u":18,"s":4,"q":"療法食（尿石用・アレルギー用など）を食べている犬について、防災の備えで特に重要とされていることはどれですか。","c":["療法食は持ち出さないこと","人の食事を分けること","最低5日分の餌と水を準備しておくこと","災害時はふつうのフードに切り替えること"],"a":2,"e":"餌と水は最低5日分を準備します。ドライフードなど長期保存が可能なものがよく、療法食の場合は特に重要です。"},{"l":"m","u":2,"s":4,"q":"犬の平均寿命について、テキストの内容に合うものはどれですか。","c":["大きな犬は10〜13年くらい、小さな犬は13〜15年くらいで、個体によって異なる","どの犬も20年以上生きる","犬種に関係なく5年ほど","大きな犬のほうが長生きする"],"a":0,"e":"平均寿命は、大きな犬は10〜13年くらい、小さな犬は13〜15年くらいです。ただし個々の個体で異なります。"},{"l":"m","u":13,"s":3,"q":"ノーズワークの特徴として、テキストに書かれているものはどれですか。","c":["特別な競技場でしかできない","年齢や体力に左右されず、自宅でもできる","激しい運動が必要","水の上で行う"],"a":1,"e":"ノーズワークは嗅覚を頼りにおやつを探すスポーツで、年齢や体力に左右されず、老犬や障害のある犬でも楽しめ、自宅でも行えます。"},{"l":"m","u":23,"s":2,"q":"特定の病院や介護施設を拠点として、ハンドラーと一緒に働くセラピー・ドッグを何と言いますか。","c":["ガンドッグ","ファシリティ・ドッグ","アラート・ドッグ","アクティング・ドッグ"],"a":1,"e":"特定の施設を拠点として活動するセラピー・ドッグをファシリティ・ドッグといいます。これらの犬は通常、特定の病院や介護施設でハンドラーと一緒に働いています。"},{"l":"m","u":8,"s":1,"q":"テキストでは「犬のしつけ」とはどのようなことだとしていますか。","c":["愛犬が人間と共に過ごして行くためのルールを教えること・伝え導くこと","犬を厳しく叱って言うことを聞かせること","ドッグショーで入賞させるための訓練","犬に芸をたくさん覚えさせること"],"a":0,"e":"「犬のしつけ」とは、愛犬が人間と共に過ごして行くためのルールを教えること・伝え導くことを言います。愛犬が人間社会で生きることを「ストレス」として感じないための教育が「しつけ」です。"},{"l":"m","u":14,"s":4,"q":"犬が短距離を速く走ることも、長距離を走り続けることもできる理由として、テキストではどのように説明していますか。","c":["骨格筋を構成する白筋繊維と赤筋繊維のバランスが最適だから","前足に体重の約60%がかかるから","汗をかいて体温を下げられるから","骨の数が人より多いから"],"a":0,"e":"犬の骨格筋を構成する筋繊維は、短時間の大きな力を出すのに役立つ白筋繊維と、有酸素運動に適したミトコンドリアが多い赤筋繊維のバランスが最適です。そのため、グレーハウンドのように短距離を速く走ることも、ソリ犬のように長い距離を走り続けることも出来ます。"},{"l":"m","u":18,"s":3,"q":"「日常のしつけとマナーが大切」についての記述として、誤っているものはどれですか。","c":["避難所では犬も不安なので、鳴いたり暴れたりしてもしかたがなく、普段のしつけは関係ない","非常時にはクレートで飼養することが考えられる","放し飼いや糞尿の不始末は周囲に大きな迷惑をかける","犬に所有者明示をすることは必須条件である"],"a":0,"e":"避難所は日常の環境と異なるため、おびえて鳴いたり暴れたりすることが考えられます。犬の場合は、普段から社会化トレーニングを心がけ、無駄吠えなどをしないようにしつけておきます。"},{"l":"m","u":4,"s":3,"q":"匂いを感じる嗅細胞は、どこに分布していますか。","c":["鼻腔の奥の上皮","目の網膜","舌の表面","耳の奥践問題 第7回1/7"],"a":0,"e":"嗅細胞は鼻腔の奥の上皮に分布しており、粘膜で覆われています。"},{"l":"m","u":15,"s":3,"q":"健康な犬に毎日必要な水の量の目安として、テキストに書かれているものはどれですか。","c":["体重1kgあたり約5ml","体重1kgあたり約500ml","体重1kgあたり約50ml","体重に関係なく1日1リットル"],"a":2,"e":"目安として健康な犬の場合、体重1kgあたり約50mlの水が毎日必要です。特にドライフードは水分含有量が少ないため、必ず新鮮な水と一緒に与えます。"},{"l":"m","u":2,"s":1,"q":"コマンドの「シット」は、どのような意味ですか。","c":["来い","伏せ","付け","お座り"],"a":3,"e":"「シット」は「お座り」です。"},{"l":"m","u":1,"s":4,"q":"第1章の内容として、誤っているものはどれですか。","c":["群れで生活するオオカミは一定の領域内でのみ生活する","オオカミの群れが獲物を得た場合、最後に食べるのがリーダーである","犬のメスの発情期は通常年に二回である","犬は家族の中で自分の義務を知りたいと思う"],"a":1,"e":"群れが獲物を得た場合、まず食べるのは群れのリーダーです。"},{"l":"m","u":15,"s":3,"q":"犬の水分量に影響するものとして、テキストに挙げられていないものはどれですか。","c":["気温","フードの種類","運動量","毛の色"],"a":3,"e":"水分量は、フードの種類や気温、運動量などによって大きく左右されます。"},{"l":"m","u":24,"s":4,"q":"老犬介護に人生を捧げることについて、テキストではどのような危険性があるとしていますか。","c":["犬が太りすぎる危険性","犬がしつけを忘れる危険性","飼い主自身が体調を崩したり、精神に変調をきたしたりする危険性","危険性はない"],"a":2,"e":"飼い主自身が体調を崩したり、精神に変調をきたしたりという危険性が大いにあります。周りの医師や介護士などに話を聞いてもらい、心の負担を軽減させることがとても重要です。"},{"l":"m","u":6,"s":1,"q":"公共の場にペットを連れて行く場合の「大前提」として、テキストに書かれているものはどれですか。","c":["人の多い時間帯に行くこと","必ずペット用のカートに乗せること","しっかりとしつけをして、他人に迷惑をかけないこと","洋服を着せること"],"a":2,"e":"公共の場に連れて行く場合には、しっかりと「しつけ」をして他人に迷惑をかけないことが大前提です。糞尿の始末をキチンとすることも当然のことです。"},{"l":"m","u":18,"s":3,"q":"避難所での苦情や咬傷事故に注意しても飼養が出来ない時の対応として、テキストに書かれているものはどれですか。","c":["犬を放す","車内に閉じ込める","親戚や知人に預かりをお願いする","避難所の外につなぎっぱなしにする"],"a":2,"e":"飼養が出来ない時は、親戚や知人に預かりをお願いします。"},{"l":"m","u":20,"s":2,"q":"ペット保険を選ぶときの「三つのポイント」に含まれないものはどれですか。","c":["割引制度","契約可能年齢と更新可能年齢","犬の毛色","保障内容"],"a":2,"e":"ペット保険は、ポイント1：契約可能年齢と更新可能年齢、ポイント2：保障内容、ポイント3：割引制度をチェックして選びます。"},{"l":"m","u":13,"s":2,"q":"ドッグカフェでのマナーとして、テキストの内容に合うものはどれですか。","c":["専用のイスがなければ、テーブルのフックにリードをつなぎ床に座らせる","人の食事を少し分けて与える","施設内でトイレシートを使ってトイレをさせる","人が座るイスに愛犬を座らせる践問題 第7回2/7"],"a":0,"e":"テーブルや人が座るイスに愛犬を座らせるのはマナー違反です。イスに座らせたいなら犬専用のイスがあるか尋ね、無ければテーブルのフックにリードをつなぎ床に座らせます。"},{"l":"m","u":5,"s":3,"q":"ダックスフンドの性格について、テキストに書かれているものはどれですか。","c":["フレンドリーだが、元々猟犬なので頑固な面もある","泳ぎが得意で水辺を好む","とても臆病で人に慣れない","番犬として攻撃的"],"a":0,"e":"ダックスフンドはフレンドリーですが、元々猟犬なので頑固な面もあります。"},{"l":"m","u":20,"s":4,"q":"WHO（世界保健機関）によるズーノーシスの定義として正しいものはどれですか。","c":["人から人へうつる病気","犬だけが人にうつす病気","脊椎動物と人の間を自然な条件下で伝搬する微生物による病気または感染（動物等では病気にならない場合もある）","動物同士でのみうつる病気"],"a":2,"e":"WHOではズーノーシスを「脊椎動物と人の間を自然な条件下で伝搬する微生物による病気または感染症（動物等では病気にならない場合もある）」と定義しています。"},{"l":"m","u":9,"s":3,"q":"座って、頭を興味深げにまっすぐに立てている犬の気持ちとして、テキストに書かれているものはどれですか。","c":["服従している","怖がっている","縄張りを守ろうとしている","とても楽しい気分"],"a":3,"e":"座って、頭を興味深げにまっすぐに立てているのは、とても楽しい気分のしぐさです。"},{"l":"m","u":8,"s":3,"q":"十分な運動（お散歩）が大切な理由として、テキストに書かれているものはどれですか。","c":["問題行動の軽減につながる","毛を伸ばすため","体重を増やすため","歯を白くするため"],"a":0,"e":"十分な運動は問題行動の軽減につながります。外の匂いや他人・他犬とのふれあいなど、刺激と楽しみにもなります。"},{"l":"m","u":19,"s":4,"q":"人間の介護と比べて、犬の介護の負担が大きくなりやすい理由として、テキストに書かれているものはどれですか。","c":["対話ができないので協力を得られにくく、全てをしなければならないから","犬は病気にならないから","犬の介護は短期間で終わるから","犬は人間より体重が重いから"],"a":0,"e":"人間の場合「介助」といわれるように出来ないだけをサポートするのが基本ですが、犬の場合、対話が出来ないので協力を得られないことも少なく、全てをしなければいけません。"},{"l":"m","u":4,"s":4,"q":"犬の嗅覚が大脳辺縁系とつながっていることから、テキストではどのようなことができるとしていますか。","c":["匂いを正確に感知し、長く記憶できる","色を正確に見分けられる","高い音を聞き取れる","甘いものを好む"],"a":0,"e":"大脳辺縁系は記憶の中枢でもあるため、犬は匂いを正確に感知し、長く記憶できるといわれています。"},{"l":"m","u":11,"s":4,"q":"子犬の誕生と成長について、テキストの内容に合うものはどれですか。","c":["生まれてすぐに目が見える","生後1日で乳歯がそろう","生後2週間でひとりで餌を食べる","生まれたばかりの子犬は目が見えず耳も聞こえず、匂いで乳首を探す"],"a":3,"e":"生まれたばかりの赤ちゃん犬は目が見えず耳も聞こえません。いつも匂いで乳首を探します。生後二週間経つと目を開け、耳が聞こえるようになります。"},{"l":"m","u":3,"s":2,"q":"「家族の一員とすることはできるか？」について、テキストの考え方として正しいものはどれですか。","c":["一人だけの責任ではなく、家族全員の協力が必要","世話は子どもにまかせるのがよい","忙しい時はペットシッターにまかせればよい","飼いたいと言った人ひとりの責任で飼う"],"a":0,"e":"家族単位で飼うことが多いと思われますが、一人だけの責任で飼養するのではなく、家族全員の協力が必要です。"},{"l":"m","u":21,"s":4,"q":"「イタズラできない部屋作り」を迎える前からしておく理由として、テキストに書かれているものはどれですか。","c":["掃除が楽になるから","法律で決まっているから","犬が部屋を気に入らないから","一度口にしてしまうと「楽しかったから、またかじろう！」と繰り返すようになり、やめさせるのは大変だから"],"a":3,"e":"一度口にしてしまうと「楽しかったから、またかじろう！」と繰り返すようになり、やめさせるのは大変になることがあります。はじめから経験させないように迎える前から部屋作りをします。"},{"l":"m","u":14,"s":3,"q":"犬のヒゲについて、テキストに書かれているものはどれですか。","c":["猫よりも重要な役割がある","毎日切る必要がある","現代の犬では退化し切ってもほとんど影響がないとされるが、過度なお手入れは推奨できないという意見もある","切ると歩けなくなる"],"a":2,"e":"現代の犬では退化しており、切ってもほとんど影響がないとされます。ただし感覚毛としての働きも否定できず、過度なお手入れは推奨できないという意見もあります。"},{"l":"m","u":15,"s":2,"q":"一日一回でフードを与えると、どのような問題が起きることがあるとされていますか。","c":["水を飲まなくなる","慌てて飲み込んで肥満の原因になったり、のどに詰まらせる原因になる","歯が丈夫になりすぎる","胃が小さくなる"],"a":1,"e":"犬は一回で一日分のフードを食べられるほどの胃を持っているため、目の前にあるフードをおなか一杯に食べてしまう習性があります。一日一回の場合、慌てて飲み込んで肥満の原因になったり、のどに詰まらせる原因になることがあるので、一日に数回に分けて与えます。"},{"l":"m","u":15,"s":4,"q":"「ペットフードの表示に関する公正競争規約」は、何という法律に基づく業界のルールですか。","c":["不当景品類及び不当表示防止法","動物愛護管理法","身体障害者補助犬法","狂犬病予防法"],"a":0,"e":"ペットフードの表示に関する公正競争規約は、不当景品類及び不当表示防止法に基づく業界のルールで、用途・内容量・与え方・成分などが記載されます。"},{"l":"m","u":20,"s":3,"q":"マダニについての記述として、テキストの内容に合うものはどれですか。","c":["体液を吸うことにより100〜200倍の大きさになり、バベシア症を発症させることがある","大きさは2〜3cmで、すぐに気づく","人には決して寄生しない","室内のじゅうたんの中だけに住む"],"a":0,"e":"マダニは野原・山林・河川などに生息し、2〜3mm程度の大きさの寄生虫です。犬に寄生した段階では気づかないことが多いのですが、体液を吸うことにより100〜200倍の大きさになります。バベシア症の原虫が犬の体液中に侵入し、赤血球に寄生してバベシア症を発症する場合があります。"},{"l":"m","u":18,"s":2,"q":"テキストで、災害時に持つリードとしておすすめされているものはどれですか。","c":["リードは不要","のびるリード","細いひも","ウエストリード"],"a":3,"e":"リードは連れて歩くのに必ず必要で、一本予備を持っておきます。リードがすぐ装着できるように普段から首輪をするようにし、ウエストリードがオススメです。"},{"l":"m","u":24,"s":3,"q":"葬儀・火葬についての記述として、誤っているものはどれですか。","c":["火葬は、遺体が落ち着くまで数か月待ってから手配するのがよい","犬が亡くなったらできるだけ早く火葬の手配をする","個別立会い葬は、場所と時間が決まっているため希望時間に行けないなどの注意が必要","訪問火葬は、近所トラブルになるケースもある践問題 第7回4/7"],"a":0,"e":"きれいなうちに火葬してあげるために、犬が亡くなったらできるだけ早く火葬の手配をします。火葬した後は時間に余裕が出来るため、お骨をどうするかを決めます。"},{"l":"m","u":17,"s":3,"q":"悪化防止の応急手当についての記述として、誤っているものはどれですか。","c":["傷口を噛みそうな場合は、エリザベスカラーを装着する","骨折の部位が曲がっている場合に、無理やり添え木をあてることは禁物である","ガラスや棒など大きな異物が深く刺さっている場合は、すぐに抜き取る","耳や鼻は、止血後も頭を振ることで再度出血することが多い"],"a":2,"e":"ガラスや棒など大きな異物が深く刺さっている場合は、刺さったまま抜かないでください。"},{"l":"m","u":20,"s":4,"q":"動物由来感染症の「ベクター媒介」として、ノミが媒介する病気はどれですか。","c":["ペスト","腸管出血性大腸菌感染症","日本脳炎","ライム病"],"a":0,"e":"ノミはペスト、蚊は日本脳炎・デング熱、ダニ類はダニ媒介脳炎・ライム病、ハエは腸管出血性大腸菌感染症です。"},{"l":"m","u":12,"s":5,"q":"犬の病気やケガの治療は、人の健康保険のような公的な保険がないため、治療費は原則としてどうなりますか。","c":["市区町村がすべて負担する","獣医師会がすべて負担する","全額自己負担になる（ペット保険に入っていれば一部が補償される）","3割負担になる"],"a":2,"e":"【テキスト外】ペットには公的な健康保険制度がないため、動物病院での治療費は全額自己負担です。そのため民間の「ペット保険」に加入すると、契約に応じて治療費の一部が補償されます。テキストでもペット保険を「臨時でかかるお金」に入れています。"},{"l":"m","u":17,"s":4,"q":"仰向けで脈拍が触れにくいときに、テキストですすめている方法はどれですか。","c":["しっぽの先で計測する","4本足で立たせて計測する","首の横で計測する","逆さにして計測する"],"a":1,"e":"仰向けで脈拍が触れない時は、4本足で立たせて計測します。"},{"l":"m","u":3,"s":4,"q":"「家族としての犬」の4つの心がけとして、テキストに挙げられていないものはどれですか。","c":["食事や環境にも気配りを","共生するためのしつけを","犬の好きなように過ごさせる","終生飼養が可能か？"],"a":2,"e":"4つの心がけは、終生飼養が可能か？・共生するためのしつけを・適切な飼養管理を・食事や環境にも気配りを、です。犬に好き放題をさせることではありません。"},{"l":"m","u":5,"s":4,"q":"使役動物の例として、テキストに挙げられていないものはどれですか。","c":["野生から捕獲されたイルカ","農耕用の牛や馬","金魚","伝書鳩"],"a":2,"e":"使役動物は人の作業に用いられる動物で、農耕用の牛や馬、伝書鳩、野生から捕獲されたイルカやアジアゾウなどが挙げられています。"},{"l":"m","u":22,"s":3,"q":"動物愛護管理法の基本原則で、命ある動物を大切に共に生きていこうという理念を何と言いますか。","c":["動物管理","動物福祉","動物取扱","動物愛護"],"a":3,"e":"基本原則では、命ある動物を大切に共に生きていこうという動物愛護の理念と共に、動物が心地よく・安心して・安全に暮らしていくための指標も掲げられています。"},{"l":"m","u":14,"s":4,"q":"避妊・去勢手術について、第14章に書かれている内容として正しいものはどれですか。","c":["手術は皮質代謝に影響しない","どの犬も生後1か月で手術する","オスだけが手術を受ける","大型犬は若齢期の手術を避ける"],"a":3,"e":"メスは乳腺腫瘍の予防のため初発情前の手術と言われてきましたが、2020年の米国の調査では異なる結果もあります。大型犬は若齢期の手術を避けます。オス・メス共に皮質代謝に影響します。"},{"l":"m","u":3,"s":3,"q":"テキストでは、しつけられていない犬は何の範疇（はんちゅう）だとしていますか。","c":["家畜","ペット","使役犬","野獣"],"a":3,"e":"しつけられていない犬は野獣の範疇です。しつけを受けて初めて、人との共生が可能となります。"},{"l":"m","u":17,"s":3,"q":"熱中症で体を冷やすときに、気化熱を利用する方法として正しいものはどれですか。","c":["体を濡らして風を当てる","温かいお湯をかける","日なたに寝かせる","体を毛布でくるむ"],"a":0,"e":"体を濡らして風を当てると、気化熱で体温が下がります。"},{"l":"m","u":1,"s":5,"q":"日本の縄文時代の貝塚などから見つかり、当時から人と犬が一緒に暮らしていたことを示すものとして、最も適切なものはどれですか。","c":["犬を描いた油絵","犬の首輪に使われた鉄の金具","丁寧に埋葬された犬の骨","犬の血統を記録した木簡"],"a":2,"e":"【テキスト外】縄文時代の貝塚などからは、丁寧に埋葬された犬の骨が見つかっています。犬が狩りのパートナーとして大切にされていたと考えられています。テキストの「日本でも旧石器時代から縄文時代の始まりの頃に犬と一緒に暮らしていたのは間違いない」という記述の裏付けです。"},{"l":"m","u":17,"s":2,"q":"心臓と呼吸が停止している状態から命を取り戻すための手当を何と言いますか。","c":["止血法","心肺蘇生法","背部叩打法","気化熱法"],"a":1,"e":"心臓と呼吸が停止することを心肺停止と言い、命を取り戻すための手当を「心肺蘇生法」と言います。"},{"l":"m","u":22,"s":1,"q":"動物愛護週間は毎年いつですか。","c":["10月20日〜10月26日","12月20日〜12月26日","4月1日〜4月7日","9月20日〜9月26日"],"a":3,"e":"動物愛護週間は毎年9月20日〜9月26日です。"},{"l":"m","u":19,"s":1,"q":"テキストでは、犬の介護について「何より大事なこと」は何だとしていますか。","c":["高価な介護用品をそろえること","できるだけ早く施設に預けること","平均寿命を伸ばすこと","介護状態にならないこと"],"a":3,"e":"何より大事なことは「介護状態にならないこと」。いかに「健康寿命」を伸ばすかということです。"},{"l":"m","u":23,"s":4,"q":"保護犬を譲り受ける人について、行政が行う講習会に関する条件として正しいものはどれですか。","c":["ドッグトレーナーの資格を持っていること","犬の適正飼養に関する講習会を受講している、または受講する意思があること","獣医師であること","講習会は関係ない"],"a":1,"e":"行政が行う犬の適正飼養に関する講習会を受講している、または受講する意思があることが条件です。"},{"l":"m","u":15,"s":3,"q":"犬の水についての記述として、誤っているものはどれですか。","c":["体に必要な水分のほとんど（90〜95%）は、飲み水及びフードから摂取される","ドライフードは水分含有量が多いので、水は少なめでよい","水分量は、フードの種類や気温、運動量などによって大きく左右される","水は体内の物質の運搬や体温調節など様々な役割を担う践問題 第7回6/7"],"a":1,"e":"ドライフードは水分含有量が少ない（10%以下）ため、与える時には必ず新鮮な水と一緒に与えます。"},{"l":"m","u":20,"s":3,"q":"賠償責任保険の説明として、テキストに書かれているものはどれですか。","c":["故意でなくても高価な花瓶を割るなど損害を発生させた時に、費用を負担してくれる保険","犬の治療費を補償する保険","飼い主の入院費を補償する保険","犬の葬儀代を補償する保険"],"a":0,"e":"犬は時々故意でなくても損害を発生させることがあります。例えば高価な花瓶を割ってしまうなどです。損害賠償ケースにおいて費用を負担してくれるのが賠償責任保険です。"},{"l":"m","u":8,"s":4,"q":"青年期（生後6か月〜2年）のオスについて、テキストに書かれているものはどれですか。","c":["発情は春だけ","繁殖行動はできない","特定の発情期がなく、いつでも繁殖行動ができる","年に1回だけ発情期がある"],"a":2,"e":"メスは最初の発情（10〜16か月齢）を迎えますが、オスは特定の発情期がないので、いつでも繁殖行動ができます。"},{"l":"m","u":14,"s":4,"q":"混合予防注射のコアについて、強い免疫が作られるために大切なこととして、テキストに書かれているものはどれですか。","c":["できるだけ多くの回数を打つこと","生後1か月以内にすべて打つこと","接種回数ではなく、16週齢以上に最終接種を行うこと","1歳以降に初めて打つこと"],"a":2,"e":"コアは接種回数ではなく、16週齢以上に最終接種を行うことで強い免疫が作られます。その後は抗体検査で接種の是非を判断します。"},{"l":"m","u":4,"s":4,"q":"犬の感覚についての記述として、誤っているものはどれですか。","c":["嗅細胞は人の約40倍以上ある","犬は人と同じように赤い色をはっきり見分ける","動くものにはすぐ反応する","低音域は人とそれほど違わない"],"a":1,"e":"犬は赤を感じる細胞がほとんどなく、赤は灰色に感じていると思われます。"},{"l":"m","u":14,"s":2,"q":"犬の被毛のうち、長く硬い毛を何と言いますか。","c":["感覚毛","産毛","保護毛（上毛）","緬毛（下毛）"],"a":2,"e":"犬の被毛は2種類あり、一つの毛包から長く硬い保護毛（上毛）と、更に短い波状の緬毛（下毛）がはえています。"},{"l":"m","u":19,"s":2,"q":"「口臭がきつくなった」という老化のサインが見られたとき、テキストではどうするとよいとしていますか。","c":["すぐに全ての歯を抜く","老化なので何もしない","そこから口内のお手入れを始め、習慣化（継続）する","食事の回数を減らす"],"a":2,"e":"予防について余り難しく考える必要はありません。「口臭がきつくなった」といった老化のサインが見られたら、そこから口内のお手入れを始めるとともに、習慣化（継続）しましょう。老化のサインを予防を始めるキッカケとすることで、将来の介護状態を改善することも出来ます。"},{"l":"m","u":12,"s":2,"q":"畜犬登録はどこで行うと書かれていますか。","c":["保健所","ペットショップ","動物病院","警察署"],"a":0,"e":"初期費用の表に「畜犬登録：保健所で登録。地域によって異なる」とあります。"},{"l":"m","u":8,"s":4,"q":"ワクチン接種について、第8章の内容として誤っているものはどれですか。","c":["ワクチン未接種でもトリミングサロンやペットホテルは必ず利用できる","狂犬病のワクチンは法律で年1回の義務","接種後30分は院内で見守ることもある","混合ワクチンは年3回接種する（個体差がある）"],"a":0,"e":"トリミングサロン・ドッグラン・ペットホテルも、ワクチン未接種だと利用できない場合が多いです。"},{"l":"m","u":24,"s":5,"q":"飼い犬が死亡したときに届け出ると、狂犬病予防法にもとづく登録がどうなりますか。","c":["登録が抹消され、毎年の狂犬病予防注射の通知なども届かなくなる","登録は一生残り、注射の義務も続く","新しい犬に自動的に登録が移る","何も変わらない践問題 第8回1/7"],"a":0,"e":"【テキスト外（補足）】犬が死亡したときに市区町村に届け出ると、狂犬病予防法にもとづく犬の登録が抹消されます。届け出をしないと、毎年の狂犬病予防注射の案内が届き続けることもあります。テキストの「30日以内に自治体に死亡届を提出」の理由の一つです。"},{"l":"m","u":17,"s":4,"q":"意識確認の方法として、テキストに挙げられていないものはどれですか。","c":["声をかけて軽く肩を叩く","大きな音を出して驚かせる","後ろ足の肉球に軽く圧を加えて引っぱる","目尻を指先で軽くトントンする"],"a":1,"e":"意識確認は、①声をかけて軽く肩を叩く ②後ろ足の肉球に軽く圧を加えて引っぱる ③目尻を指先で軽くトントン（まぶたが動くか）、です。"},{"l":"m","u":18,"s":4,"q":"犬の防災用品で、食器代わりにも使えるとテキストに書かれているものはどれですか。","c":["ポリ袋","毛布","ビニールシート","ブラシ"],"a":0,"e":"ポリ袋は、ゴミ袋としてはモチロン食器代わりに使用することも可能です。"},{"l":"m","u":11,"s":4,"q":"「家族になる」までの子犬について、テキストの内容と合わないものはどれですか。","c":["引っ越すまでに兄弟との遊び方を学ぶ","生後2週から4週で人間の家に引っ越せる","生後8週から10週でひとりで餌を食べられる","まず自分の新しい名前を聞き分ける"],"a":1,"e":"人間家族の家に引っ越せるのは生後8週から10週です。"},{"l":"m","u":18,"s":4,"q":"災害時のペットについての考え方として、テキストの内容と合わないものはどれですか。","c":["家族同様のペットと生き別れにならない準備が必要","飼い主よりもまずペットを先に避難させることが最も大切","おびえたペットが人を攻撃することもある","生き残ったペットが生態系を破壊する原因になることもある"],"a":1,"e":"ペットのためには飼い主が無事に生き残ることが最も大切です。"},{"l":"m","u":4,"s":2,"q":"犬は近くのものに焦点を合わせるのが苦手です。どのくらいより近いものは明確に見ることができないと言われていますか。","c":["100cm","300cm","30cm","10cm"],"a":0,"e":"犬は近くのものに焦点を合わせることが困難なため、100cmよりも近くにあるものは明確に見ることが出来ないと言われています。"},{"l":"m","u":16,"s":3,"q":"トリミング・ホテル以外のサービスとして、テキストに挙げられているものはどれですか。","c":["予防接種","出張トリミング","血液検査","レントゲン撮影"],"a":1,"e":"トリミング・ホテル以外のサービスとして、出張トリミング・ペットシッター・送迎サービス・セレモニーなどが挙げられています。"},{"l":"m","u":15,"s":4,"q":"「注意が必要な食べ物」とその理由の組み合わせとして、正しいものはどれですか。","c":["生肉 ― ビタミンC","ほうれん草 ― ビオチン欠乏","レバー ― シュウ酸","珈琲・緑茶・紅茶 ― カフェイン"],"a":3,"e":"珈琲・緑茶・紅茶はカフェイン、生肉は寄生虫・細菌、レバーはビタミンA、ほうれん草はシュウ酸、生たまごはビオチン欠乏が注意点です。"},{"l":"m","u":3,"s":3,"q":"「終生飼養」についての記述として、誤っているものはどれですか。","c":["引越しや結婚、転勤など予測できない変化があっても、中途半端な考えで飼わない","犬の寿命が伸び、15年以上生きることも少なくないと知っておく","病気などの対応、法律や登録、予防注射に対応できるようにする","介護が必要になった場合は、手放してもしかたがない"],"a":3,"e":"手間がかかっても、介護が必要となっても、途中で手放さずにその死を見送ってあげることが大切です。"},{"l":"m","u":19,"s":3,"q":"「介護疲れ」を防ぐために大切なこととして、テキストの内容と合わないものはどれですか。","c":["人（業者）に頼る","他人に頼らず、飼い主ひとりで全てがんばる","がんばり過ぎない","適度にリフレッシュする"],"a":1,"e":"終生お付き合いすることを前提に大切なことは、「がんばり過ぎないこと」「適度にリフレッシュすること」「手を抜けるところは手を抜くこと」「人（業者）に頼ること」です。"},{"l":"m","u":8,"s":1,"q":"愛犬が自宅に来たら、まず何をするべきだとされていますか。","c":["動物病院での健康診断","ペットホテルの下見","ドッグランでの運動","トリミングサロンでのカット"],"a":0,"e":"愛犬が自宅に来たら、まずは動物病院での健康診断です。健康チェックや必要な予防接種やワクチン接種を行います。"},{"l":"m","u":16,"s":2,"q":"トリミングサロンでの歯石取り（麻酔をかけない施術）にかかる時間の目安はどのくらいですか。","c":["1〜2時間","丸一日","5〜20分程度","半日"],"a":2,"e":"5〜20分程度を目安として、麻酔をかけない施術を行います。"},{"l":"m","u":1,"s":4,"q":"最近の研究・観察の結果、現在の飼い犬はどのようにしてできたと考えられていますか。","c":["オオカミが進化して犬の祖先となり、その野生犬が家畜化された","ジャッカルとコヨーテがかけあわされた","タヌキが進化した","キツネが家畜化された"],"a":0,"e":"最近の研究・観察の結果、オオカミが進化して犬の祖先となり、その野生犬が家畜化されて現在の飼い犬になったと考えられています。"},{"l":"m","u":23,"s":4,"q":"介在動物に犬が選ばれる理由として、テキストに挙げられていないものはどれですか。","c":["犬は人と共進化してきた","家畜化の過程で人とのコミュニケーションが強化されてきた","3つの随伴性とオペラント条件付けによって行動を強化する","犬は人間の言葉を話せるから"],"a":3,"e":"テキストでは、人と共進化してきたこと、人とのコミュニケーションが強化されてきたこと、随伴性とオペラント条件付けによって行動を強化することを挙げています。"},{"l":"m","u":5,"s":4,"q":"盲導犬が日本に紹介されたきっかけとして、テキストに書かれているものはどれですか。","c":["ポンペイの壁画が日本で展示されたこと","アメリカの青年が盲導犬を連れて日本に立ち寄ったこと","日本の法律で決まったこと","ドイツの兵士が日本に来たこと"],"a":1,"e":"アメリカの青年が盲導犬を連れて日本に立ち寄ったことがきっかけで紹介され、国産第1号は「チャンピィ」です。"},{"l":"m","u":2,"s":3,"q":"狂犬病予防法で、登録と毎年1回のワクチン接種が義務づけられているのは、生後何日以上の犬ですか。","c":["生後180日以上","生後1年以上","生後91日以上","生後30日以上"],"a":2,"e":"国内での流行を防ぐため、生後91日以上の犬の登録と毎年1回のワクチン接種が、狂犬病予防法によって義務づけられています。"},{"l":"m","u":21,"s":4,"q":"住環境の10のポイントについての記述として、誤っているものはどれですか。","c":["湿度は50〜60%（夏は50%以下）にキープする","電気コードには金属製のカバーを巻く","夏は室温を28℃以上に保つ","ゴミ箱はふた付きのものを選ぶ"],"a":2,"e":"温度は18〜24℃、夏は26℃以下に調整します。"},{"l":"m","u":15,"s":4,"q":"成長期を過ぎたらフードを見直す目安として、小・中型犬はいつ頃までが成長期用とされていますか。","c":["1歳半頃","3歳頃","3か月頃","9か月頃"],"a":3,"e":"成犬時の総体重の80%に達するまでが成長期用で、小・中型犬は9か月頃、大型犬は1歳頃、超大型犬は1歳半頃までが目安です。"},{"l":"m","u":19,"s":4,"q":"足腰のトラブルについて、テキストの内容と合わないものはどれですか。","c":["小型犬でも高齢になってから足腰のトラブルを発症することがある","犬は常に4本脚で体重を支えているので生活に大きな問題となる","「足をひきずるようになった」などは足腰のトラブルを疑う","足腰のトラブルは大型犬だけに起こる"],"a":3,"e":"足腰のトラブルは大型犬に多いと思われがちですが、体重の軽い小型犬でも発生します。"},{"l":"m","u":14,"s":3,"q":"歯周病の予防・治療を目的とする歯石除去について、テキストではどのように説明していますか。","c":["全身麻酔が必須で、無麻酔による歯石除去は世界の獣医師学会でも「してはならない」事項である","犬の負担を避けるため、無麻酔で行うべきである","歯石は自然に取れるので、除去は必要ない","飼い主が自宅で行うのがよい"],"a":0,"e":"歯周病予防・治療を目的とする歯石除去は全身麻酔が必須です。無麻酔による歯石除去は世界の獣医師学会でも「してはならない」事項になっています。"},{"l":"m","u":20,"s":5,"q":"2013年に日本で初めて確認され、マダニが媒介し、人や犬・猫にも感染する、致死率の高い感染症はどれですか。","c":["麻しん（はしか）","インフルエンザ","ノロウイルス感染症","重症熱性血小板減少症候群（SFTS）"],"a":3,"e":"【テキスト外】重症熱性血小板減少症候群（SFTS）は、主にマダニが媒介するウイルス感染症で、2013年に国内で初めて報告されました。人のほか犬や猫も感染し、発症した犬や猫から人へ感染した例も報告されています。テキストの「新しい感染症」「マダニ対策」とつながります。"},{"l":"m","u":2,"s":4,"q":"第2章の内容として、誤っているものはどれですか。","c":["水は体の10〜20%を占めている","犬には何をしてよいか・してはいけないかの指示を待つ習性がある","散歩の時は必ずリードにつなぎ、糞便は持ち帰る","ほとんどの疾病に対しワクチンが開発されている"],"a":0,"e":"水は体の60〜70%を占めています（第2章）。"},{"l":"m","u":13,"s":4,"q":"立ち寄り先の施設でのマナーとして、テキストの内容と合わないものはどれですか。","c":["同伴可能でも施設ごとの規定を守る","いきなり施設に入らず、軽く散歩してトイレを促す","施設に着いたらすぐ施設内でトイレシートを使ってトイレをさせる","立ち寄り先には事前に確認の連絡をする"],"a":2,"e":"施設内でトイレシートを使ってはいけません。軽く散歩してトイレを促します。"},{"l":"m","u":14,"s":4,"q":"犬の骨格についての記述として、誤っているものはどれですか。","c":["犬は人と同じように足の裏全体で体重を支える","オスの陰茎骨は人にはない","体格が違っても骨の数や種類は基本的に変わらない","尻尾の長さは尾椎の数で決まる"],"a":0,"e":"犬は指先だけで体重を支えます（手根・足根骨格の指骨の構造が違う）。"},{"l":"m","u":19,"s":2,"q":"壮年期からシニア期にかけて見られる「老化のサイン」は、大きくどの2つに分けられますか。","c":["食事の変化と睡眠の変化","性格の変化と鳴き声の変化","体重の変化と体温の変化","見た目の変化と行動の変化"],"a":3,"e":"壮年期からシニア期に掛けて良く見られる「老化のサイン」には、大きく「見た目の変化」と「行動の変化」という2つの変化が現れます。体の外、つまり見た目や行動についてはオーナー自身が普段、犬と接する中で観察（確認）することが可能です。"},{"l":"m","u":18,"s":2,"q":"防災手帳の「愛犬のプロフィール」に、家族と愛犬が一緒に写っている写真を貼っておく理由として、テキストに書かれているものはどれですか。","c":["飼い主であることを証明する時に役立つから","避難所で自慢できるから","記念になるから","写真がないと避難所に入れないから践問題 第8回5/7"],"a":0,"e":"家族と愛犬が一緒に写っている写真は、飼い主であることを証明する時に非常に役に立ちます。スマホ等にも画像として保存しておくと、防災手帳を持ち歩いていない時でも安心です。"},{"l":"m","u":13,"s":4,"q":"ドッグスポーツについての記述として、誤っているものはどれですか。","c":["ノーズワークは、他の競技系に比べると低運動量だが、頭を使うスポーツである","アジリティは、1978年のクラフトショーでのデモンストレーションが起源とされる","犬ぞりは、北アメリカやロシア、ヨーロッパなど北極地方で人気のウインタースポーツである","ドッグサップは、暑い夏には楽しめないアウトドアスポーツである"],"a":3,"e":"暑い夏に愛犬と楽しめるアウトドアスポーツは少ないですが、ドッグサップは真夏でも楽しめるアウトドアスポーツです。"},{"l":"m","u":15,"s":3,"q":"ペットフード安全法に基づく5つの表示義務に含まれないものはどれですか。","c":["名称","給与量（与え方）","原材料名","賞味期限"],"a":1,"e":"5つの表示義務は、名称・賞味期限・原材料名・原産国名・事業者名及び住所です。用途・内容量・与え方・成分は「ペットフードの表示に関する公正競争規約」で記載されているものです。"},{"l":"m","u":22,"s":4,"q":"法改正の「動物の適正飼養のための規制の強化」に含まれないものはどれですか。","c":["特定動物の交雑種を規制対象に追加","すべての犬に血統書を義務づける","動物虐待に関する罰則の引き上げ","都道府県知事による指導・助言・立入り検査"],"a":1,"e":"規制の強化には、適正飼養が困難な場合の繁殖防止の義務化、都道府県知事による指導・助言・報告徴収・立入り検査、特定動物に関する規定の強化、愛玩目的の飼養などの禁止、特定動物の交雑種の規制、虐待の罰則引き上げがあります。"},{"l":"m","u":1,"s":3,"q":"家畜の番や狩りのサポートなどの需要が多く、特に犬種の改良が進んだのはどこですか。","c":["遊牧を中心とした生活をしていた中東","稲作を中心とした生活をしていたアジア","漁業を中心とした生活をしていた南の島々","狩猟を中心とした生活をしていた欧州"],"a":3,"e":"野生の犬を飼い慣らした人間は、様々な仕事に適している犬を作りました。狩猟を中心とした生活をしていた欧州では特に、家畜の番や狩りのサポートなどの需要が多く、犬種の改良が進みました。"},{"l":"m","u":10,"s":4,"q":"『犬の十戒』の4番目で、いつまでも怒ったり、お仕置きに閉じ込めたりしないでほしい理由として書かれているものはどれですか。","c":["犬は怒られても気にしないから","犬にはあなたしかいないから","犬は閉じ込められるのが好きだから","犬はすぐに忘れるから"],"a":1,"e":"十戒の4番目は「いつまでも怒ったり、お仕置きに閉じ込めたりしないで。ボクにはあなたしかいない」という内容です。"},{"l":"m","u":5,"s":3,"q":"介助犬の仕事として、テキストに挙げられていないものはどれですか。","c":["物を拾う・運ぶ","緊急時の救助要請","扉の開閉","ドアのチャイムを聞き分けて知らせる"],"a":3,"e":"ドアのチャイムなどを聞き分けて伝えるのは聴導犬の仕事です。"},{"l":"m","u":8,"s":3,"q":"お散歩マナーとして、テキストの内容と合わないものはどれですか。","c":["リードは安全のために短く持つ","迷子札をつける","うんちは必ず持って帰る","暑い季節でも、短い時間なら車内に残して待たせてよい"],"a":3,"e":"車内への放置はしないでね、特に暑い季節は要注意です、とあります。柱や木に繋ぎっぱなしにしないことも挙げられています。"},{"l":"m","u":20,"s":4,"q":"メンデルの法則のうち「独立の法則」の説明として正しいものはどれですか。","c":["劣性の形質が第二世代に現れる","環境だけで形質が決まる","形質に関わる遺伝子が複数ある場合、遺伝子はそれぞれ独立して子供に引き継がれる","親の形質のうち優性の形質だけが現れる"],"a":2,"e":"独立の法則は、優性・分離の法則に従う遺伝子の他にも形質に関わる遺伝子が存在する場合、遺伝子はそれぞれ独立し子供に引き継がれるというものです。"},{"l":"m","u":8,"s":4,"q":"犬同士のあいさつや遊び、じゃれあいを通して噛みつき加減を覚えるのは、どの時期とされていますか。","c":["老年期","新生子期","成年期","社会化期（第一次社会化期）"],"a":3,"e":"社会化期（生後4〜13週齢頃）は、犬同士のあいさつや遊び、じゃれあいを通して噛みつき加減を覚えます。"},{"l":"m","u":20,"s":4,"q":"避妊・去勢手術と同時に乳歯の抜歯を検討するとよい理由として、テキストに書かれているものはどれですか。","c":["抜歯すると太らないから","手術や麻酔の回数を減らせ、犬への負担が軽減されるから","乳歯は大人になってから必要だから","手術代が無料になるから践問題 第8回7/7"],"a":1,"e":"小型犬は乳歯が抜けきらない例が多く、放置すると歯周病の原因になります。避妊・去勢手術と同時に残った乳歯の抜歯を検討すれば、手術や麻酔の回数も減らせるので犬への負担も軽減されます。"},{"l":"m","u":15,"s":4,"q":"犬の食事についての記述として、誤っているものはどれですか。","c":["オオカミの子孫として人間とは全く異なる栄養補給が必要","給与量通りにはかって与える","手作り食はミネラル・ビタミン不足やアンバランスに注意","犬は人と同じように唾液に消化酵素が多く、よく噛んで食べる"],"a":3,"e":"犬は人のように唾液に消化酵素がほとんどなく、咀嚼しないで飲み込みます。"},{"l":"m","u":8,"s":4,"q":"飼い主が病気や事故にあったときのために「しつけをしておく」ことが役立つ理由として、テキストに書かれているものはどれですか。","c":["保険料が安くなるから","飼い主の病気が治るから","新たな飼い主がみつかりやすくなるから","犬がひとりで暮らせるようになるから"],"a":2,"e":"預け先や新たな飼い主を探すのも飼い主の責任です。しつけをしておくことで新たな飼い主がみつかりやすくなります。"},{"l":"m","u":13,"s":2,"q":"愛犬を車に乗せるとき、テキストではどのように固定するのがよいとしていますか。","c":["助手席に自由に座らせる","首輪にリードをつけて座席に固定する","同乗者がだっこする","ケージやクレートに入れて、リアシートや荷室に固定する"],"a":3,"e":"愛犬はケージやクレートに入れてリアシートや荷室に固定します。首輪にリードをつけて固定すると、急ブレーキの時に首が引っ張られて危険です。固定されないので同乗者のだっこも避けます。"},{"l":"m","u":9,"s":4,"q":"犬の「体のことば」について、テキストの内容と合わないものはどれですか。","c":["高く飛ぶのは遊びたがっているしぐさである","仰向けに寝転ぶのは服従のしぐさである","尻尾を後ろ足のあたりで振っているときはリラックスしている","毛が逆立っているときはリラックスしている"],"a":3,"e":"毛が体にぴったりと着いている（逆立っていない）ときがリラックスしている状態です。"},{"l":"m","u":23,"s":3,"q":"JKCの分類で、愛玩犬「コンパニオン＆トイ・ドッグ」は第何グループですか。","c":["第9グループ","第10グループ","第5グループ","第1グループ"],"a":0,"e":"JKCの第9グループに、愛玩犬、コンパニオン・ドッグ＆トイ・ドッグがあります。愛玩犬は家庭犬、伴侶や愛玩目的の犬と定義されています。"},{"l":"m","u":15,"s":4,"q":"ライフステージによる分類で、「成犬期」の期間として書かれているものはどれですか。","c":["成長期後7年間（大型犬5年）","誕生〜30日くらい","約8〜10歳以降","生後20〜60日くらい"],"a":0,"e":"成犬期は成長期後7年間（大型犬5年）です。"},{"l":"m","u":5,"s":2,"q":"ダックスフンドが胴長短足の体型に改良された理由として、テキストに書かれているものはどれですか。","c":["穴の中の獲物を追いかけやすくするため","家の中で飼いやすくするため","速く走れるようにするため","寒さに強くするため践問題 第9回1/7"],"a":0,"e":"ダックスフンドは、穴の中の獲物を追いかけやすいように胴長短足の体型に改良された犬種です。フレンドリーですが、元々猟犬なので頑固な面もあります。"},{"l":"m","u":11,"s":3,"q":"犬の一日の日課で、夕方にすることとしてテキストに書かれているものはどれですか。","c":["二回目の散歩に出かけ、その後夕ご飯を食べて家族と遊ぶ","一日一回だけの食事をとる","朝まで眠る","トリミングに行く"],"a":0,"e":"夕方は二回目の散歩に出かけ、その後夕ご飯を食べて家族と遊びます。"},{"l":"m","u":13,"s":5,"q":"車酔いしやすい犬への対策として、一般に適切とされるものはどれですか。","c":["窓をすべて閉め切り、換気をしない","長距離のドライブで一気に慣れさせる","出発直前にたくさん食事をさせる","短い距離のドライブから少しずつ慣らし、必要なら獣医師に相談して酔い止め薬を使う"],"a":3,"e":"【テキスト外】車酔いには、短い距離から少しずつ慣らす、車に乗ると楽しいことがあると覚えさせる、空腹すぎ・満腹すぎを避ける、換気をするなどの対策があります。テキストの持ち物リストにも「犬用酔い止め薬」があり、使う場合は獣医師に相談します。"},{"l":"m","u":13,"s":4,"q":"ドライブで愛犬の不安を取り除く方法として、テキストに書かれているものはどれですか。","c":["車の中で叱る","いきなり長距離ドライブに連れて行く","車に乗るときだけおやつを抜く","近場の公園などに車で行き、一緒に遊ぶことを繰り返す"],"a":3,"e":"近場の公園などに車で行き一緒に遊ぶことを繰り返すと「車に乗ると楽しい遊びが待っている」とインプットされます。"},{"l":"m","u":3,"s":3,"q":"「家族の一員とすることはできるか？」の考え方として正しいものはどれですか。","c":["家族の協力は不要","子どもだけで世話をする","家族全員の協力が必要","一番犬が好きな人だけが世話をする"],"a":2,"e":"家族単位で飼うことが多いと思われますが、一人だけの責任で飼養するのではなく、家族全員の協力が必要です。"},{"l":"m","u":20,"s":3,"q":"動物由来感染症が問題となる背景として、テキストに挙げられていないものはどれですか。","c":["ワクチンの開発が進みすぎたこと","野生動物のペット化","交通手段の発展による人ともの速やかな移動","先進国での高齢者など感染抵抗力が弱い人々の増加践問題 第9回2/7"],"a":0,"e":"背景には、人間の社会環境の変化と行動の多様化があげられています。交通手段の発展、人口の都市集中、土地開発と自然環境の変化、先進国では高齢者など感染抵抗力が弱い人々の増加や野生動物のペット化などです。"},{"l":"m","u":20,"s":2,"q":"メスの避妊手術のメリットとして、テキストで予防になると挙げられているものはどれですか。","c":["子宮蓄膿症や卵巣腫瘍・乳腺腫瘍","歯周病","白内障","精巣腫瘍や肛門周囲腺腫"],"a":0,"e":"オスなら精巣腫瘍や肛門周囲腺腫など、メスなら子宮蓄膿症や卵巣腫瘍・乳腺腫瘍などの予防になります。"},{"l":"m","u":8,"s":4,"q":"成年期（2〜8歳）の特徴として、テキストに書かれているものはどれですか。","c":["母犬が授乳する","骨格の成長が止まり、性格も落ち着く","最初の発情を迎える","感覚器が急速に発達する"],"a":1,"e":"成年期は骨格の成長が止まり、性格も落ち着きます。自信を持った行動が多くなります。"},{"l":"m","u":14,"s":3,"q":"寄生虫や感染症の予防についての記述として、誤っているものはどれですか。","c":["蚊がいなくなったら、フィラリア予防薬はすぐに投与をやめてよい","ノミの予防薬は、年間を通して投与する","狂犬病によって、いまだ世界で年間6万人が死亡している","回虫は人にも寄生するので注意が必要である"],"a":0,"e":"犬心臓糸状虫（フィラリア）予防薬は、蚊が吸血し始めてから一か月後、吸血終了後一か月後は必ず投与します。蚊がいなくなってもすぐに投薬をやめないで下さい。"},{"l":"m","u":2,"s":4,"q":"犬に指示を出すことについて、テキストの内容に合うものはどれですか。","c":["犬は指示を待つ習性があり、言葉や手の合図で明確な指示をもらう必要がある","指示は一日一回だけにする","犬は自分で考えるので指示は不要","指示は言葉だけで出し、手の合図は使ってはいけない"],"a":0,"e":"犬は何をしてよいか・してはいけないかの指示を待つ習性があり、言葉や手の合図で明確な指示をもらう必要があります。"},{"l":"m","u":18,"s":4,"q":"「日常の備え」として家族で決めておく例に含まれないものはどれですか。","c":["連絡方法","家族の集合（避難）場所","犬を避難所に置いて帰る日","親戚・知人の連絡先の確認"],"a":2,"e":"家族の集合場所、連絡方法、親戚・知人の連絡先、ご近所とのコミュニケーション、迷子札をつけることなどが挙げられています。"},{"l":"m","u":5,"s":4,"q":"犬種とテキストの分類の組み合わせとして誤っているものはどれですか。","c":["グレート・デーン ― 使役犬","シベリアンハスキー ― 視覚ハウンドタイプ","ヨークシャーテリア ― テリアタイプ","シェットランド・シープドッグ ― 牧羊犬・牧畜犬"],"a":1,"e":"シベリアンハスキーは原始的な犬（スピッツタイプ）です。"},{"l":"m","u":22,"s":4,"q":"動物愛護管理法についての記述として、誤っているものはどれですか。","c":["動物愛護週間は毎年9月20日〜9月26日である","みだりに殺したり傷つけたりした場合は5年以下の懲役または500万円以下の罰金","ネグレクトは虐待行為には当たらない","出生後56日を経過しない犬猫の販売が制限された"],"a":2,"e":"必要なお世話をしない、不衛生な環境で飼うといったネグレクトも虐待行為です。"},{"l":"m","u":9,"s":3,"q":"犬がリラックスしているときのサインとして、テキストの内容と合わないものはどれですか。","c":["テイルを高く伸ばしたまま立っている","耳が垂れ下がっている","尻尾を後ろ足のあたりで振っている","耳を前の方に立てている践問題 第9回3/7"],"a":0,"e":"テイルを高く伸ばしたまま立ち、歯をむき出しにするのは、自分の縄張りを守ろうとしているしぐさです。"},{"l":"m","u":23,"s":2,"q":"保護犬の譲渡を受けるとき、飼養環境を把握するために提出するものは何ですか。","c":["狂犬病予防注射済証","動物取扱業登録証","犬等譲受申請書","血統書"],"a":2,"e":"譲渡では、飼養環境を把握するための「犬等譲受申請書」を提出します。"},{"l":"m","u":12,"s":4,"q":"愛犬の費用について、テキストの内容と合わないものはどれですか。","c":["初期費用の合計には犬を迎える費用（犬の代金）が含まれている","生涯コストは500万円を超えるとも言われる","避妊・去勢手術の費用がかかる場合もある","金額はあくまで目安で、犬種や地域などで異なる"],"a":0,"e":"初期費用の表の合計金額には、犬を迎える費用は含まれていません。"},{"l":"m","u":4,"s":4,"q":"感覚と、それをつかさどる器官の組み合わせとして誤っているものはどれですか。","c":["味覚 ― 味蕾","聴覚 ― 水晶体","嗅覚 ― 嗅細胞","色覚 ― 錐状細胞"],"a":1,"e":"水晶体は視覚（目）の器官です。聴覚は外耳・中耳・内耳がつかさどります。"},{"l":"m","u":4,"s":3,"q":"耳のうち「中耳」は何で構成されていますか。","c":["耳介と耳道","蝸牛と延髄","水晶体と網膜","鼓膜と耳小骨"],"a":3,"e":"中耳は鼓膜と耳小骨で構成され、外耳から伝わった空気の震えによる鼓膜の振動を、耳小骨を経て内耳へ届けます。"},{"l":"m","u":17,"s":4,"q":"心臓マッサージについての記述として、誤っているものはどれですか。","c":["体重をかけるように圧迫する","心臓が動いている時にも予防のために行う","圧迫20回ごとを目安に2回人工呼吸をする","1秒に1〜2回リズミカルに圧迫する"],"a":1,"e":"心臓マッサージは心臓が動いていない時にのみ、人工呼吸とセットで行います。"},{"l":"m","u":20,"s":4,"q":"犬の健康管理のチェック項目として、テキストに挙げられていないものはどれですか。","c":["毎日体重が増えているか","発熱はないか","目ヤニ・耳だれ・鼻水などは出ていないか","元気・食欲はあるか"],"a":0,"e":"チェック項目は、元気・食欲、鳴き声・呼吸、咳・くしゃみ、毛づや、目ヤニ・耳だれ・鼻水、糞・尿の状態、発熱です。"},{"l":"m","u":24,"s":4,"q":"亡くなった愛犬の安置の方法として、テキストの内容と合わないものはどれですか。","c":["暖かい部屋で直射日光に当てる","頭・首・おなかの下に保冷剤やドライアイスを入れる","あたたかい内に手足を自然な体勢に折りたたむ","燃えないものは火葬できないため取り除く"],"a":0,"e":"直射日光のあたらない涼しい場所に安置します。特に夏の暑い時は遺体が痛みやすいので温度調節をします。"},{"l":"m","u":6,"s":4,"q":"子どもが「犬を飼いたい」と言ったときに、家族で考えることについて、テキストではどのように説明していますか。","c":["飼わない結論なら考えたことは無駄になる","結論がどうであれ、無駄にはならない","大人だけで決めて子どもには説明しない","子どもが小さいうちは話し合わなくてよい"],"a":1,"e":"飼いたい動物を調べ、スペース・世話・お金について家族で考えることは、結論がどうであれ無駄にはなりません。結論が出たら子どもが小さくても大人がキチンと説明します。"},{"l":"m","u":19,"s":4,"q":"見た目の変化（老化のサイン）とその内容の組み合わせとして、誤っているものはどれですか。","c":["口内 ― 毛量が減った","目 ― 目が白っぽくなった","体毛 ― 白髪が目立つ","皮膚 ― しこり、いぼ、タコなどが増えた践問題 第9回5/7"],"a":0,"e":"毛量が減ったのは体毛の変化です。口内の変化は、口臭が強くなった・歯石が増えた・よだれをたらすのが増えた、などです。"},{"l":"m","u":21,"s":4,"q":"愛犬の居場所を静かな場所にすることの効果として、テキストに書かれているものはどれですか。","c":["体重が増える","安心できる居場所ができるとストレスがたまりにくくなる","吠え声が大きくなる","毛が早く伸びる"],"a":1,"e":"安心できる居場所ができるとストレスがたまりにくくなります。"},{"l":"m","u":11,"s":4,"q":"子犬の成長についての記述として、誤っているものはどれですか。","c":["生まれたばかりの子犬は、目で母犬を見つけて乳首を探す","およそ一歳で最初の交尾期が訪れる","散歩では、人のそばを歩き、道路に飛び出さないことなどを学ぶ","犬の学びは一生涯（12年〜18年）続くこともある"],"a":0,"e":"生まれたばかりの赤ちゃん犬は目が見えず耳も聞こえません。お母さんの温かさを感じ、いつも匂いで乳首を探します。"},{"l":"m","u":17,"s":4,"q":"熱中症に特に注意が必要な犬として、テキストに挙げられていないものはどれですか。","c":["体調を崩しやすいシニア","心臓や呼吸器系に問題がある犬","暑さに弱い短頭種","若くて健康な長毛ではない犬"],"a":3,"e":"心臓や呼吸器系に問題がある場合や暑さに弱い短頭種、体調を崩しやすいシニアは特に注意が必要です。"},{"l":"m","u":20,"s":4,"q":"1歳以降に混合ワクチンで防げる病気として、テキストに挙げられていないものはどれですか。","c":["犬ジステンパー","狂犬病","犬パラインフルエンザ","犬パルボウイルス性腸炎践問題 第9回6/7"],"a":1,"e":"混合ワクチンで防げる病気は、犬ジステンパー・犬パルボウイルス性腸炎・犬伝染性肝炎・犬アデノウイルス感染症・犬パラインフルエンザなどです。狂犬病は狂犬病予防ワクチンで防ぎます。"},{"l":"m","u":1,"s":4,"q":"犬種の改良が特に進んだ欧州で、多かった需要として挙げられているものの組み合わせはどれですか。","c":["荷物の運搬と漁","家畜の番や狩りのサポート","医療と福祉","ショーと競技"],"a":1,"e":"狩猟を中心とした生活をしていた欧州では特に、家畜の番や狩りのサポートなどの需要が多く、犬種の改良が進みました。"},{"l":"m","u":8,"s":2,"q":"母犬から授かった免疫力が切れるのは、生後何週頃と言われていますか。","c":["1〜2週頃","20〜30週頃","8〜16週頃","1歳頃"],"a":2,"e":"母犬から授かった免疫力が切れるのが生後8〜16週頃と言われています。その時期に合わせ、新たな免疫力を自分で獲得させるために混合ワクチンを接種します。個体差があるため、年3回接種します。"},{"l":"m","u":14,"s":4,"q":"歯周病にかかりやすい犬として、テキストに挙げられていないものはどれですか。","c":["高齢犬","口腔ケアが出来ていない犬","短頭種","硬いものをよく噛む若い大型犬"],"a":3,"e":"高齢犬、免疫力の落ちた犬、口腔ケアが出来ていない犬、小型犬、短頭種（パグ・シーズーなど）が挙げられています。柔らかい食べ物は歯周病を加速させます。"},{"l":"m","u":15,"s":2,"q":"フードを別のものに切り替えるとき、テキストではどのくらいの期間をかけるのがよいとしていますか。","c":["1〜2週間かけて、新しいフードの割合を徐々に増やす","3日間絶食させてから切り替える","1日で一気に切り替える","半年かけて切り替える践問題 第9回7/7"],"a":0,"e":"急にフードを切替えると、吐いてしまったり下痢をすることもあります。犬の状態を見ながら、1〜2週間かけて新しいフードの割合を徐々に増やしていきます。"},{"l":"m","u":13,"s":4,"q":"ドッグスポーツとその特徴の組み合わせとして、誤っているものはどれですか。","c":["エクストリーム ― 音楽に合わせて犬と踊る","ガンドッグ ― 獲物のダミーを回収する","ドッグプラー ― Pullerという玩具を使う","犬ぞり ― マッシャーが乗りタイムを競う"],"a":0,"e":"音楽に合わせて犬と踊るのはドッグダンス（K-9フリースタイル）です。エクストリームは飼い主と愛犬が共に楽しむことに主眼を置いた比較的単純なコースの競技です。"},{"l":"m","u":16,"s":4,"q":"お手入れ・トリミングについての記述として、誤っているものはどれですか。","c":["ショートヘアーの犬のブラッシングは一週間に一回","「トリミング中の電話」は店舗での不快要素である","入浴にはベビーシャンプーや犬用の入浴洗剤を使う","犬は毎日シャンプーするのがよい"],"a":3,"e":"入浴は、犬がひどく汚れている時や排泄物にまみれた時だけにします。"},{"l":"m","u":8,"s":4,"q":"お散歩マナー・個人賠償責任保険について、誤っているものはどれですか。","c":["散歩中や公共の場での事故は自宅の約2倍","リードは短く持つ","マイクロチップの装着が義務化されている","個人賠償責任保険は、単体の保険として加入するのがほとんどである"],"a":3,"e":"個人賠償責任保険（日常生活賠償責任保険）は、単体より特約でついていることがほとんどです。"},{"l":"m","u":20,"s":2,"q":"ペット保険を選ぶときの「三つのポイント」に含まれないものはどれですか。","c":["割引制度","保障内容","犬の毛色","契約可能年齢と更新可能年齢践問題 第10回1/7"],"a":2,"e":"ペット保険は、ポイント1：契約可能年齢と更新可能年齢、ポイント2：保障内容、ポイント3：割引制度をチェックして選びます。"},{"l":"m","u":22,"s":4,"q":"法改正・環境省令についての記述として、誤っているものはどれですか。","c":["天然記念物の犬種を繁殖者から直接購入する場合は49日（7週）の例外規定がある","動物取扱責任者は店舗に3名以上選任しなければならない","殺傷の罰則は懲役5年・罰金500万円に引き上げられた","登録を受けた犬猫を所有した者には変更届け提出の義務がある"],"a":1,"e":"動物取扱責任者は、店舗・事業所に常勤の職員のなかから必ず1名選任することが法律で定められています。"},{"l":"m","u":19,"s":4,"q":"高齢期の「介護」についての記述として、誤っているものはどれですか。","c":["介護は完治することを前提に行う","「人（業者）に頼ること」も大切である","終末期には緩和ケアが大切である","基本、最期を看取るまで付き合う必要がある"],"a":0,"e":"「介護」は完治することが前提ではありません。与えられた状況に合わせて生活に支障が無いよう助ける（対処する）ことが目的です。"},{"l":"m","u":20,"s":4,"q":"動物由来感染症についての記述として、誤っているものはどれですか。","c":["新興感染症の多くは動物由来感染症である","厚生労働省はワンヘルスの考え方を推進している","人獣共通感染症は全ての感染症の1割ほどである","WHOが確認しているものだけで200種類以上ある"],"a":2,"e":"動物から人へ、人から動物へ伝搬可能な感染症（人獣共通感染症）は、全ての感染症の約半数を占めています。"},{"l":"m","u":3,"s":4,"q":"第3章の内容として、誤っているものはどれですか。","c":["従来は敷地の一隅につないでおく飼い方だった","犬は肛門や足の裏もなめる","集合住宅では飼養の許可を事前に調査する","犬は人間とは違い、15年以上生きることはない"],"a":3,"e":"犬の寿命が大幅に伸び、15年以上生きることも少なくありません。"},{"l":"m","u":14,"s":4,"q":"健康診断・予防について、第14章の内容として誤っているものはどれですか。","c":["回虫は人にも寄生する","狂犬病の予防注射は法律で所有者の義務","フィラリア予防薬は、蚊がいなくなったらすぐに投与をやめる","最低年に一回は血液・レントゲン・エコー検査"],"a":2,"e":"フィラリア予防薬は、蚊が吸血し始めて一か月後、吸血終了後一か月後まで投与します。"},{"l":"m","u":4,"s":4,"q":"犬が砂糖や果物の糖などの甘いものを非常に好む理由として、テキストではどのように説明していますか。","c":["本来は肉食である犬が、糖や甘味物質を栄養価の高いエネルギーとして認識する能力を持っているため","犬は苦みしか感じないため、甘いものが珍しいから","甘いものを食べると歯が丈夫になるため","人と一緒に暮らすうちに、人の好みがうつったため"],"a":0,"e":"犬が甘いものを好むのは、本来肉食である犬が、果物などの糖や甘味物質を栄養価の高いエネルギーとして認識する能力を持っているためです。"},{"l":"m","u":20,"s":4,"q":"マダニが媒介し、原虫が犬の赤血球に寄生して発症する病気はどれですか。","c":["フィラリア症","バベシア症","レプトスピラ症","パスツレラ症践問題 第10回3/7"],"a":1,"e":"バベシア症の原虫が犬の体液中に侵入し、赤血球に寄生してバベシア症を発症する場合があります。"},{"l":"m","u":15,"s":4,"q":"ペットフード安全法による5つの表示義務の組み合わせとして、正しいものはどれですか。","c":["名称・価格・給与量・成分・原産国名","原材料名・価格・販売店名・電話番号・成分","賞味期限・内容量・用途・与え方・成分","名称・賞味期限・原材料名・原産国名・事業者名及び住所"],"a":3,"e":"ペットフード安全法の5つの表示義務は、名称・賞味期限・原材料名・原産国名・事業者名及び住所です。用途・内容量・与え方・成分は公正競争規約で記載されるものです。"},{"l":"m","u":1,"s":4,"q":"「犬種」と「雑種」について、テキストの内容に合うものはどれですか。","c":["犬種は10種類しかない","犬種は細目にあたる犬の亜種で、両親及び祖父母が同じ犬種に属するもの以外は雑種と区別される","犬種は犬科の別の動物のこと","雑種は両親が同じ犬種のこと"],"a":1,"e":"犬種とは細目にあたる犬の亜種のことです。両親及び祖父母が同じ犬種に属するもの以外は「雑種」と区別されます。"},{"l":"m","u":15,"s":2,"q":"犬にとって有害な成分を持つ観葉植物と、その有害な部位の組み合わせとして、テキストに書かれているものはどれですか。","c":["ユリ ― 花びらだけ","チューリップ ― 球根","朝顔 ― 葉だけ","ポインセチア ― 根だけ"],"a":1,"e":"身近なユリ（植物全体）、チューリップ（球根）、ポインセチア（茎と葉）、朝顔（種子）なども犬にとって有毒な成分を持っています。"},{"l":"m","u":12,"s":4,"q":"小型犬の費用の目安で、初期費用・年間コスト・生涯費用の組み合わせとして正しいものはどれですか。","c":["初期費用66,500円・年間コスト523,500円・生涯費用785万円","初期費用56,500円・年間コスト231,500円・生涯費用約1,500万円","初期費用56,500円・年間コスト345,500円・生涯費用約518万円","初期費用61,500円・年間コスト434,500円・生涯費用約652万円"],"a":2,"e":"小型犬は初期費用56,500円、年間コスト345,500円、生涯費用（15年）約518万円です。"},{"l":"m","u":4,"s":1,"q":"テキストで「犬の感覚の中で最も重要なもの」とされているのはどれですか。","c":["味覚","嗅覚","聴覚","視覚"],"a":1,"e":"嗅覚は匂いを感じる仕組みで、犬の感覚の中で最も重要なものです。"},{"l":"m","u":24,"s":4,"q":"第24章の内容として、誤っているものはどれですか。","c":["優良な火葬業者は80社程度といわれている","ペットロスの悲しみは平均10か月ほど","合同火葬では、火葬後にお骨を受け取ることができる","犬が亡くなったら30日以内に自治体に死亡届を提出する践問題 第10回4/7"],"a":2,"e":"合同火葬は火葬の立ち会いやお骨あげは出来ず、遺骨も戻らず共同のお墓に埋葬されます。"},{"l":"m","u":23,"s":4,"q":"セラピー・ドッグと愛玩犬について、テキストの内容と合わないものはどれですか。","c":["セラピー・ドッグは特定のサイズや犬種に限定されない","セラピー・ドッグはコンパニオン・ドッグ・グループの犬だけに限られる","愛玩犬は体が小さく、飼い主に従順で比較的飼いやすい","動物介在活動の犬のほとんどが家庭で飼育されている愛玩犬"],"a":1,"e":"セラピー・ドッグは特定のサイズや犬種に限定されず、コンパニオン・ドッグ・グループの他にも、ゴールデン・ラブラドール・雑種まで実にさまざまな犬たちが活躍しています。"},{"l":"m","u":3,"s":4,"q":"家庭の中で犬と暮らすときの考え方として、テキストの内容と合わないものはどれですか。","c":["法律では「犬権」という言葉はない","人の社会生活に組み込まれてこそ、犬の存在がある","犬権を尊重するためには、犬に好き放題をさせることが大切である","家庭の中において、人権と犬権を認識し尊重するのが前提である"],"a":2,"e":"テキストでは「犬に好き放題をさせることではなく、人の社会生活に組み込まれてこそ犬の存在があるのだ、との姿勢を維持したい」としています。"},{"l":"m","u":1,"s":1,"q":"犬の祖先は、一般的に何から分岐したと言われていますか。","c":["オオカミ","タヌキ","コヨーテ","キツネ"],"a":0,"e":"犬の祖先は、約1万5千年前にオオカミから分岐したと言われています。"},{"l":"m","u":10,"s":1,"q":"『犬の十戒』とは、どのようなものですか。","c":["作者不詳の十編の詩","獣医師会が定めた十のルール","犬のしつけの十のコマンド","動物愛護管理法の十か条"],"a":0,"e":"『犬の十戒』と呼ばれる作者不詳の十編の詩です。犬の気持ちに寄り添い、沢山の愛情を与えてあげることを伝えています。"},{"l":"m","u":9,"s":4,"q":"犬の声と体のことばについて、テキストの内容に合うものはどれですか。","c":["犬は自分の群れと気持ちを通じさせるために、うなりや遠吠えなどの声を使う","犬は人の言葉で話す","犬は鳴き声を出さない","犬は声を使わず体だけで話す"],"a":0,"e":"犬は体と声の二つの方法で話をします。自分の群れと気持ちを通じさせるために、うなり・吠え・不安げに鳴く・悲しそうにキャンキャン鳴く・遠吠えをします。"},{"l":"m","u":17,"s":4,"q":"呼吸停止の場合と心臓停止の場合に行う心肺蘇生の手順の組み合わせとして、正しいものはどれですか。","c":["呼吸停止：心臓マッサージだけ 心臓停止：人工呼吸だけ","呼吸停止：何もしない 心臓停止：気道確保だけ","呼吸停止：気道確保と人工呼吸 心臓停止：気道確保・人工呼吸・心臓マッサージ","呼吸停止も心臓停止も心臓マッサージだけ"],"a":2,"e":"呼吸停止の場合は1（気道確保）と2（人工呼吸）を、心臓停止の場合は1から3（心臓マッサージ）までを行います。"},{"l":"m","u":18,"s":4,"q":"犬の防災用品と準備についての記述として、誤っているものはどれですか。","c":["水が使えない場合を考え、食器は使い捨てのものがよい","動物手帳は収容施設に預ける時に必要","常備薬は災害が起きてから動物病院でもらえばよい","リードは一本予備を持っておく"],"a":2,"e":"かかり付けの動物病院が被災し、診療を受けられなくなることも考えられます。薬は数日分を余分に用意し、処方箋のコピーと一緒に防水袋に入れます。"},{"l":"m","u":20,"s":3,"q":"遺伝についての記述として、誤っているものはどれですか。","c":["メンデルの法則には、優性の法則・分離の法則・独立の法則がある","遺伝子は、行動の特徴だけでなく身体の特徴にも影響を与える","環境の働きのみで表現される「獲得形質」は、子に遺伝する","股関節形成不全症は大型犬に多発する遺伝病である"],"a":2,"e":"個体発生の一過程での環境の働きのみにより表現される形質を「獲得形質」と呼び、これはその個体に限り持続し子供に遺伝することはありません。"},{"l":"m","u":19,"s":5,"q":"動物愛護管理法で、動物の所有者の責務として定められている、動物がその命を終えるまで適切に飼養することを何と言いますか。","c":["終生飼養","動物取扱業","同行避難","適正譲渡"],"a":0,"e":"【テキスト外】動物愛護管理法では、所有者は動物がその命を終えるまで適切に飼養すること（終生飼養）に努めなければならないとされています。テキストの「法律として『終生飼養の義務』が強化され」という記述とつながります。"},{"l":"m","u":24,"s":2,"q":"他のペットと共に合同葬儀をし火葬するサービスで、遺骨が戻らず共同のお墓に埋葬されるのはどれですか。","c":["個別立会い葬","訪問火葬","個別一任火葬","合同火葬"],"a":3,"e":"合同火葬は、他のペットと共に合同葬儀をし火葬するサービスです。火葬の立ち会いやお骨あげは出来ず、遺骨も戻らず共同のお墓に埋葬されます。"},{"l":"m","u":5,"s":4,"q":"ワーキング・ドッグと仕事の組み合わせとして、誤っているものはどれですか。","c":["麻薬探知犬 ― 空港の税関などに常駐する","臭気選別犬 ― 地震の不明者を嗅覚で探す","セラピー・ドッグ ― ストレスや孤独感を和らげる","検疫探知犬 ― 手荷物から動植物検疫の対象を嗅ぎ分ける践問題 第10回6/7"],"a":1,"e":"臭気選別犬は、容疑者と現場の証拠の匂いが一致するかを確認する警察犬の仕事です。地震などの不明者を探すのは災害救助犬です。"},{"l":"m","u":6,"s":3,"q":"犬が子どもや家族にもたらす効果についての記述として、テキストの内容と合わないものはどれですか。","c":["新しい家族が増えることで、孤独感が癒される","子どもが「飼いたい」と言うのは一時的な気持ちではないので、すぐに飼うのがよい","家族で共通の話題が増え、家族間のコミュニケーションが活発になる","気持ちが穏やかになり、ストレスが減る"],"a":1,"e":"テキストでは「お子さんは一時的な気持ちで言っている場合もあります」としています。飼いたい動物のことを調べ、家族で考えることが大切です。"},{"l":"m","u":15,"s":4,"q":"体重5kgの健康な犬が毎日必要とする水の量の目安として、正しいものはどれですか（体重1kgあたり約50ml）。","c":["約250ml","約2,500ml","約500ml","約25ml"],"a":0,"e":"体重1kgあたり約50mlなので、5kg×50ml＝約250mlです。"},{"l":"m","u":17,"s":4,"q":"脱水症のサインとして、テキストに挙げられていないものはどれですか。","c":["足先が冷たい","粘膜が乾く","尿の量が急に増え、色が薄くなる","歯肉がねばつく"],"a":2,"e":"脱水症のサインは、粘膜が乾く・歯肉がねばつく・尿が減る／濃い・足先が冷たい・脈拍が速いなどです。"},{"l":"m","u":7,"s":4,"q":"第7章で、犬を探す場所として挙げられているものの組み合わせはどれですか。","c":["ペットショップやブリーダー・保健所・保護団体・知り合い・インターネット","学校・図書館・病院","スーパー・コンビニ・駅","動物園・水族館・博物館"],"a":0,"e":"ペットショップやブリーダー、保健所、保護団体からの引き取り、知り合いから譲り受ける、インターネットで見つける、が挙げられています。"},{"l":"m","u":5,"s":5,"q":"国際畜犬連盟（FCI）や、日本のジャパンケネルクラブ（JKC）では、犬種をいくつのグループに分類していますか。","c":["7グループ","12グループ","10グループ","5グループ"],"a":2,"e":"【テキスト外】FCIやJKCでは、犬種を10のグループに分類しています。テキストの「スピッツタイプ」「テリアタイプ」「ダックスフンド」なども、この分類と近い考え方です。"},{"l":"m","u":2,"s":4,"q":"メス犬の繁殖に関する数値の組み合わせとして、正しいものはどれですか。","c":["性周期：6か月前後 発情期：4〜12日 妊娠期間：58〜63日","性周期：1か月 発情期：30日 妊娠期間：100日","性周期：1年 発情期：1日 妊娠期間：30日","性周期：6か月前後 発情期：58〜63日 妊娠期間：4〜12日践問題 第10回7/7"],"a":0,"e":"性周期は6か月前後、発情期は4〜12日、妊娠期間は58〜63日です。"},{"l":"b","u":1,"q":"人間と犬は約何年前から共生してきたと言われていますか？","c":["約5000年前","約1万年前","約2〜3万年前","約10万年前"],"a":2},{"l":"b","u":1,"q":"犬の祖先は一般的に何から分岐したと言われていますか？","c":["キツネ","オオカミ","コヨーテ","ジャッカル"],"a":1},{"l":"b","u":1,"q":"オオカミから犬への分岐（家畜化）が始まったのは約何年前ですか？","c":["5000年前","1万年前","1万5千年前","3万年前"],"a":2},{"l":"b","u":1,"q":"現在、世界中に認定されている犬種はおよそ何種類ですか？","c":["約100種類","約400種類","約1000種類","約5000種類"],"a":1},{"l":"b","u":1,"q":"各地の土着の種類も含めると、犬種は全部で何種類以上あると言われていますか？","c":["500種類以上","800種類以上","1000種類以上","2000種類以上"],"a":2},{"l":"b","u":1,"q":"両親および祖父母が同じ犬種に属するもの以外は何と区別されますか？","c":["純血種","希少 function fit(el,max,min){ if(!el) return; let f=max; el.style.fontSize=f+"px"; while(f>min&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){f-=1;el.style.fontSize=f+"px"} }
function ymd(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function touchDay(){const now=new Date(),t=ymd(now);if(S.day===t)return;const y=new Date(now);y.setDate(y.getDate()-1);S.streak=(S.day===ymd(y))?S.streak+1:1;S.day=t}

// ===== 音（BGM・効果音）=====
const AU={ctx:null,timer:null,gain:null,loopAt:0};
const hz=m=>440*Math.pow(2,(m-69)/12);
function actx(){ if(!AU.ctx){try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}} if(AU.ctx.state!=="running"){try{AU.ctx.resume()}catch(e){}} return AU.ctx }
function tone(f,t,d,vol,type,dest){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||c.destination);o.start(t);o.stop(t+d+.05)}
function se(n){ if(!S.se) return; const c=actx(); if(!c) return; const t=c.currentTime+.01;
  if(n==="tap") tone(880,t,.06,.03,"sine");
  else if(n==="ok"){tone(784,t,.14,.06,"sine");tone(1047,t+.1,.22,.06,"sine")}
  else if(n==="ng"){tone(330,t,.16,.05,"triangle");tone(262,t+.13,.24,.05,"triangle")}
  else if(n==="evo"){[72,76,79,84,88].forEach((m,i)=>tone(hz(m),t+i*.11,.3,.06,"triangle"))}
  else if(n==="done"){[72,79,84].forEach((m,i)=>tone(hz(m),t+i*.13,.35,.05,"sine"))}
}
const TR=[null,
 {bpm:104,mel:[[76,1],[79,1],[81,1],[79,1],[76,1],[72,1],[74,2],[76,1],[79,1],[81,1],[84,1],[79,4],[81,1],[79,1],[76,1],[79,1],[74,1],[76,1],[72,2],[74,1],[76,1],[79,1],[76,1],[72,4]],bass:[48,45,41,43,48,45,43,48]},
 {bpm:80,mel:[[69,1],[72,1],[77,2],[76,1],[74,1],[72,2],[74,1],[77,1],[81,1],[79,1],[77,4],[79,1],[81,1],[82,1],[81,1],[79,1],[77,1],[74,2],[72,1],[74,1],[76,1],[79,1],[77,4]],bass:[41,48,46,41,46,43,48,41]}];
function bgmStop(){ if(AU.timer){clearInterval(AU.timer);AU.timer=null} if(AU.gain&&AU.ctx){const g=AU.gain;try{g.gain.setTargetAtTime(0.0001,AU.ctx.currentTime,.05);setTimeout(()=>{try{g.disconnect()}catch(e){}},400)}catch(e){}} AU.gain=null }
function bgmStart(){ bgmStop(); const tr=TR[S.bgm]; if(!tr) return; const c=actx(); if(!c) return;
  const g=c.createGain(); g.gain.value=.55; g.connect(c.destination); AU.gain=g; AU.loopAt=c.currentTime+.1;
  const spb=60/tr.bpm;
  const sched=()=>{ if(!AU.gain||c.state!=="running") return; while(AU.loopAt<c.currentTime+.6){ let b=0; tr.mel.forEach(n=>{tone(hz(n[0]),AU.loopAt+b*spb,n[1]*spb*.95,.045,"triangle",g);b+=n[1]}); tr.bass.forEach((m,i)=>{tone(hz(m),AU.loopAt+i*4*spb,spb*1.8,.05,"sine",g);tone(hz(m+12),AU.loopAt+(i*4+2)*spb,spb*1.6,.03,"sine",g)}); AU.loopAt+=32*spb } };
  sched(); AU.timer=setInterval(sched,150);
}
// スマホ（特にiPhone）対策：指を離した瞬間のタップで音を有効化し、消音スイッチ中でも鳴るよう「再生」扱いにする
function silentUrl(){ const n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);b.fill(128,44);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"})) }
function unlock(){
  const c=actx(); if(!c) return;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback" }catch(e){}
  if(!AU.un){ AU.un=1;
    try{ if(!AU.el){ AU.el=new Audio(silentUrl()); AU.el.loop=true; AU.el.setAttribute("playsinline",""); } const p=AU.el.play(); if(p&&p.catch) p.catch(()=>{AU.un=0}); }catch(e){}
    try{ const bf=c.createBuffer(1,1,22050),s=c.createBufferSource(); s.buffer=bf; s.connect(c.destination); s.start(0) }catch(e){}
  }
  if(S.bgm&&!AU.timer) bgmStart();
}
["touchend","pointerup","click","keydown"].forEach(ev=>document.addEventListener(ev,unlock,{passive:true,capture:true}));
document.addEventListener("visibilitychange",()=>{ if(!AU.ctx) return;
  if(document.hidden){ try{AU.ctx.suspend()}catch(e){} try{AU.el&&AU.el.pause()}catch(e){} AU.un=0 }
  else if(S.bgm){ try{AU.ctx.resume().then(()=>{AU.loopAt=AU.ctx.currentTime+.1})}catch(e){} } });

   '<button class="ib '+(panel==="stats"?"on":"")+'" id="i0">📊</button><button class="ib '+(panel==="album"||panel==="photo"?"on":"")+'" id="i1">🎀</button>'+

// ===== けいこ・模擬テスト =====
let G=null;
function bySeen(list){return shuffle(list).sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0))}
function start(mode,arg){
  const pool=POOL[S.lv]; let list;
  if(mode==="review") list=shuffle(boxIds().map(id=>BYID[id])).slice(0,10);
  else if(mode==="unit") list=bySeen(pool.filter(x=>x.u===arg)).slice(0,10);
  else if(mode==="mock"){
    if(!(S.mock&&S.mock.lv===S.lv)){ S.mock={lv:S.lv,ids:shuffle(pool).slice(0,MOCK_N).map(x=>x.id),i:0,ok:0,wrong:[],sec:0}; save(); }
    list=S.mock.ids.map(id=>BYID[id]);
  }else{
    const bx=shuffle(boxIds()).slice(0,3).map(id=>BYID[id]);
    const rest=bySeen(pool.filter(x=>bx.indexOf(x)<0)).slice(0,10-bx.length);
    list=shuffle(bx.concat(rest));
  }
  if(!list.length){home("main");return}
  G={mode,arg,list,i:mode==="mock"?S.mock.i:0,ok:mode==="mock"?S.mock.ok:0,wrong:mode==="mock"?S.mock.wrong:[]};
  if(mode==="mock"){ stopTimer(); TM=setInterval(()=>{ if(!S.mock) return; S.mock.sec++; const c=$("clock"); if(c) c.textContent=clock(); if(S.mock.sec%10===0) save(); if(S.mock.sec>=MOCK_SEC) result(); },1000); }
  ask();
}
function clock(){const r=Math.max(0,MOCK_SEC-S.mock.sec);return "⏱ "+Math.floor(r/60)+":"+("0"+r%60).slice(-2)}
const MODE={keiko:"今日のけいこ",review:"復習道場",unit:"章べつけいこ",mock:"模擬テスト"};
function ask(){
  const q=G.list[G.i],st=stageOf(S.total),mock=G.mode==="mock";
  const u=LV[q.l].units[q.u-1];
  const lab=u.label+(q.s?"　"+"★".repeat(q.s):"")+(!mock&&S.box[q.id]!==undefined?"　復習":"");
  $("top").innerHTML=
   '<div class="bar"><button class="ib" id="quit">✕</button><div class="ava" id="avd">'+dogAva(false)+'</div><div class="ava">'+meiFace(st)+'</div><div class="title">'+MODE[G.mode]+'<small>'+LV[S.lv].name+'　'+(G.i+1)+' / '+G.list.length+'</small></div>'+
   '<div class="chip" id="clock">'+(mock?clock():"⭕ "+G.ok)+'</div></div>'+
   '<div class="prog"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div>'+
   '<div class="card" id="card"><div class="qlabel">'+esc(lab)+'</div><div class="qtext" id="qt"><span>'+esc(q.q)+'</span></div></div>';
  const order=shuffle([0,1,2,3]);
  $("bottom").innerHTML=order.map((k,n)=>'<button class="cell c'+n+'" data-k="'+k+'">'+esc(q.c[k])+'</button>').join("");
  $("bottom").querySelectorAll(".cell").forEach(b=>{fit(b,20,10);b.onclick=()=>answer(+b.dataset.k)});
  fit($("qt"),23,12);
  $("quit").onclick=()=>{se("tap");stopTimer();save();home("main",mock?"模擬テストを中断しました（つづきから再開できます）":"")};
}
function answer(k){
  const q=G.list[G.i],good=k===q.a,mock=G.mode==="mock";
  S.answered++; S.seen[q.id]=(S.seen[q.id]||0)+1; touchDay();
  const us=S.unit[q.l+q.u]||(S.unit[q.l+q.u]=[0,0]); us[0]++;
  if(good){ S.total++; G.ok++; us[1]++; if(S.box[q.id]!==undefined){ S.box[q.id]++; if(S.box[q.id]>=2) delete S.box[q.id]; } }
  else{ S.box[q.id]=0; G.wrong.push(q.id); }
  const cells=$("bottom").querySelectorAll(".cell");
  if(mock){
    S.mock.i=G.i+1; S.mock.ok=G.ok; S.mock.wrong=G.wrong; save(); se("tap");
    cells.forEach(b=>{b.disabled=true;b.classList.add(+b.dataset.k===k?"pick":"dim")});
    setTimeout(()=>{ if(!G||G.mode!=="mock") return; G.i++; if(G.i<G.list.length) ask(); else result(); },260);
    return;
  }
  save(); se(good?"ok":"ng");
  cells.forEach(b=>{const v=+b.dataset.k;b.disabled=true;b.classList.add(v===q.a?"ok":(v===k?"ng":"dim"))});
  const card=$("card"); card.classList.add("done"); $("qt").style.fontSize="";
  card.insertAdjacentHTML("beforeend",
    '<div class="verdict '+(good?"ok":"ng")+'"><span class="mark">'+(good?"⭕":"❌")+'</span>'+(good?"せいかい！":"ざんねん…")+(good&&S.box[q.id]===undefined?'<button class="sus" id="sus">📮 あやしい</button>':"")+'</div>'+
    '<div class="exp" id="exp">'+((!good||!q.e)?"正解は <b>"+esc(q.c[q.a])+"</b>"+(q.e?"<br>":""):"")+(q.e?esc(q.e):"")+'</div>');
  fit($("exp"),17,10);
  if(good) $("avd").innerHTML=dogAva(true);
  const sus=$("sus"); if(sus) sus.onclick=()=>{S.box[q.id]=0;save();sus.textContent="📮 復習箱へ";sus.disabled=true;se("tap")};
  $("clock").textContent="⭕ "+G.ok;
  $("bottom").insertAdjacentHTML("beforeend",'<button id="next">'+(G.i+1<G.list.length?"つぎへ":"けっか")+'</button>');
  $("next").onclick=()=>{ se("tap"); G.i++; if(G.i<G.list.length) ask(); else result(); };
  checkEvo();
}
function askReset(){
  const e=$("evo");
  e.innerHTML='<h2>記録をリセットしますか？</h2><p>正解数・メイの進化・復習箱・模試の記録が<br>ぜんぶ消えて、赤ちゃんメイにもどります。</p><button id="rsy" style="background:#f0607f;box-shadow:0 5px 0 #c9405e">リセットする</button><button id="rsn" style="background:#fff;color:#5a3d4a;box-shadow:0 5px 0 #ffc2d4">やめる</button>';

function checkEvo(){ const st=stageOf(S.total); if(st>S.stage){ S.stage=st; save(); evolve(st); } }
function evolve(st){
  const e=$("evo");
  e.innerHTML='<p>✨ おめでとう ✨</p><div class="big">'+scene(st)+'</div><h2>'+STAGES[st][0]+' に進化！</h2><p>あたらしい画像がアルバムに入ったよ</p><button id="evok">やったー！</button>';
  e.classList.add("on"); se("evo"); $("evok").onclick=()=>e.classList.remove("on");
}
function result(){
  stopTimer();
  const mock=G.mode==="mock",n=mock?MOCK_N:G.list.length,ok=G.ok,r=Math.round(ok/n*100),st=stageOf(S.total),pass=ok>=Math.ceil(n*PASS);
  let tiles,word;
  if(mock){
    const sec=S.mock.sec,done=S.mock.i;
    (S.hist[S.lv]||(S.hist[S.lv]=[])).push({ok:ok,sec:sec,d:ymd(new Date())}); if(S.hist[S.lv].length>20) S.hist[S.lv].shift();
    // 苦手な章（今回まちがえた問題の章）
    const cnt={}; G.wrong.forEach(id=>{const q=BYID[id];cnt[q.u]=(cnt[q.u]||0)+1});
    const weak=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).map(k=>LV[S.lv].units[k-1].short+"章").join("・");
    tiles='<div class="stat">得点<b>'+ok+' / '+n+'</b></div><div class="stat">判定<b class="s">'+(pass?"🌸 合格":"あと"+(Math.ceil(n*PASS)-ok)+"問")+'</b></div><div class="stat">時間<b class="s">'+Math.floor(sec/60)+'分'+(sec%60)+'秒</b></div>';
    word=(done<n?"時間切れ（"+done+"問まで解答）　":"")+"合格ライン "+Math.ceil(n*PASS)+"問（70%）"+(weak?"<br>まちがいが多い章："+weak:"");
    S.mock=null;
  }else{
    S.sets++;
    tiles='<div class="stat">正解<b>'+ok+' / '+n+'</b></div><div class="stat">正答率<b>'+r+'%</b></div><div class="stat">復習箱<b>'+boxIds().length+'問</b></div>';
    word=r>=90?"すごい！この調子！":r>=70?"合格ライン（70%）クリア！":"復習道場でもう一度がんばろう";
  }
  save(); se("done");
  $("top").innerHTML='<div class="bar"><div class="title">けっかはっぴょう<small>'+MODE[G.mode]+'（'+LV[S.lv].name+'）</small></div><div class="chip">🌸 '+S.total+'</div></div>'+
   '<div class="hero"><div class="pic">'+scene(st)+'</div></div><div class="stats" style="flex:none;height:24%">'+tiles+'</div><div class="note">'+word+'</div>';
  const mode=G.mode,arg=G.arg;
  $("bottom").innerHTML=
   '<button class="cell" id="r0"><span class="ico">🥋</span>'+(mock?"今日のけいこ":"もういちど")+'</button>'+
   '<button class="cell c1" id="r1"><span class="ico">📮</span>まちがい復習<small>'+boxIds().length+'問</small></button>'+
   '<button class="cell c2" id="r2"><span class="ico">📊</span>せいせき</button>'+
   '<button class="cell c3" id="r3"><span class="ico">🏠</span>ホーム</button>';
  $("r0").onclick=()=>{se("tap");start(mock||mode==="review"?"keiko":mode,arg)};
  $("r1").onclick=()=>{se("tap");if(boxIds().length) start("review"); else home("main","復習箱はからっぽ！")};
  $("r2").onclick=()=>{se("tap");home("stats")};
  $("r3").onclick=()=>{se("tap");home("main")};
  G=null; checkEvo();
}
home("main");
</script>
</body>
</html>
