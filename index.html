<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>メイのいぬ検定道場 Ver3</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb1;--pink-d:#f06292;--cream:#fff7ef;--lav:#c9b6ff;--lemon:#ffe08a;--ink:#5a3d4a;--ok:#35b98a;--ng:#f0607f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#ffe9f1;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-rows:6fr 4fr;overflow:hidden;
 background:radial-gradient(circle at 12% 8%,#fff 0 6px,transparent 7px),radial-gradient(circle at 88% 14%,#fff 0 4px,transparent 5px),linear-gradient(180deg,#ffd9e6,#fff3f7 60%)}
#top{min-height:0;overflow:hidden;padding:8px 12px 8px;display:flex;flex-direction:column;gap:7px}
#bottom{min-height:0;position:relative;overflow:hidden;background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -4px 14px rgba(240,98,146,.18);padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
.cell{min-height:0;min-width:0;overflow:hidden;border-radius:22px;background:#fff;border:3px solid #ffd0de;box-shadow:0 5px 0 #ffc2d4;font-weight:700;font-size:20px;line-height:1.25;padding:5px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s}
.cell:active{transform:translateY(4px);box-shadow:0 1px 0 #ffc2d4}
.cell .ico{font-size:28px;line-height:1}
.cell small{font-size:12px;font-weight:500;opacity:.8}
.c1{border-color:#bfe9d9;box-shadow:0 5px 0 #a9dfca}.c2{border-color:#d9ccff;box-shadow:0 5px 0 #c9b6ff}.c3{border-color:#ffe6a3;box-shadow:0 5px 0 #ffd974}
.cell.ok{background:#e3f9ef;border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:#167a57}
.cell.ng{background:#ffe6ec;border-color:var(--ng);box-shadow:0 5px 0 var(--ng);color:#b5304f}
.cell.pick{background:#efe8ff;border-color:#a48cf0;box-shadow:0 5px 0 #a48cf0}
.cell.dim{opacity:.45}
.cell[disabled]{pointer-events:none}
#next{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:linear-gradient(180deg,#ffa3c0,var(--pink-d));color:#fff;font-weight:900;font-size:16px;border:5px solid #fff;box-shadow:0 6px 14px rgba(240,98,146,.45);animation:pop .3s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}70%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
.bar{display:flex;align-items:center;gap:6px;flex:none}
.title{font-weight:900;font-size:17px;color:var(--pink-d);line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:11px;font-weight:700;color:#b98aa0}
.ava{width:42px;height:42px;flex:none;border-radius:50%;background:#fff;border:3px solid #ffc2d4;overflow:hidden}
.ava svg{width:100%;height:100%;display:block}
.chip{margin-left:auto;background:#fff;border-radius:999px;padding:4px 11px;font-weight:900;font-size:15px;border:2px solid #ffd0de;white-space:nowrap}
.ib{flex:none;height:34px;min-width:34px;padding:0 8px;border-radius:99px;background:#fff;border:2px solid #ffd0de;font-weight:900;font-size:14px;color:var(--pink-d)}
.ib.on{background:var(--pink-d);color:#fff;border-color:var(--pink-d)}
.seg{display:flex;background:#fff;border:2px solid #ffd0de;border-radius:99px;overflow:hidden;margin-right:auto}
.seg button{height:30px;padding:0 13px;font-weight:900;font-size:14px;background:none;color:#b98aa0}
.seg button.on{background:var(--pink-d);color:#fff}
.prog{flex:none;height:9px;border-radius:99px;background:#fff;overflow:hidden;border:2px solid #ffd0de}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:99px}
.card{flex:1;min-height:0;background:#fff;border-radius:24px;border:3px solid #ffd0de;padding:10px 13px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 6px 0 #ffd0de}
.qlabel{flex:none;align-self:flex-start;max-width:100%;background:var(--lemon);border-radius:99px;padding:1px 11px;font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtext{font-weight:700;font-size:23px;line-height:1.45;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center}
.card.done .qlabel{display:none}
.card.done .qtext{flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px!important;line-height:1.35;color:#8a6b78;font-weight:500}
.verdict{flex:none;display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;animation:bounce .35s}
.verdict .mark{font-size:46px;line-height:1}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.verdict .sus{margin-left:auto;font-size:12px;font-weight:700;background:#fff6d9;border:2px solid #ffe08a;border-radius:99px;padding:5px 10px;color:var(--ink)}
@keyframes bounce{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.exp{flex:1;min-height:0;background:#fff6d9;border-radius:16px;padding:7px 11px;font-size:17px;line-height:1.45;font-weight:500;overflow:hidden}
.exp b{color:var(--pink-d);font-weight:900}
.hero{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.hero .pic{height:100%;aspect-ratio:1;max-width:100%;border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 16px rgba(240,98,146,.25)}
.hero svg{width:100%;height:100%;display:block}
.name{flex:none;text-align:center;font-weight:900;font-size:19px;color:var(--pink-d);line-height:1.2}
.name small{display:block;font-size:12px;color:#8a6b78;font-weight:700}
.stats{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:1fr;gap:7px}
.stat{background:#fff;border-radius:18px;border:3px solid #ffd0de;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px;min-height:0;text-align:center;line-height:1.2;padding:2px}
.stat b{font-size:26px;font-weight:900;color:var(--pink-d);line-height:1.1}
.stat b.s{font-size:18px}
.units{flex:1;min-height:0;display:grid;gap:5px}
.unit{min-height:0;min-width:0;border-radius:12px;background:#fff;border:2px solid #ffd0de;font-weight:900;font-size:15px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}
.unit small{font-size:10px;font-weight:700;opacity:.85}
.unit.lo{background:#ffe1e8;border-color:#ffa9be}.unit.mi{background:#fff3c7;border-color:#ffd974}.unit.hi{background:#dcf7ea;border-color:#8fdcc0}
.album{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:6px}
.slot{background:#fff;border-radius:14px;border:3px solid #ffd0de;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;min-height:0;min-width:0;overflow:hidden;padding:3px;text-align:center;line-height:1.15;gap:2px}
.slot svg{width:100%;border-radius:8px;display:block;flex:none}
.slot.lock{background:#f6eef2;color:#b9a3ad;border-style:dashed}
.slot.lock span{font-size:20px}
.note{flex:none;text-align:center;font-size:12px;font-weight:700;color:#8a6b78;line-height:1.35}
.rbtn{flex:none;align-self:center;background:#fff;border:2px solid #ffa9be;border-radius:99px;padding:6px 18px;font-weight:900;font-size:13px;color:#d14d7c}
.link{background:none;font-size:12px;text-decoration:underline;color:#b98aa0;font-weight:700;padding:2px 6px}
#evo{position:absolute;inset:0;background:rgba(255,220,232,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;text-align:center;padding:20px}
#evo.on{display:flex}
#evo .big{width:72%;max-width:300px;aspect-ratio:1;border-radius:28px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px rgba(240,98,146,.35);animation:bounce .6s}
#evo .big svg{width:100%;height:100%;display:block}
#evo h2{font-size:25px;font-weight:900;color:var(--pink-d)}
#evo p{font-weight:700;font-size:15px}
#evo button{margin-top:4px;background:var(--pink-d);color:#fff;font-weight:900;font-size:18px;border-radius:99px;padding:10px 34px;box-shadow:0 5px 0 #d14d7c}
</style>
</head>
<body>
<div id="app"><div id="top"></div><div id="bottom"></div><div id="evo"></div></div>
<script>
// ===== イラスト（メイと愛犬ニューファンドランド・10段階） =====
const HAIR="#6b4636",SKIN="#ffe6d6";
let _uid=0;
function star4(x,y,r,f){return '<path d="M'+x+' '+(y-r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' Q'+x+' '+y+' '+x+' '+(y+r)+' Q'+x+' '+y+' '+(x-r)+' '+y+' Q'+x+' '+y+' '+x+' '+(y-r)+'Z" fill="'+f+'"/>'}
function heart(x,y,s,f){return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0 3 C-6 -4 -12 2 0 11 C12 2 6 -4 0 3Z" fill="'+f+'"/>'}
function flower(x,y,r,f){let h="";for(let i=0;i<5;i++){const a=i*1.2566;h+='<circle cx="'+(x+Math.cos(a)*r).toFixed(1)+'" cy="'+(y+Math.sin(a)*r).toFixed(1)+'" r="'+r+'" fill="'+f+'"/>'}return h+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*.8)+'" fill="#ffe08a"/>'}
function longHair(y,w){w=w||0;return '<path d="M'+(20-w)+' 60 Q20 18 60 18 Q100 18 '+(100+w)+' 60 L'+(104+w)+' '+y+' Q60 '+(y+8)+' '+(16-w)+' '+y+'Z" fill="'+HAIR+'"/>'}
function mBack(st){
  switch(st){
    case 0:return '<path d="M18 64 Q18 18 60 18 Q102 18 102 64 Q102 40 60 38 Q18 40 18 64Z" fill="#fff" stroke="#ffc2d4" stroke-width="3"/>';
    case 1:return '';
    case 2:return '<circle cx="60" cy="17" r="9" fill="'+HAIR+'"/>';
    case 3:return '<circle cx="20" cy="70" r="12" fill="'+HAIR+'"/><circle cx="100" cy="70" r="12" fill="'+HAIR+'"/>';
    case 4:return '<ellipse cx="18" cy="80" rx="10" ry="16" fill="'+HAIR+'"/><ellipse cx="102" cy="80" rx="10" ry="16" fill="'+HAIR+'"/>';
    case 5:return '<path d="M20 62 Q20 18 60 18 Q100 18 100 62 L100 88 Q100 98 90 98 L30 98 Q20 98 20 88Z" fill="'+HAIR+'"/>';
    case 6:return longHair(112);
    case 7:return longHair(120);
    case 8:return longHair(126,3);
    default:return longHair(130,4);
  }
}
function mFront(st){
  const b1='<path d="M24 60 Q26 22 60 22 Q94 22 96 60 Q82 40 60 42 Q38 40 24 60Z" fill="'+HAIR+'"/>';
  const b2='<path d="M24 62 Q24 20 60 20 Q96 20 96 62 Q88 40 66 45 Q59 36 55 45 Q36 40 24 62Z" fill="'+HAIR+'"/>';
  const tuft='<path d="M53 31 Q60 18 67 31 Q62 28 60 35 Q58 28 53 31Z" fill="'+HAIR+'"/>';
  let top="",acc="";
  switch(st){
    case 0:top=tuft;break;
    case 1:top='<path d="M36 38 Q60 16 84 38 Q60 30 36 38Z" fill="'+HAIR+'"/>'+tuft;break;
    case 2:top=b1;acc='<rect x="53" y="22" width="14" height="6" rx="3" fill="#ff8fb1"/>';break;
    case 3:top=b1;acc='<ellipse cx="60" cy="34" rx="46" ry="9" fill="#ffd84d"/><path d="M27 34 Q29 4 60 4 Q91 4 93 34Z" fill="#ffe27a"/><rect x="27" y="28" width="66" height="5" fill="#ff8fb1"/>';break;
    case 4:top=b1;acc='<path d="M8 62 l10 6 l-10 6z M28 62 l-10 6 l10 6z M92 62 l10 6 l-10 6z M112 62 l-10 6 l10 6z" fill="#e8476a"/>';break;
    case 5:top=b1;acc='<path d="M25 46 Q60 20 95 46" stroke="#ff8fb1" stroke-width="6" fill="none" stroke-linecap="round"/>';break;
    case 6:top=b1;acc=star4(88,40,9,"#ffe08a");break;
    case 7:top=b2;acc='<path d="M86 30 l-16 -9 v18z M86 30 l16 -9 v18z" fill="#ff7fa5"/><circle cx="86" cy="30" r="4.5" fill="#ffb3c9"/>';break;
    case 8:top=b2;acc=flower(34,34,4,"#ffb3c9")+flower(48,26,4,"#fff")+flower(63,22,4,"#ffb3c9")+flower(78,26,4,"#fff")+flower(90,35,4,"#ffb3c9");break;
    default:top=b2;acc='<path d="M38 26 L44 8 L52 20 L60 2 L68 20 L76 8 L82 26Z" fill="#ffd84d" stroke="#e9b62a" stroke-width="1.5"/><circle cx="60" cy="14" r="3.2" fill="#ff7fa5"/><circle cx="46" cy="18" r="2.2" fill="#8fd3ff"/><circle cx="74" cy="18" r="2.2" fill="#8fd3ff"/>';
  }
  let eyes,mouth='<path d="M54 83 Q60 89 66 83" fill="none" stroke="#c0566b" stroke-width="2.5" stroke-linecap="round"/>';
  if(st===0){
    eyes='<path d="M39 68 Q46 74 53 68 M67 68 Q74 74 81 68" fill="none" stroke="#3b2a2a" stroke-width="3" stroke-linecap="round"/>';
    mouth='<circle cx="60" cy="85" r="7" fill="#8fdcc0" stroke="#5fbf9f" stroke-width="2"/><circle cx="60" cy="85" r="2.5" fill="#fff"/>';
  }else{
    eyes='<ellipse cx="46" cy="67" rx="6.5" ry="8.5" fill="#3b2a2a"/><ellipse cx="74" cy="67" rx="6.5" ry="8.5" fill="#3b2a2a"/><circle cx="48" cy="64" r="2.6" fill="#fff"/><circle cx="76" cy="64" r="2.6" fill="#fff"/><circle cx="44.5" cy="70" r="1.3" fill="#fff"/><circle cx="72.5" cy="70" r="1.3" fill="#fff"/>';
    if(st>=7) eyes+='<path d="M38 61 l-4 -3 M40 58 l-3 -4 M82 61 l4 -3 M80 58 l3 -4" stroke="#3b2a2a" stroke-width="1.8" stroke-linecap="round"/>';
  }
  return '<circle cx="60" cy="64" r="36" fill="'+SKIN+'"/>'+top+eyes+
    '<ellipse cx="35" cy="80" rx="7" ry="4" fill="#ffb3c1" opacity=".85"/><ellipse cx="85" cy="80" rx="7" ry="4" fill="#ffb3c1" opacity=".85"/>'+mouth+acc;
}
function meiFace(st){return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">'+mBack(st)+mFront(st)+'</svg>'}
function dogFace(happy){
  const f=happy?'<circle cx="45" cy="58" r="4" fill="#8a5a36"/><circle cx="75" cy="58" r="4" fill="#8a5a36"/><path d="M37 59 L51 53 M69 53 L83 59" stroke="#141214" stroke-width="3" stroke-linecap="round"/><path d="M53 88 Q60 104 67 88Z" fill="#ff8fa8"/>':
  '<path d="M36 52 Q45 62 54 54 M66 54 Q75 62 84 52" fill="none" stroke="#4a4447" stroke-width="5" stroke-linecap="round"/>';
  return '<ellipse cx="24" cy="68" rx="15" ry="27" fill="#1c191b"/><ellipse cx="96" cy="68" rx="15" ry="27" fill="#1c191b"/><circle cx="60" cy="60" r="38" fill="#2b2729"/><circle cx="40" cy="28" r="9" fill="#2b2729"/><circle cx="60" cy="24" r="10" fill="#2b2729"/><circle cx="80" cy="28" r="9" fill="#2b2729"/><ellipse cx="60" cy="79" rx="21" ry="15" fill="#3d3739"/>'+f+'<ellipse cx="60" cy="71" rx="8" ry="5.5" fill="#0c0b0c"/><path d="M60 76 V84 M52 86 Q60 90 68 86" fill="none" stroke="#0c0b0c" stroke-width="2" stroke-linecap="round"/>';
}
function dogAva(happy){return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">'+dogFace(happy)+'</svg>'}
function dogFig(x,ground,s){
  // すわった全身（頭は dogFace を縮小して使う）
  return '<g transform="translate('+(x-50*s)+' '+(ground-112*s)+') scale('+s+')">'+
   '<path d="M78 92 Q100 88 96 70" fill="none" stroke="#1c191b" stroke-width="10" stroke-linecap="round"/>'+
   '<ellipse cx="50" cy="82" rx="31" ry="28" fill="#242022"/><ellipse cx="50" cy="74" rx="20" ry="18" fill="#332e30"/>'+
   '<ellipse cx="36" cy="106" rx="11" ry="6" fill="#3d3739"/><ellipse cx="64" cy="106" rx="11" ry="6" fill="#3d3739"/>'+
   '<g transform="translate(14 -6) scale(.6)">'+dogFace(true)+'</g></g>';
}
const FIG=[null,null,
 {s:.60,chin:130,hem:162,nw:10,hw:22,col:"#ff9fbd"},
 {s:.56,chin:121,hem:160,nw:10,hw:23,col:"#a8d8ff"},
 {s:.52,chin:111,hem:157,nw:10,hw:22,col:"#ffffff",skirt:"#e8476a"},
 {s:.50,chin:103,hem:154,nw:10,hw:22,col:"#8fdcc0",skirt:"#8a7be0"},
 {s:.47,chin:95,hem:150,nw:11,hw:23,col:"#3d4a7a",skirt:"#9aa3b8"},
 {s:.46,chin:91,hem:158,nw:11,hw:27,col:"#ff8f7a"},
 {s:.45,chin:87,hem:180,nw:11,hw:33,col:"#9fd3ff",long:1},
 {s:.44,chin:83,hem:184,nw:11,hw:42,col:"#ffffff",long:1}];
const BG=[["#d9ccff","#fff0f7","#f3e8ff"],["#fff1c4","#fff8ea","#ffe2b8"],["#ffd0e0","#fff3f7","#ffc2d4"],["#bfe6ff","#f2fbff","#b8e6a8"],["#cfe9ff","#fff0f6","#c9e8b0"],
 ["#ffe9c9","#fff8ee","#e7c9a0"],["#bfe0ff","#f4faff","#d9d9e6"],["#ffd9c2","#fff5ee","#f1c9b0"],["#c9f0d8","#f5fff8","#a9dc9a"],["#3b2a6b","#8a5fb5","#5a3d8a"]];
function scene(st){
  const id="g"+(_uid++),b=BG[st],MX=132,G=180;
  let h='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+b[0]+'"/><stop offset="1" stop-color="'+b[1]+'"/></linearGradient></defs>'+
   '<rect width="200" height="200" fill="url(#'+id+')"/>';
  // 背景のかざり
  if(st===0) h+='<circle cx="160" cy="36" r="16" fill="#fff6c9"/><circle cx="167" cy="31" r="14" fill="'+b[0]+'"/>'+star4(40,30,7,"#fff")+star4(90,22,5,"#fff")+star4(120,52,4,"#fff")+star4(24,70,4,"#fff");
  if(st===1) h+='<rect x="14" y="20" width="60" height="50" rx="6" fill="#fff" stroke="#ffd98a" stroke-width="4"/><path d="M44 20 V70 M14 45 H74" stroke="#ffd98a" stroke-width="3"/><rect x="160" y="150" width="20" height="20" rx="3" fill="#ff9fbd"/><rect x="150" y="166" width="20" height="20" rx="3" fill="#8fdcc0" transform="rotate(-8 160 176)"/>';
  if(st===2) h+=heart(30,30,1.4,"#fff")+heart(80,22,1,"#ffb3c9")+heart(165,34,1.6,"#fff")+heart(120,48,.9,"#ffb3c9")+heart(18,90,.9,"#fff");
  if(st===3) h+='<circle cx="164" cy="34" r="18" fill="#ffe27a"/><ellipse cx="50" cy="36" rx="26" ry="10" fill="#fff"/><ellipse cx="66" cy="30" rx="16" ry="9" fill="#fff"/><ellipse cx="112" cy="58" rx="18" ry="7" fill="#fff"/>';
  if(st===4) h+='<circle cx="30" cy="20" r="34" fill="#ffc9dc"/><circle cx="76" cy="10" r="26" fill="#ffd6e4"/><circle cx="170" cy="14" r="30" fill="#ffc9dc"/>'+[[40,70],[96,50],[150,62],[120,84],[20,110],[178,100]].map(p=>'<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="4" ry="2.5" fill="#ff9fbd" transform="rotate(30 '+p[0]+' '+p[1]+')"/>').join("");
  if(st===5) h+='<rect x="18" y="16" width="70" height="60" rx="6" fill="#cfeaff" stroke="#fff" stroke-width="6"/><path d="M53 16 V76 M18 46 H88" stroke="#fff" stroke-width="4"/><rect x="150" y="30" width="34" height="8" rx="2" fill="#ff9fbd"/><rect x="154" y="18" width="8" height="12" fill="#8fdcc0"/><rect x="164" y="14" width="8" height="16" fill="#ffd84d"/><rect x="174" y="20" width="7" height="10" fill="#a8b8ff"/>';

const DATA=[{"l":"m","u":19,"s":2,"q":"高齢犬に多い目の病気で、壮年期の後半から発症することが多いとされているものはどれですか。","c":["ドライアイ","結膜炎","近視","白内障"],"a":3,"e":"高齢犬に多い目の病気に白内障があり、壮年期の後半から発症することが多いです。目が見えにくくなる危険もあるので、早期の発見・治療が重要です。"},{"l":"m","u":23,"s":2,"q":"「コンパニオン・アニマル」という言葉が生まれたきっかけとして、テキストに書かれているものはどれですか。","c":["英オックスフォード大学の研究者が「ペットや飼い主という言葉は侮辱的」と主張したこと","ドッグショーの名前から","日本の法律で定められたこと","犬の祖先の名前から"],"a":0,"e":"英オックスフォード大学の研究者が「ペットや飼い主という言葉は侮辱的な言葉であり、軽蔑するような言葉が使われることで動物の扱われ方に影響を及ぼす。『伴侶動物（companion animals）と世話をする人（human cares）』という言葉に置き換えるべきだ」と主張したことが始まりと言われています。"},{"l":"m","u":14,"s":3,"q":"乳歯が抜けずに残ってしまう「乳歯遺残」について、テキストの内容に合うものはどれですか。","c":["歯周病とは関係がない","成犬になれば必ず抜ける","大型犬に多く、自然に抜けるのを待つ","小型犬に多く、全身麻酔で抜歯する"],"a":3,"e":"乳歯遺残は小型犬に多く、全身麻酔で抜歯します。放置すると歯周病の原因になります（第20章）。"},{"l":"m","u":15,"s":3,"q":"炭水化物に含まれる「繊維質」の働きとして、テキストに書かれているものはどれですか。","c":["筋肉や血液になる","骨や歯を作る","腸内環境を整え、便秘と下痢を予防する","体内でビタミンCを合成する"],"a":2,"e":"炭水化物は糖質と繊維質から出来ています。糖質は運動のエネルギー源に、繊維質は腸内環境を整えたり便秘と下痢を予防したりする働きもあります。"},{"l":"m","u":20,"s":2,"q":"パピーパーティの対象として、テキストに書かれている子犬の年齢はどれですか。","c":["生後2週間まで","生後7歳以上","生後4〜5か月ぐらいまで","生後1年以上"],"a":2,"e":"パピーパーティとは、生後4〜5か月ぐらいまでの子犬を集めた、いわば子犬同士のふれあい会です。社交性のある犬を育て、動物病院への抵抗をなくすことにも役立ちます。"},{"l":"m","u":12,"s":4,"q":"テキストの「一年間でかならずかかるお金」の合計（小型犬）として正しいものはどれですか。","c":["518万円","56,500円","231,500円","345,500円"],"a":2,"e":"一年間でかならずかかるお金は小型犬231,500円・中型犬306,000円・大型犬381,500円です。臨時のお金を加えた年間コストは小型犬345,500円です。"},{"l":"m","u":8,"s":2,"q":"お留守番のトレーニングを短時間から行うことで、犬に育てるとされているものはどれですか。","c":["競争心","警戒心","自立心","依存心"],"a":2,"e":"お留守番は短時間から慣らし、自立心を育てます。"},{"l":"m","u":23,"s":4,"q":"犬の行動の仕組み「きっかけ→行動→結果」のことを何と呼びますか。","c":["共進化","随伴性","家畜化","本能"],"a":1,"e":"行動の仕組みは、きっかけ→行動→結果（これを随伴性と呼びます）。学習の過程は、オペラント条件付けによって強化されます。"},{"l":"m","u":20,"s":3,"q":"未知の感染症の出現（新興感染症）について、テキストではその多くが何であるとしていますか。","c":["動物由来感染症","食中毒","遺伝病","生活習慣病"],"a":0,"e":"未知の感染症の出現（新興感染症）や、忘れられていた感染症が勢いを取り戻したり（再興感染症）しています。新興感染症の多くは、動物由来感染症です。"},{"l":"m","u":18,"s":3,"q":"防災チェックシートの「その他の準備」に含まれるものはどれですか。","c":["犬に服を着せているか","犬の写真をSNSに載せているか","犬を連れて避難コースを歩いたことがあるか","犬にドッグスポーツをさせているか"],"a":2,"e":"その他の準備には、ご近所と良好な関係、防災訓練への参加、飼養のルールを守る、犬を連れて避難コースを歩いたことがあるか、住所が変わったらマイクロチップや登録情報を変更したか、があります。"},{"l":"m","u":17,"s":3,"q":"感電した犬に意識がある時、口の中を火傷していたらどうしますか。","c":["そのまま様子を見る","温める","冷やす（流水で冷やす場合は顔を横にして誤嚥を防ぐ）","食べ物を与える践問題 第1回1/7"],"a":2,"e":"意識がある時は口や口の中を火傷していないか確認し、火傷していたら冷やします（流水で冷やす場合は顔を横にして誤嚥を防ぎます）。"},{"l":"m","u":22,"s":2,"q":"第一種動物取扱業を行う店舗・事業所ごとに、常勤の職員の中から必ず1名選任しなければならないのは何ですか。","c":["愛玩動物看護師","動物取扱責任者","トリマー","獣医師"],"a":1,"e":"動物取扱責任者は、第一種動物取扱業を業として行う場合において、その店舗・事業所に常勤の職員のなかから必ず1名選任することが法律で定められています。選任しなければ業の登録・更新が出来ません。"},{"l":"m","u":21,"s":2,"q":"キッチンなど、愛犬に入って欲しくない場所への対策として、テキストに書かれているものはどれですか。","c":["ティッシュを置く","床にワックスをぬる","柵やゲートを設置する","電気を消す"],"a":2,"e":"キッチンには刃物や火・熱い鍋など危険なものがたくさんあります。入って欲しくない場所にはゲートや柵を設置し、事故を防ぎます。"},{"l":"m","u":24,"s":4,"q":"悪徳業者の事例として、テキストに挙げられているものはどれですか。また、業者選びに迷った時の情報収集先の組み合わせとして正しいものを選びなさい。","c":["お骨を返すこと ― 自分ひとりで判断","不法投棄や恐喝による追加料金 ― かかり付けの獣医師や介護士、大手会社のホームページ","火葬が早すぎること ― 業者自身の説明だけ","料金が安すぎること ― 近所のうわさだけ"],"a":1,"e":"当初説明したサービスを偽って、不法投棄や恐喝して追加料金を請求するといった事例が近年多発しています。業者選びで迷った時は、かかり付けの獣医師や介護士、または大手会社が掲載しているホームページなどを見て、情報収集をしましょう。"},{"l":"m","u":22,"s":3,"q":"動物取扱責任者の資格要件（2020年施行の環境省令）として、テキストに挙げられていないものはどれですか。","c":["愛玩動物看護師法の免許取得者","実務経験＋教育機関の卒業、または資格試験の合否の証の双方を持つこと","犬を3頭以上飼った経験があること","獣医師法の免許取得者"],"a":2,"e":"資格要件は、獣医師法の免許取得者、愛玩動物看護師法の免許取得者、実務経験＋教育機関の卒業または資格試験の合否の証の双方を持つこと、です。"},{"l":"m","u":10,"s":2,"q":"『犬の十戒』の2番目で、犬は言われたことについてどのように伝えていますか。","c":["分かるまで時間がかかる","すぐに全部分かる","何も分からない","一度聞いたら忘れない"],"a":0,"e":"十戒の2番目は「言われたことが分かるまで、時間がかかる」という内容です。"},{"l":"m","u":2,"s":2,"q":"「離せ・出せ」という意味のコマンドはどれですか。","c":["ダウン","カモン","ヒール","リリース"],"a":3,"e":"「リリース」は「離せ・出せ」です。"},{"l":"m","u":20,"s":3,"q":"マダニについての記述として、テキストの内容に合うものはどれですか。","c":["大きさは2〜3cmで、すぐに気づく","室内のじゅうたんの中だけに住む","体液を吸うことにより100〜200倍の大きさになり、バベシア症を発症させることがある","人には決して寄生しない践問題 第1回2/7"],"a":2,"e":"マダニは野原・山林・河川などに生息し、2〜3mm程度の大きさの寄生虫です。犬に寄生した段階では気づかないことが多いのですが、体液を吸うことにより100〜200倍の大きさになります。バベシア症の原虫が犬の体液中に侵入し、赤血球に寄生してバベシア症を発症する場合があります。"},{"l":"m","u":22,"s":3,"q":"動物の「5つの自由」に含まれないものはどれですか。","c":["本来の行動がとれる自由","吠える・噛むことの自由","飢え・乾きからの自由","不快からの自由"],"a":1,"e":"5つの自由は、飢え・乾きからの自由、恐怖・抑圧からの自由、本来の行動がとれる自由、痛み・負傷・病気からの自由、不快からの自由です。"},{"l":"m","u":2,"s":3,"q":"メス犬の発情期の長さとして、テキストに書かれているものはどれですか。","c":["1〜2日","約60日","4〜12日","30〜40日"],"a":2,"e":"メス犬の発情期は4〜12日です。性周期は6か月前後、妊娠期間は58〜63日です。"},{"l":"m","u":19,"s":3,"q":"「緩和ケア」の例として、テキストに書かれているものはどれですか。","c":["新しいフードに切り替える","ドッグスポーツで運動させる","若い犬に予防接種をする","高齢で麻酔をかけた手術ができないため、ギブスで足を固定しつつ投薬で痛みを緩和する"],"a":3,"e":"たとえば、終末期に前足を疲労骨折したが高齢により麻酔を掛けての手術が出来ないので、ギブスで足を固定しつつ投薬による痛みの緩和を選ぶこともあります。"},{"l":"m","u":17,"s":3,"q":"熱中症で冷やしている途中に、犬に震えが起きた場合はどうするとよいとされていますか。","c":["体をさすってマッサージする","冷水に全身をつける","さらに保冷剤を直接あてる","何もせずそのまま様子を見る"],"a":0,"e":"体温を下げるためには充分に冷やす必要がありますが、震えが起きないように注意します。震えが起きた場合は体をさすってマッサージしてください。"},{"l":"m","u":22,"s":1,"q":"動物愛護管理法は、どのようなことを目的として定められた法律ですか。","c":["犬の値段を決めること","動物の愛護や管理を通じて人と動物が共生する社会を目指すこと","動物を輸出すること","ペットショップの数を増やすこと"],"a":1,"e":"動物愛護管理法は、動物の愛護や管理を通じて人と動物が共生する社会を目指すことを目的として定められた動物愛護の基本法です。"},{"l":"m","u":19,"s":3,"q":"介護に備えて若い頃からしておく「準備」として、テキストに挙げられていないものはどれですか。","c":["室内でトイレが出来る","歯磨きの習慣","食事のルーティン","外でしか排泄しない習慣"],"a":3,"e":"テキストでは、室内でトイレが出来る、食事のルーティン、服を着る習慣、歯磨きの習慣を挙げています。高齢になり外出すること自体が負担になった時、トイレを室内で出来ないとトイレのために外出する必要があり、犬にも介護する側にも負担が大きくなります。"},{"l":"m","u":24,"s":2,"q":"火葬した後のお骨の扱いとして、テキストに例として挙げられているものはどれですか。","c":["必ず業者に引き取ってもらう","ペット霊園への納骨・庭への埋葬・壺に入れて保管","公園に埋める","海にまく"],"a":1,"e":"お骨は、ペット霊園への納骨・庭への埋葬・壺に入れて保管などがあります。"},{"l":"m","u":21,"s":2,"q":"食卓について、テキストでは座卓よりテーブルがベターとしています。その理由はどれですか。","c":["テーブルのほうが値段が安いから","食卓は愛犬からおいてあるものが見えない高さがよいから","テーブルのほうが掃除しやすいから","座卓は犬が下にもぐると危険だから"],"a":1,"e":"飼い主さんの食卓が見えると愛犬が食べたくなるのは当然です。人が食べるものを与えるのは良くないので、食卓は愛犬からおいてあるものが見えない高さのテーブルがベターです。"},{"l":"m","u":14,"s":2,"q":"人と犬に共通する骨格の特徴として、首の骨（頸椎）の数はいくつですか。","c":["7個","13個","20個","3個"],"a":0,"e":"脊椎動物の哺乳類は基本構成が同じで、頸椎（首の骨）は人も犬も7個です。"},{"l":"m","u":14,"s":1,"q":"成犬の歯は、通常何本ありますか。","c":["52本","28本","42本","32本"],"a":2,"e":"通常成犬では42本です。生後約6か月で乳歯から永久歯に変わります。"},{"l":"m","u":8,"s":3,"q":"社会化期（第一次社会化期）の説明として、誤っているものはどれですか。","c":["しつけを始めるのに適している","好奇心よりも警戒心が強くなり、新しいものに慣れにくくなる","さまざまな環境に興味を持ち、順応性が最も高い","犬同士のあいさつや遊び、じゃれあいを通して噛みつき加減を覚える"],"a":1,"e":"好奇心よりも警戒心が強く出始めるのは、若齢期前半（第二次社会化期：生後13週齢〜16週齢）の特徴です。"},{"l":"m","u":7,"s":5,"q":"都道府県や政令指定都市などが設置し、保護された犬や猫の収容や、新しい飼い主への譲渡などを行う施設を一般に何と呼びますか。","c":["動物愛護センター","ドッグラン","ペットホテル","トリミングサロン"],"a":0,"e":"【テキスト外】都道府県や政令指定都市などが設置する「動物愛護センター」（動物管理センターなど名称は地域による）では、保護された犬や猫の収容・譲渡、飼い方の相談などを行っています。テキストの「保健所」とともに、犬との出会いの場の一つです。"},{"l":"m","u":8,"s":3,"q":"散歩中や公共の場での事故の高額な賠償に備える「個人賠償責任保険」は、別名何と呼ばれていますか。","c":["自動車保険","火災保険","日常生活賠償責任保険","生命保険"],"a":2,"e":"高額な賠償責任に備える方法の一つが「個人賠償責任保険」（日常生活賠償責任保険）です。単体より特約でついていることがほとんどです。"},{"l":"m","u":5,"s":2,"q":"テリアタイプの犬は、多くがどこの原産ですか。","c":["イギリス","アメリカ","ドイツ","日本"],"a":0,"e":"テリアタイプの犬は、穴の中に住むキツネなどの小型獣用の猟犬です。多くはイギリス原産で、ネズミ駆除などの役割が与えられていました。"},{"l":"m","u":15,"s":2,"q":"「総合栄養食」とはどのようなフードですか。","c":["病気の治療を補助するためのフード","そのドッグフードと水だけで健康維持できるように栄養バランスを調整したフード","しつけのご褒美として与えるフード","栄養補給のためのサプリメント"],"a":1,"e":"「総合栄養食」とは、そのドッグフードと水だけで健康維持できるように栄養バランスを調整したフードのことで、パッケージにその表示があります。"},{"l":"m","u":4,"s":2,"q":"犬は人と比べて、どのくらいの光量を感じていると考えられていますか。","c":["約2倍","約1/6","約6倍","人と同じ"],"a":1,"e":"犬の視覚は嗅覚・聴覚に比べると鈍く、人と比べ1/6の光量を感じていると考えられています。"},{"l":"m","u":11,"s":3,"q":"子犬が人間家族の家に引っ越すまでに、学んでおくこととしてテキストに書かれているものはどれですか。","c":["人間が危険でないこと、兄弟との遊び方","トイレトレーニングと留守番","散歩でのマナー","お座りと伏せ"],"a":0,"e":"生後8週から10週で引っ越すまでに、子犬は人間が危険でないこと、兄弟との遊び方を学びます。"},{"l":"m","u":15,"s":1,"q":"筋肉や皮膚、内臓、血液など、犬の体そのものになる栄養素はどれですか。","c":["タンパク質","ビタミン","炭水化物","脂質"],"a":0,"e":"タンパク質は筋肉や皮膚、内臓、血液など犬の体そのものになる栄養素です。成長期の犬には特に重要なので、子犬用ドッグフードには多く含まれています。"},{"l":"m","u":3,"s":3,"q":"10才の子どもが犬を欲しがった場合、その犬はその子が何才くらいになるまで生き、生活を共にすることになると理解させる必要がありますか。","c":["15才","18才","25才以上","20才"],"a":2,"e":"犬の寿命が大幅に伸び、15年以上生きることも少なくありません。10才の子どもなら、25才以上になるまで生活を共にすることになります。"},{"l":"m","u":13,"s":3,"q":"SUP（スタンドアップパドルボード）に愛犬を乗せるドッグサップは、どこで生まれたスポーツですか。","c":["カナダ北部","ハワイ","イギリス","ロシア践問題 第1回4/7"],"a":1,"e":"ドッグサップはサーフィンのメッカ・ハワイ生まれ。真夏でも楽しめるアウトドアスポーツです。"},{"l":"m","u":9,"s":5,"q":"犬が前足を伸ばしてお尻を高く上げる姿勢をとるのは、一般にどのような気持ちを表すとされていますか。","c":["遊びに誘っている","強く警戒している","体調が悪い","服従している"],"a":0,"e":"【テキスト外】前足を伸ばしてお尻を高く上げる姿勢は「プレイバウ」と呼ばれ、遊びに誘うときのサインとされています。"},{"l":"m","u":18,"s":3,"q":"避難所で犬を飼うことができない場合に備えて、事前にしておくこととしてテキストに書かれているものはどれですか。","c":["犬を車の中に置いておく","避難所の近くにつないでおく","犬を野外に放す準備をする","一時的に預かってもらえる親戚や友人を探しておく"],"a":3,"e":"人にとっても犬にとっても避難所生活は過酷なものです。また、避難所で犬を飼うことができない場合もあります。事前に犬を一時的に預かってもらえる親戚や友人を探しておきます。"},{"l":"m","u":20,"s":2,"q":"犬の細胞にある染色体の数として、テキストに書かれているものはどれですか。","c":["100","38","46","78"],"a":3,"e":"犬の細胞には78の染色体があります。"},{"l":"m","u":22,"s":2,"q":"テキストの「資格について」の表で、「技術系」（トリミングやグルーミング）に分類されている資格はどれですか。","c":["グッドシチズンテスト（GCT）","ペットフード販売士","公認トリマー","公認訓練士"],"a":2,"e":"技術系は、トリミングやグルーミングの知識とテクニックを学ぶ資格で、公認トリマー・アニマル衛生看護士・ドッググルーミングスペシャリストなどがあります。"},{"l":"m","u":14,"s":2,"q":"歯周病にかかりやすい犬として、テキストに挙げられているものはどれですか。","c":["若い健康な犬","大型犬","硬い食べ物を食べている犬","短頭種（パグやシーズーなど）"],"a":3,"e":"歯周病にかかりやすい犬として、高齢犬、病気などにより免疫力の落ちた犬、口腔ケアが出来ていない犬、小型犬、短頭種（パグやシーズーなど）を挙げています。"},{"l":"m","u":21,"s":2,"q":"愛犬に配慮した室温として、テキストに書かれているもの（夏以外）はどれですか。","c":["18〜24℃","28〜32℃","10〜14℃","35℃以上"],"a":0,"e":"犬は高温・多湿が苦手です。温度は18〜24℃（夏は26℃以下）に調整して、湿度は50〜60%（夏は50%以下）にキープします。"},{"l":"m","u":20,"s":3,"q":"日本に存在する動物由来感染症の数について、テキストではどのように説明していますか。","c":["世界で最も多い","一つも存在しない","世界の中では例外的に少なく、数十種類程度","200種類以上すべてが存在する"],"a":2,"e":"日本は世界の中では例外的に動物由来感染症が少なく寄生虫や真菌による疾病を入れても、数十種類程度と思われます。"},{"l":"m","u":15,"s":4,"q":"犬の母乳と牛乳を比べたときの特徴として、正しいものはどれですか。","c":["犬の母乳は牛乳に比べてタンパク質や脂肪が多く、乳糖などの糖質や水分が少ない","犬の母乳は牛乳に比べて水分が多い","犬の母乳は牛乳に比べて乳糖が多い","犬の母乳と牛乳は成分が同じである"],"a":0,"e":"犬の母乳は牛乳に比べてタンパク質や脂肪の量が多く、乳糖などの糖質や水分が少ないのが特徴です。そのため子犬に牛乳を与えると、エネルギーやタンパク質が不足し健全に成長できないことがあります。"},{"l":"m","u":18,"s":2,"q":"犬の防災用品として準備する餌と水の量の目安は、最低何日分ですか。","c":["最低2日分","最低1日分","最低30日分","最低5日分"],"a":3,"e":"餌と水は最低5日分を準備します。ドライフードなど長期保存が可能なものがよく、療法食（尿石用・アレルギー用など）の場合は特に重要です。"},{"l":"m","u":15,"s":4,"q":"体重5kgの犬（避妊・去勢済み）の一日あたりの塩分摂取量の目安として、テキストに書かれているものはどれですか。","c":["1.8g","0.18g","0.0018g","18g"],"a":1,"e":"体重5kgの犬（避妊・去勢済み）の一日あたりの塩分摂取量の目安は0.18gです。ドッグフード10gあたりの食塩量は0.0018gです。塩分の摂取過剰は、心臓や腎臓に負担をかけてしまいます。"},{"l":"m","u":5,"s":3,"q":"旅客の手荷物から動植物検疫の対象を嗅ぎ分ける検疫探知犬の代表犬種として、テキストに書かれているものはどれですか。","c":["ボルゾイ","パピヨン","ビーグル","チワワ"],"a":2,"e":"検疫探知犬の代表犬種はビーグル・ラブラドールです。ビーグルは優れた嗅覚を持つ嗅覚・ハウンドタイプです。"},{"l":"m","u":8,"s":3,"q":"テキストによると、散歩中や公共の場での事故は、自宅にいる時に比べて約何倍ですか。","c":["約2倍","約5倍","約半分","約10倍"],"a":0,"e":"散歩中や公共の場での事故は約2倍です。高額な賠償責任に備える方法の一つが「個人賠償責任保険」（日常生活賠償責任保険）で、単体より特約でついていることがほとんどです。"},{"l":"m","u":19,"s":2,"q":"マンションでの室内飼いが増えたことで、認知症の犬について多くなっている相談はどれですか。","c":["肥満","抜け毛","ノミ","夜鳴き"],"a":3,"e":"最近ではマンションでの室内飼いが増えたことで夜鳴きに関する相談も多いですが、完治が難しいので対処法（介護）が主体になります。"},{"l":"m","u":17,"s":4,"q":"ひどい出血で傷口より心臓方向をしばる場合について、テキストの内容に合うものはどれですか。","c":["嫌がって暴れても、必ずきつくしばる","傷口より足先の方向を、できるだけ強くしばり続ける","傷口より心臓方向に2〜5cmの部分をしばり、うっ血しないように1分ごとにヒモをゆるめてしばりなおす","傷口そのものをヒモで強くしばる"],"a":2,"e":"傷口より心臓方向に2〜5cmの部分を非伸縮タイプ包帯やヒモできつくしばります。うっ血しないように1分ごとにヒモをゆるめ、しばりなおします。ただし、嫌がり暴れるとさらに出血量が増えることがあるため、嫌がる時は無理にしばらないでください。"},{"l":"m","u":3,"s":2,"q":"犬からもらう「心理的な充足」は、話しかけることが重要で、特に誰に有効とされていますか。","c":["乳幼児","受験生","獣医師","高齢の方や独身者"],"a":3,"e":"心理的な充足（「元気な私がいるからこそ、この子も存在できる」という生きがい・幸福感）は、話しかけることが重要で、特に高齢の方や独身者に有効です。"},{"l":"m","u":4,"s":3,"q":"犬の舌の役割についての記述として、誤っているものはどれですか。","c":["人と同じように全身に汗をかいて体温を下げるので、舌は体温調節に使わない","暑さを冷ます","極度の緊張を解く","舌をスプーン状に形作り、上手に水分を取る"],"a":0,"e":"犬は私たちのように汗をかくことがありません。そこで長い舌を使って激しく呼吸し、のどを冷やして体温を下げています。"},{"l":"m","u":4,"s":2,"q":"犬が水を飲むとき、舌をどのような形にしていますか。","c":["ストロー状","スプーン状","丸めて玉状","まっすぐ平ら"],"a":1,"e":"犬は舌をスプーン状に形作り、上手に水分を取ります。"},{"l":"m","u":20,"s":3,"q":"ノミの駆除（予防）の方法として、テキストに挙げられているものの組み合わせはどれですか。","c":["ワクチン・手術・入院","首輪・滴下剤・経口薬","シャンプーだけ","日光浴だけ"],"a":1,"e":"ノミの駆除（予防）には、首輪・滴下剤・経口薬などがあります。"},{"l":"m","u":17,"s":4,"q":"誤飲・誤食についての記述として、誤っているものはどれですか。","c":["とがった物を飲み込んだ場合は、すぐに自宅で吐き出させる","誤飲・誤食1時間程度であれば、異物がまだ胃内にある可能性がある","数時間後や数日後に症状があらわれることもある","薬品で吐き出させる方法は、獣医の指示があった場合のみとする"],"a":0,"e":"とがった物など吐き出させると食道などを傷つけたり悪化させることもあります。吐き出させても大丈夫なものや、病院から「吐かせるように」と指示があった場合以外は吐き出させないようにします。"},{"l":"m","u":15,"s":2,"q":"「3大栄養素」の組み合わせとして正しいものはどれですか。","c":["ビタミン・ミネラル・水","脂質・水・炭水化物","タンパク質・ビタミン・ミネラル","タンパク質・脂質・炭水化物"],"a":3,"e":"タンパク質・脂質・炭水化物の3つを3大栄養素、これにビタミン・ミネラルを加えた5つを5大栄養素といいます。"},{"l":"m","u":13,"s":3,"q":"冬のドライブで、車内温度の目安として書かれているものはどれですか。","c":["20℃","32℃","28℃","10℃"],"a":0,"e":"冬、飼い主さんは薄着をせず車内温度を低めに設定します。車内温度は20℃が目安です。人の好みとは違います。"},{"l":"m","u":20,"s":2,"q":"テキストでは、犬が太りすぎる原因は何だとしていますか。","c":["ワクチンの副作用","散歩のしすぎ","人が犬に余計に食べ物を与えてしまうこと","犬が自ら食べ物を用意して勝手に食べること"],"a":2,"e":"犬は人と違い自ら食べ物を用意し、それを勝手に食べて太るということはありません。人が犬に余計に食べ物を与えてしまうことが原因です。"},{"l":"m","u":18,"s":2,"q":"迷子札をつけることが特に必須とされるのは、どのような犬ですか。","c":["大型犬だけ","屋外で飼っている犬や、屋内でフリーにしている犬","老犬だけ","ケージで飼っている子犬だけ"],"a":1,"e":"動物に迷子札をつける。とくに屋外で飼っている犬や屋内でフリーにしている犬には必須です。"},{"l":"m","u":15,"s":4,"q":"タマネギ・ネギ類を加熱調理した場合について、正しいものはどれですか。","c":["少量なら毎日与えてよい","加熱しても有害成分は分解されないので与えてはいけない","加熱すれば与えてもよい","生よりも加熱したほうが危険が増す"],"a":1,"e":"タマネギなどの有害な成分は、加熱しても分解されません。ハンバーグや汁ものに入っていても危険です。"},{"l":"m","u":14,"s":3,"q":"短時間に大きな力を出すのに役立つ筋繊維はどれですか。","c":["心筋","赤筋繊維","白筋繊維","平滑筋"],"a":2,"e":"白筋繊維は短時間の大きな力を出すのに役立ち、赤筋繊維はミトコンドリアが多く有酸素運動に適しています。"},{"l":"m","u":19,"s":2,"q":"高齢犬の「循環器系」の病気の代表として、テキストに書かれているものはどれですか。","c":["皮膚病","歯周病","心臓病","白内障"],"a":2,"e":"循環器系は血液の循環に関わる病気で、代表が心臓病です。身体の中枢に関わる機能なので急に重症化するリスクもあります。"},{"l":"m","u":20,"s":2,"q":"ノミ・ダニ駆除薬やフィラリア症予防薬を、成長期の子犬が毎月受診してもらう必要がある理由は何ですか。","c":["飼い主が忘れないようにするためだけ","毎月種類を変える必要があるため","薬の効き目が1日しかないため","体重に合わせて量が変わるため"],"a":3,"e":"ノミ・ダニ駆除薬やフィラリア症予防薬は、体重に合わせて量が変わるため、成長期である子犬は毎月受診してもらう必要があります。動物病院になれさせることにも役立ちます。"},{"l":"m","u":17,"s":5,"q":"犬の応急手当で、口輪（マズル）や包帯で口を軽くしばるなどの「口を保定する」処置を行うことがあります。その主な目的はどれですか。","c":["犬の体温を上げるため","痛みやパニックで、手当をする人が噛まれるのを防ぐため","犬の呼吸を楽にするため","出血を止めるため"],"a":1,"e":"【テキスト外】ケガをした犬は、痛みや恐怖でふだんおとなしい犬でも噛むことがあります。そのため口輪などで口を保定してから手当をすることがあります。ただし呼吸困難・嘔吐・熱中症（パンティングが必要）の時は口をしばってはいけません。"},{"l":"m","u":18,"s":2,"q":"犬のための防災用品として準備しておく必要があるものは、テキストではどのように説明されていますか。","c":["「軽いもの」「小さいもの」だけ","「おもちゃ」「洋服」","「命にかかわるもの」「他のもので代用できないもの」","「値段が高いもの」「珍しいもの」"],"a":2,"e":"犬のための防災用品として「命にかかわるもの」「他のもので代用できないもの」を準備しておく必要があります。"},{"l":"m","u":9,"s":3,"q":"犬が自分の群れと気持ちを通じさせるために使う声として、テキストに挙げられていないものはどれですか。","c":["遠吠え","口笛","うなり","吠え"],"a":1,"e":"うなり・吠え・不安げに鳴く・悲しそうにキャンキャン鳴く・遠吠えが挙げられています。"},{"l":"m","u":2,"s":2,"q":"一定の状況に対して自発的に起こるリアクションのことを何といいますか。","c":["しつけ","学習","社会化","本能"],"a":3,"e":"一定の状況に対するこのような自発的なリアクションを「本能」といいます。犬は、祖先であるオオカミからその本能を受け継いでいます。"},{"l":"m","u":5,"s":2,"q":"ダックスフンドが胴長短足の体型に改良された理由として、テキストに書かれているものはどれですか。","c":["穴の中の獲物を追いかけやすくするため","家の中で飼いやすくするため","寒さに強くするため","速く走れるようにするため"],"a":0,"e":"ダックスフンドは、穴の中の獲物を追いかけやすいように胴長短足の体型に改良された犬種です。フレンドリーですが、元々猟犬なので頑固な面もあります。"},{"l":"m","u":15,"s":2,"q":"犬にとって必要なミネラルは何種類とされていますか。","c":["5種類","3種類","12種類","30種類"],"a":2,"e":"鉄・カリウム・カルシウムなど12種類が犬にとって必要なミネラルです。"},{"l":"m","u":1,"s":2,"q":"日本で人が犬と一緒に暮らしていたのは、遅くともいつ頃の始まりからと考えられていますか。","c":["縄文時代","明治時代","江戸時代","平安時代"],"a":0,"e":"日本でも、旧石器時代から縄文時代の始まりの頃に犬と一緒に暮らしていたのは間違いないようです。"},{"l":"m","u":8,"s":3,"q":"「ほめてしつけるポイント」についての記述として、誤っているものはどれですか。","c":["ストレスをかけずに適切な行動に導く","問題行動は、その場で厳しく叱ってやめさせる","犬が楽しく協力的に覚えられるように、楽しみながら行う","人の社会に、怖がらないよう徐々に慣れさせる"],"a":1,"e":"問題行動は叱らずに、振舞ってほしい行動を教えます。吠える・興奮する・トイレの失敗などは犬自身のせいではなく、環境や、どう振舞ってほしいのかを教えてもらっていないだけです。"},{"l":"m","u":3,"s":3,"q":"テキストで、犬を飼う理由として不適切とされているものはどれですか。","c":["ただ可愛いから","家族全員で話し合って決めたから","犬の特性を理解したから","終生飼養できると確認したから"],"a":0,"e":"「ただ可愛いからという理由での飼養は不適切です」と書かれています。"},{"l":"m","u":21,"s":2,"q":"スリッパや靴下を片付けておく理由として、テキストに書かれているものはどれですか。","c":["犬の足が冷えるから","噛みごたえがあり匂いもあっておもちゃにされやすく、靴下は誤食することもあるから","掃除がしやすいから","見た目が悪いから"],"a":1,"e":"スリッパや靴下は噛みごたえがある上に匂いがあり、くわえやすい大きさなのでおもちゃにされがちです。靴下は誤食することもあり危険です。"},{"l":"m","u":13,"s":2,"q":"ドライブの前に愛犬の食事を済ませておくのは、出発の何時間前が目安ですか。","c":["直前","2〜3時間前","30分前","前日の夜"],"a":1,"e":"ドライブをする2〜3時間前までに愛犬に食事をさせてトイレを済ませます。車に乗せる直前に食べさせると酔ってしまうこともあります。"},{"l":"m","u":16,"s":2,"q":"トリミングサロンのオプションサービスで、「肉球ケア・アロママッサージ等」はどれに分類されますか。","c":["デンタルケア","パック","マッサージ系","おしゃれ系"],"a":2,"e":"肉球ケア・アロママッサージ等はマッサージ系です。"},{"l":"m","u":17,"s":4,"q":"誤嚥した犬の後ろから体を抱きかかえ、こぶしを作った片手をもう一方の手でにぎり、上腹部にあてて押し上げる方法を何と言いますか。また、行うときの注意として正しいものはどれですか。","c":["心臓マッサージ：胸幅の1/2〜1/3が沈むくらい押す","ハイムリック法：呼吸困難になっている緊急時以外は行わない","ハイムリック法：きちんと呼吸している時にも予防として行う","背部叩打法：何度でも強く叩いてよい"],"a":1,"e":"これはハイムリック法です。きちんと呼吸している時に行うと、さらに奥に飲み込ませたり、ケガをさせてしまう可能性があるため、呼吸困難になっている緊急時以外は行わないようにします。"},{"l":"m","u":15,"s":5,"q":"ペットフード安全法（正式名称「愛がん動物用飼料の安全性の確保に関する法律」）が対象としている動物はどれですか。","c":["犬と猫","犬だけ","すべてのペット（鳥・魚を含む）","家畜を含むすべての動物"],"a":0,"e":"【テキスト外】ペットフード安全法は、犬と猫のペットフードを対象とした法律で、2009年に施行されました。テキストの表示の見方で「犬用？ねこ用？」と名称に記載されることとつながります。"},{"l":"m","u":24,"s":3,"q":"訪問火葬の注意点として、テキストに書かれているものはどれですか。","c":["業者に遺体を託すので立ち会えない","お骨あげが出来ない","場所の確保と近所の理解が必要で、近所トラブルになるケースもある","遺骨が戻らない"],"a":2,"e":"訪問火葬は火葬車が指定の場所に訪問してくれるサービスで、お骨あげも出来ますが、場所の確保と近所の理解が必要です。"},{"l":"m","u":19,"s":3,"q":"テキストでは、平均寿命が延びても健康寿命が延びなければ、どのような時期が長くなるとしていますか。","c":["壮年期","負担を強いる時期","発情期","子犬の時期"],"a":1,"e":"平均寿命が延びた分、健康寿命も延びなければ、負担を強いる時期が長くなります。だからこそ介護状態にならないことが大事です。"},{"l":"m","u":17,"s":4,"q":"傷口の止血でガーゼをあてるとき、テキストの方法として正しいものはどれですか。","c":["ガーゼは使わずに放置する","生理食塩水で湿らせたガーゼをあて、止血するまで交換しない","止血したらすぐにガーゼをはがす","乾いたガーゼを何度も交換する"],"a":1,"e":"清潔な布をあてて圧迫し止血します。ガーゼは生理食塩水で湿らせ、止血するまで交換しません。"},{"l":"m","u":6,"s":2,"q":"家族で考えた結果「今はまだ飼えない」となった場合、テキストでは何が大切だとしていますか。","c":["代わりにぬいぐるみを買ってあげること","子どもが忘れるまで話題にしない","その理由をキチンと説明すること","友達の犬と遊ばせて満足させること"],"a":2,"e":"「今はまだ飼えない」となった場合もその理由をキチンと説明することが大切です。お子さんも、犬を飼うということは責任を伴うもので、簡単ではないことをきっと分かってくれます。"},{"l":"m","u":8,"s":2,"q":"テキストでは、犬のしつけはいつから始めるとしていますか。","c":["家に迎え入れたその日から","問題行動が出てから","1歳になってから","老犬になってから践問題 第2回3/6"],"a":0,"e":"しつけは家に迎え入れたその日からスタートします。問題行動が根深くなる前に早めに対応します。"},{"l":"m","u":22,"s":2,"q":"必要なお世話をしない、不衛生な環境で飼うといった行為を何と言いますか。","c":["パンティング","ネグレクト","グルーミング","マーキング"],"a":1,"e":"意図的な虐待だけでなく、必要なお世話をしない、不衛生な環境で飼うといったネグレクトも虐待行為です。"},{"l":"m","u":2,"s":3,"q":"メスの大型犬の性成熟の時期として、テキストに書かれているものはどれですか。","c":["17〜19か月齢","2〜3か月齢","6〜14か月齢","11〜18か月齢"],"a":3,"e":"メスの性成熟は6〜14か月齢、大型犬では11〜18か月齢です。"},{"l":"m","u":13,"s":3,"q":"フリスビー（ディスクドッグ）の種目「ディスタンス」の説明として正しいものはどれですか。","c":["1枚のディスクを使い、指定時間内により遠くでキャッチする","ハードルを跳び越える","音楽に合わせてキャッチ率や芸術性を競う","嗅覚でおやつを探す"],"a":0,"e":"ディスタンスは1枚のディスクを使い、指定された時間内により遠くでキャッチすることを競います。音楽に合わせるのはフリースタイルです。"},{"l":"m","u":3,"s":3,"q":"集合住宅で犬を飼う場合、事前に調査しなければならないこととしてテキストに書かれているものはどれですか。","c":["飼養の許可を得ることができるか","近くに動物病院があるか","部屋の日当たりがよいか","エレベーターが大きいか"],"a":0,"e":"集合住宅の場合は、飼養の許可を得ることができるのかを事前に調査しなければなりません。マンションなどでは飼養要綱が定められている場合もあります。"},{"l":"m","u":20,"s":4,"q":"狂犬病を発症した場合に見られる神経症状として、テキストに挙げられていないものはどれですか。","c":["恐水症","興奮","食欲の増加","錯乱"],"a":2,"e":"不安感・恐水症・興奮・麻痺・錯乱などの神経症状が現れ、数日後に呼吸麻痺で死亡します。"},{"l":"m","u":20,"s":3,"q":"動物由来感染症が問題となる背景として、テキストに挙げられていないものはどれですか。","c":["先進国での高齢者など感染抵抗力が弱い人々の増加","ワクチンの開発が進みすぎたこと","交通手段の発展による人ともの速やかな移動","野生動物のペット化"],"a":1,"e":"背景には、人間の社会環境の変化と行動の多様化があげられています。交通手段の発展、人口の都市集中、土地開発と自然環境の変化、先進国では高齢者など感染抵抗力が弱い人々の増加や野生動物のペット化などです。"},{"l":"m","u":23,"s":3,"q":"アニマルセラピーの専門家が「アニマルセラピー」という言葉を使わない理由として、テキストに書かれているものはどれですか。","c":["セラピーは本来治療を意味し、「動物治療」という意味の分からない言葉になってしまうから","英語では長すぎるから","犬以外の動物にしか使えないから","法律で禁止されているから"],"a":0,"e":"セラピー（Therapy）は本来治療を意味する言葉なので、アニマルセラピーは動物治療という意味の分からない言葉になってしまいます。そのため専門家は動物介在介入（AAI）という用語を使います。"},{"l":"m","u":15,"s":3,"q":"ドライフードについての記述として、正しいものはどれですか。","c":["水分が多いので水はいらない","開封後は冷蔵庫で2週間以内に使う","加圧・加熱・殺菌して密封されている","水分含有量が少ないため、必ず新鮮な水と一緒に与える"],"a":3,"e":"ドライフードは水分10%以下と少ないため、必ず新鮮な水と一緒に与えます。"},{"l":"m","u":18,"s":2,"q":"防災手帳の「愛犬のプロフィール」に、家族と愛犬が一緒に写っている写真を貼っておく理由として、テキストに書かれているものはどれですか。","c":["避難所で自慢できるから","飼い主であることを証明する時に役立つから","記念になるから","写真がないと避難所に入れないから"],"a":1,"e":"家族と愛犬が一緒に写っている写真は、飼い主であることを証明する時に非常に役に立ちます。スマホ等にも画像として保存しておくと、防災手帳を持ち歩いていない時でも安心です。"},{"l":"m","u":17,"s":3,"q":"歯肉の色の確認で、白くなった部分がなかなかピンク色に戻らない場合に考えられる状態として、テキストに挙げられていないものはどれですか。","c":["肥満","ショック","貧血","脱水"],"a":0,"e":"毛細血管再充填時間が長い場合は、貧血・血圧低下・低体温・ショック・脱水の可能性があります。"},{"l":"m","u":9,"s":5,"q":"犬があくびをする、体をブルブル振る、鼻をなめるなど、自分や相手を落ち着かせるために見せるとされるしぐさを、一般に何と呼びますか。","c":["パンティング","マウンティング","カーミングシグナル","マーキング"],"a":2,"e":"【テキスト外】あくび・体を振る・鼻をなめる・目をそらすなど、緊張したときに自分や相手を落ち着かせるために見せるとされるしぐさを「カーミングシグナル」と呼びます。犬の「体のことば」の一つです。"},{"l":"m","u":8,"s":3,"q":"愛犬を迎える前に家族で話し合っておくことのうち、「お手入れ」が大切な理由として、見た目を整えるほかに挙げられているものはどれですか。","c":["ワクチンの代わりになる","体重を増やす","吠え声が小さくなる","病気やケガの早期発見"],"a":3,"e":"お手入れは清潔・見た目を整えるだけでなく、病気やケガの早期発見にも大切です。"},{"l":"m","u":12,"s":3,"q":"テキストの「臨時でかかるお金」に含まれないものはどれですか。","c":["ドッグフード代","ペットホテル・ペットシッター","病気・ケガの治療費","ペット保険"],"a":0,"e":"臨時でかかるお金は、レジャー・旅行、ペットホテル・ペットシッター、病気・ケガの治療費、ペット保険などです。ドッグフードは一年間でかならずかかるお金です。"},{"l":"m","u":19,"s":3,"q":"犬の認知症の原因として、テキストに書かれているものはどれですか。","c":["老化に伴う脳神経細胞の衰えからくる自律神経機能の低下","食べすぎ","ワクチンの接種","運動のしすぎ践問題 第2回4/6"],"a":0,"e":"認知症は、老化に伴う脳神経細胞の衰えからくる自律神経機能の低下が原因とされます。最近ではマンションでの室内飼いが増えたことで夜鳴きに関する相談も多いですが、完治が難しいので対処法（介護）が主体になります。"},{"l":"m","u":17,"s":2,"q":"犬の舌が青紫色や黒っぽい時に考えられる状態で、血液中の酸素が不足している時に出る症状を何と言いますか。","c":["パンティング","メラノーマ","貧血","チアノーゼ"],"a":3,"e":"舌が青紫色や黒っぽい時はチアノーゼと言い、血液中の酸素が不足している時に出る症状なので要注意です。心臓や呼吸器疾患の疑いもあります。"},{"l":"m","u":23,"s":2,"q":"セラピー・ドッグの中で最も一般的な活動はどれですか。","c":["ファシリティ・ドッグ","動物介在療法（Animal Assisted Therapy）","動物介在教育","動物介在活動（Animal Assisted Activity）"],"a":3,"e":"セラピー・ドッグの中で最も一般的な活動が動物介在活動です。これらの犬のほとんどが家庭で飼育されている愛玩犬です。"},{"l":"m","u":18,"s":1,"q":"テキストでは、災害時にペットのために最も大切なことは何だとしていますか。","c":["ペットを家に残して避難すること","ペットを先に避難させること","飼い主が無事に生き残ること","ペットを野外に放すこと"],"a":2,"e":"ペットは世話をしてくれる飼い主がいないと生きていけません。ペットのためには飼い主が無事に生き残ることが最も大切なことです。飼い主が無事であれば、ペットを助けることができるのです。"},{"l":"m","u":7,"s":2,"q":"第7章で、犬を選ぶときに考えておくこととして挙げられているものはどれですか。","c":["犬の毛の色は何色か？","血統書はあるか？","先住犬や同居する動物との相性は？","犬の値段はいくらか？"],"a":2,"e":"オスかメスか、飼養スペース、犬の年齢、先住犬や同居する動物との相性、住宅環境や地域環境が負担にならない犬種か、保護された犬であればどのような環境で暮らしていたのか、などを挙げています。"},{"l":"m","u":5,"s":3,"q":"災害救助犬の代表犬種として、テキストに挙げられていないものはどれですか。","c":["チワワ","シェパード","ベルジアン・マリノア","ラブラドール"],"a":0,"e":"災害救助犬の代表犬種は、シェパード・ラブラドール・ベルジアン・マリノアです。"},{"l":"m","u":2,"s":3,"q":"次のうち、テキストで「細菌による疾病」とされているものはどれですか。","c":["犬ジステンパー","狂犬病","犬パルボウイルス","犬レプトスピラ症"],"a":3,"e":"細菌による疾病は犬レプトスピラ症です。犬ジステンパー・犬パルボウイルス・犬コロナウイルス・狂犬病などはウイルスによる疾病です。"},{"l":"m","u":22,"s":1,"q":"動物愛護週間は毎年いつですか。","c":["9月20日〜9月26日","10月20日〜10月26日","12月20日〜12月26日","4月1日〜4月7日践問題 第2回5/6"],"a":0,"e":"動物愛護週間は毎年9月20日〜9月26日です。"},{"l":"m","u":14,"s":2,"q":"犬の体温を計る場所として、テキストに書かれているものはどれですか。","c":["舌の上","背中の毛の上","耳道内や直腸","肉球"],"a":2,"e":"体温は耳道内や直腸温で計ります。平熱は約38.5℃です。"},{"l":"m","u":20,"s":3,"q":"動物由来感染症の伝播のうち、「環境媒介」で水を介してうつる病気として、テキストに挙げられているものはどれですか。","c":["狂犬病","アニサキス症","レプトスピラ症","オウム病"],"a":2,"e":"環境媒介では、水がレプトスピラ症、土壌が炭素破傷風です。"},{"l":"m","u":16,"s":2,"q":"トリミングサロンのオプションサービスで、「温浴・オゾンシャワー・温泉浴・炭酸泉・スチーム等」はどれに分類されますか。","c":["おしゃれ系","リラクゼーション","デンタルケア","被毛処理"],"a":1,"e":"温浴・オゾンシャワー・温泉浴・炭酸泉・スチーム等はリラクゼーションに分類されます。"},{"l":"m","u":4,"s":2,"q":"犬の脳内で非常に発達している、匂いを感知するのに優れた大脳の器官はどれですか。","c":["嗅脳","小脳","延髄","視床"],"a":0,"e":"犬の脳内で非常に発達している部位は、大脳の器官で「嗅脳」という部位です。食欲や性欲など種の繁栄に重要な機能を持つといわれています。"},{"l":"m","u":22,"s":3,"q":"法改正で、犬猫の繁殖業者等以外の飼い主に対して、マイクロチップの装着はどのように定められていますか。","c":["禁止","何も定められていない","罰則つきの義務","努力義務"],"a":3,"e":"犬猫の繁殖業者等にマイクロチップ装着・登録が義務化され、義務対象者以外には努力義務が課されています。"},{"l":"m","u":10,"s":2,"q":"テキストの「犬嫌いを増やさないためのお願い」で、ノーリードは何に違反するとされていますか。","c":["道路交通法","狂犬病予防法","刑法","条例"],"a":3,"e":"「ノーリードは条例違反です」とあります。そのほか、うんちやおしっこの後始末をすること、狂犬病予防注射は法律で義務づけられていることが挙げられています。"},{"l":"m","u":5,"s":2,"q":"テリアタイプの犬に与えられていた役割として、テキストに書かれているものはどれですか。","c":["ネズミ駆除","鳥の回収","そりを引く","家畜の群れの誘導"],"a":0,"e":"テリアタイプの犬は穴の中に住むキツネなどの小型獣用の猟犬で、多くはイギリス原産です。ネズミ駆除などの役割が与えられていました。"},{"l":"m","u":4,"s":2,"q":"犬や猫が聞き取ることができ、人には聞こえない高周波の音を何と言いますか。","c":["超音波","低周波","騒音","可聴音"],"a":0,"e":"犬猫は人には聞こえない高周波（超音波）も聞き取ることができます。"},{"l":"m","u":8,"s":3,"q":"テキストによると、メスが最初の発情を迎えるのは何か月齢頃ですか。","c":["24〜30か月齢","4〜6か月齢","10〜16か月齢","2〜3か月齢"],"a":2,"e":"青年期（生後6か月〜2年）に、メスは最初の発情（10か月〜16か月齢）を迎えます。オスは特定の発情期がないので、いつでも繁殖行動ができます。"},{"l":"m","u":18,"s":3,"q":"犬の防災用品で、小型犬と中型犬などで分けて準備するとよいとされているものの組み合わせはどれですか。","c":["小型犬は段ボール、中型犬は毛布","小型犬はキャリーバッグ、中型犬などはクレートを寝床に","小型犬はクレート、中型犬はかご","小型犬も中型犬もリードだけ"],"a":1,"e":"小型犬はキャリーバック、中型犬などはクレートを寝床にします。がれきやガラスの破片で危険なため、必ずリードで係留します。"},{"l":"m","u":11,"s":2,"q":"犬にとって規則正しい日課が大切な理由として、テキストに書かれているものはどれですか。","c":["犬は毎日違うことをしたがるから","体重が増えるから","犬は明確なルールを必要とし、ルーティーンワークを欲するから","飼い主が楽をできるから"],"a":2,"e":"犬は明確なルールを必要とし、自分の生活の中にルーティーンワークがあることを欲します。規則正しい日課は安心感を与えます。"},{"l":"m","u":20,"s":4,"q":"犬回虫が寄生している犬の糞を放置すると、何の原因になるとされていますか。","c":["熱中症","白内障","幼児への感染（幼虫移行症）","狂犬病践問題 第2回6/6"],"a":2,"e":"犬の糞の放置は、見た目の不快感はモチロンのこと犬回虫が寄生している犬の糞であれば、幼児への感染（幼虫移行症）の原因にもなります。"},{"l":"m","u":5,"s":3,"q":"テキストで「警察犬グループ」の4つの仕事とされているものに含まれないものはどれですか。","c":["威嚇犬","麻薬探知犬","災害救助犬","臭気選別犬"],"a":2,"e":"警察犬の4つの仕事は、麻薬探知犬・跡追及犬・臭気選別犬・威嚇犬です。災害救助犬は別のグループです。"},{"l":"m","u":20,"s":4,"q":"動物由来感染症の病原体と病気の組み合わせとして、正しいものはどれですか。","c":["ウイルス ― ペスト","真菌 ― 狂犬病","細菌 ― 皮膚糸状菌症","プリオン ― ヤコブ病"],"a":3,"e":"プリオンはヤコブ病などです。ペストは細菌、狂犬病はウイルス、皮膚糸状菌症は真菌によるものです。"},{"l":"m","u":10,"s":2,"q":"『犬の十戒』で、犬が欲しいものとされているものはどれですか。","c":["高級なフード","広い庭","たくさんのおもちゃ","家族の信頼"],"a":3,"e":"「ボクが欲しいものは、家族の信頼です」とあります。"},{"l":"m","u":19,"s":4,"q":"見た目の変化のうち「全体の変化」（背中がまるまる、頭が下がり気味）に影響するとされているものは何ですか。","c":["筋肉量など普段の運動量","鳴き声","毛の色","食器の大きさ"],"a":0,"e":"全体の変化は、筋肉量など普段の運動量が影響します。"},{"l":"m","u":17,"s":2,"q":"意識はないが呼吸している犬について、気道を確保するために舌をどうしますか。","c":["舌をしばる","舌を口の奥に押し込む","何もしない","舌を引っ張る（ガーゼで巻くと引っ張りやすい）"],"a":3,"e":"意識はないが呼吸している時は、舌で気道を塞がないように舌を引っ張り、気道を確保して病院へ。舌はガーゼなどで巻くと引っ張りやすいです。"},{"l":"m","u":1,"s":3,"q":"オオカミの群れのリーダーについての記述として、誤っているものはどれですか。","c":["群れが獲物を得た場合、メンバーに先に食べさせ、最後に食べる","狩りでは、常に群れの一番前を行く","獲物のいる場所を探し当て、攻撃開始の合図をする","群れが獲物を得た場合、まず食べるのはリーダーである"],"a":0,"e":"オオカミの群れが獲物を得た場合、まず食べるのは群れのリーダーです。"},{"l":"m","u":16,"s":4,"q":"トリミングサロンについての記述として、テキストの内容と合わないものはどれですか。","c":["「ペットの扱い方・優しさ」はサロンを選ぶ基準の一つである","預かり時間は長ければ長いほど、飼い主の満足度が上がる","「清潔感」はサロンを選ぶ基準の一つである","「オプションなどの勧め」は不快要素として挙げられている"],"a":1,"e":"不快要素として「トリミングでの預かり時間が長い」が挙げられています。一方で「逆にもう少し預かって欲しいのに延長料金が発生する」も不快要素です。"},{"l":"m","u":9,"s":2,"q":"犬がリラックスしているときの耳の様子として、テキストに書かれているものはどれですか。","c":["後ろに置いている","ぴったり頭にくっつけている","垂れ下がっていたり、前の方に立てていたりする","激しく動かしている"],"a":2,"e":"耳が垂れ下がっていたり前の方に立てているとき、犬は気分が良いリラックスしている状態です。耳を後ろに置くのは怖がっているときです。"},{"l":"m","u":15,"s":3,"q":"犬に与えてはいけない、塩分の多い食品の例として、テキストに挙げられていないものはどれですか。","c":["プロセスチーズ","ゆでた鶏のささみ（味付けなし）","かつおぶし","ロースハム"],"a":1,"e":"食パン・ロースハム・ウインナー・さつまあげ・プロセスチーズ・ベーコン・かつおぶし・しらすぼし・はんぺん・塩鮭が挙げられています。"},{"l":"m","u":17,"s":5,"q":"熱中症の犬の体を冷やすとき、一般に注意すべきこととして正しいものはどれですか。","c":["症状が落ち着いたら病院には行かなくてよい","水をかけたら風を当てずに毛布でくるむ","冷やしすぎないよう、体温を確認しながら冷やし、すぐに動物病院に連絡する","氷水に全身を長時間つける"],"a":2,"e":"【テキスト外】氷水などで急激に冷やしすぎると、体温が下がりすぎたり血管が縮んで熱が逃げにくくなることがあります。体温を確認しながら冷やし、すぐに動物病院に連絡します。テキストにも「異常がなくなったように見えても後々症状が出てくる」（感電）とあるように、応急手当の後は必ず獣医師の診察を受けます。"},{"l":"m","u":20,"s":2,"q":"1歳以降の狂犬病予防ワクチンは、いつ接種するとされていますか。","c":["毎年春","毎年冬","3年に1回","一生に1回"],"a":0,"e":"1歳以降は、1〜3年毎に混合ワクチンを接種し、毎年春に狂犬病予防ワクチンを接種します。"},{"l":"m","u":22,"s":4,"q":"2020年施行の環境省令による動物取扱責任者の要件変更について、すでに登録を受けている人の扱いとして正しいものはどれですか。","c":["施行から3年間は従前の要件で継続でき、2023年6月以降の更新は改正の要件となる","更新の必要がなくなる","すぐに全員が資格を失う","永久に従前の要件のまま践問題 第3回1/6"],"a":0,"e":"現在登録を受けている方は、2020年6月施行から3年間は従前の要件で登録の継続が出来ます。2023年6月以降の登録更新は改正の要件となります。"},{"l":"m","u":12,"s":2,"q":"テキストでは、愛犬を迎える前に「愛犬にかかるお金」をどうするとよいとしていますか。","c":["子どもに任せる","すべて借金でまかなう","必要になってから考える","ライフプランに合わせた計画を立てて予算化する"],"a":3,"e":"愛犬を迎える前に、ライフプランに合わせた計画を立て「愛犬にかかるお金」を予算化します。"},{"l":"m","u":14,"s":4,"q":"テキストで、皮膚が「最大の臓器」と書かれているほかに、どのような場所だとされていますか。","c":["一番見えにくい場所","一番目が届く場所","病気にならない場所","毛の生えない場所"],"a":1,"e":"皮膚は最大の臓器で、一番目が届く場所です。"},{"l":"m","u":11,"s":3,"q":"成犬について、テキストに書かれているものはどれですか。","c":["名前を聞き分けられない","家族の中で暮らせない","学ぶことはもうない","任務を与えられたり、褒められたりすると喜ぶ"],"a":3,"e":"最初の誕生日が過ぎると家族の中で生活し、外ではちゃんとした振る舞いを習得します。学びは一生涯続くこともあり、成犬は任務を与えられたり褒められたりすると喜びます。"},{"l":"m","u":19,"s":2,"q":"「健康寿命」とは何ですか。","c":["介護などの他力を必要とせず、自律して生活ができる年齢","平均寿命より長く生きた年数","ワクチンの効果が続く期間","病院に一度も行かずに生きた年数"],"a":0,"e":"「健康寿命」とは、介護などの他力を必要とせず、自律して生活ができる年齢のことです。"},{"l":"m","u":1,"s":3,"q":"オオカミの群れで、ボスになるのはどのような個体とされていますか。","c":["最も若いもの","最も強いもの","最もお腹を空かせたもの","最も体の小さいもの"],"a":1,"e":"狩りの時は一番前を走り、獲物のいる場所を探し当て、攻撃開始の合図をします。その時に、最も強いものがボスになります。"},{"l":"m","u":17,"s":4,"q":"誤飲・誤食をしてしまったとき、異物がまだ胃内にある可能性があり、吐き出させる処置が可能とされるのはおよそどのくらいの時間内ですか。","c":["1週間","5分以内","1日","1時間程度"],"a":3,"e":"誤飲・誤食1時間程度であれば、異物がまだ胃内にある可能性があり、吐き出させる処置が可能です。すぐに病院に連絡します。"},{"l":"m","u":18,"s":2,"q":"テキストで、犬に行うことが「必須条件」とされているものはどれですか。","c":["所有者明示","血統書の取得","トリミング","服を着せること"],"a":0,"e":"犬に所有者明示をすることは必須条件です。犬の鑑札や迷子札をつけたり、マイクロチップを挿入するなどして、所有者明示をしましょう。"},{"l":"m","u":14,"s":3,"q":"全犬種で起こりうる疾患のうち、「自分の体を異物として認識」してしまうものはどれですか。","c":["泌尿生殖器疾患","消化器疾患","外的疾患","免疫異常"],"a":3,"e":"免疫異常は、自分の体を異物として認識してしまう疾患です。"},{"l":"m","u":3,"s":3,"q":"テキストでは、犬一頭の世話はどのようなことと同じ労苦を必要とするとしていますか。","c":["家計を管理すること","庭の植物を手入れすること","週に1度、家の大掃除をすること","人間ひとりの面倒を看ること"],"a":3,"e":"犬一頭は、人間ひとりの面倒を看ることと同じ労苦を必要とします。糞尿・抜け毛・鳴き声・運動（散歩）など、注意することは沢山あります。"},{"l":"m","u":2,"s":2,"q":"狂犬病は、人・猫などどの範囲の動物が感染するとされていますか。","c":["すべての哺乳類","鳥類だけ","犬だけ","犬と人だけ践問題 第3回2/6"],"a":0,"e":"狂犬病は人・猫などすべての哺乳類が感染し、発症するとほぼ100％死に至ります。"},{"l":"m","u":21,"s":5,"q":"2019年の動物愛護管理法の改正（2022年6月施行）で、マイクロチップについて定められた内容として正しいものはどれですか。","c":["猫だけが対象となった","すべての飼い主に、すべてのペットへの装着が義務づけられた","ブリーダーやペットショップ等の犬猫等販売業者に、販売する犬猫へのマイクロチップの装着・登録が義務づけられた","マイクロチップの装着は禁止された"],"a":2,"e":"【テキスト外（テキストの補足）】犬猫等販売業者には販売する犬猫へのマイクロチップの装着・登録が義務づけられ、それ以外の飼い主には努力義務となっています。テキストの「犬猫の繁殖業者等にマイクロチップ装着・登録の義務化（義務対象者以外には努力義務を課す）」の内容です。"},{"l":"m","u":20,"s":3,"q":"犬を飼う前に認識しておくべき「犬と暮らすことのリスク」として、テキストに挙げられているものはどれですか。","c":["電気代の値上がりだけ","日焼け","天気の悪化","感染症・アレルギー・咬傷事故"],"a":3,"e":"犬と暮らすことは、色々なリスク（感染症・アレルギー・咬傷事故など）を背負うことでもあります。"},{"l":"m","u":23,"s":2,"q":"「コンパニオン・アニマル」という言葉は、どのような態度を表す言葉として用いられるようになってきたとされていますか。","c":["経済的な態度","競争的な態度","軍事的な態度","道徳的な態度"],"a":3,"e":"コンパニオン・アニマルは道徳的な態度を表す言葉として、用いられるようになってきたといえます。"},{"l":"m","u":20,"s":2,"q":"動物由来感染症にかかっても、初めはどのような症状のことが多いとされていますか。","c":["すぐに意識を失う","必ず高熱がでる","症状はまったく出ない","風邪やインフルエンザ、ありふれた皮膚病に似た症状"],"a":3,"e":"動物由来感染症に感染しても、初めは風邪やインフルエンザ、ありふれた皮膚病などに似た症状のことも多く、発見が遅れがちです。"},{"l":"m","u":11,"s":2,"q":"家族になった子犬が、まずその家族の中で身につけることとして、テキストに書かれているものはどれですか。","c":["ドッグスポーツをすること","他人の家に遊びに行くこと","自分の新しい名前を聞き分けること","留守番をすること"],"a":2,"e":"犬の一生にとって、それだけでは十分ではありませんが、まずその家族の中で自分の新しい名前を聞き分けることを身につけます。"},{"l":"m","u":24,"s":2,"q":"犬が亡くなった後、自治体に死亡届を提出しなければならない期限はどれですか。","c":["7日以内","30日以内","1年以内","3か月以内"],"a":1,"e":"犬が亡くなって30日以内に自治体に死亡届を提出しなければなりません。"},{"l":"m","u":15,"s":1,"q":"犬の体重は、どのくらいの頻度ではかるのがよいとされていますか。","c":["体重ははからなくてよい","一年に一回","毎食ごと","一か月に一回"],"a":3,"e":"犬が太りすぎないように一か月に一回は犬の体重をはかります。犬に沢山ご褒美をあげる時にはメインの食事を少なくしなければなりません。"},{"l":"m","u":15,"s":2,"q":"犬に必要な水分のうち、飲み水及びフードから摂取される割合として、テキストに書かれているものはどれですか。","c":["10〜20%","90〜95%","100%","40〜50%"],"a":1,"e":"体に必要な水分のほとんど（90〜95%）は、飲み水及びフードから摂取されます。"},{"l":"m","u":8,"s":3,"q":"散歩中に、柱や木に犬をつないだままにすることについて、テキストではどうしていますか。","c":["繋ぎっぱなしにしない","短い時間なら何時間でもよい","口輪をすればよい","リードを長くすればよい"],"a":0,"e":"お散歩マナーとして「柱や木に繋ぎっぱなしにしない」があります。"},{"l":"m","u":4,"s":3,"q":"犬の視覚のしくみで、網膜と受容器に像を合わせる働きをするものはどれですか。","c":["鼓膜","味蕾","水晶体","嗅細胞"],"a":2,"e":"視覚は、網膜と受容器に像を合わせる水晶体と、大脳皮質に情報を伝える視神経で構成されています。"},{"l":"m","u":12,"s":3,"q":"テキストの費用の表についての記述として、誤っているものはどれですか。","c":["ペット保険は「臨時でかかるお金」に入っている","狂犬病予防注射や混合ワクチン接種の年間費用は、大型犬ほど高くなる","ノミ・ダニ予防薬は、大型犬ほど高くなる","金額はあくまで目安で、犬種や地域、生活スタイルなどによって異なる"],"a":1,"e":"狂犬病予防注射（3,500円）、混合ワクチン接種（8,000円）、健康診断（4,000円）は大きさに関係なく同じ金額です。"},{"l":"m","u":5,"s":2,"q":"テレビや映画、雑誌などに登場するタレント犬を何と言いますか。","c":["セラピー・ドッグ","アラート・ドッグ","アクティング・ドッグ","警備犬"],"a":2,"e":"アクティング・ドッグはテレビや映画、雑誌などに登場するタレント犬です。"},{"l":"m","u":18,"s":3,"q":"防災手帳に記録しておくこととして、テキストに挙げられていないものはどれですか。","c":["犬の好きなテレビ番組","登録番号","マイクロチップ番号","狂犬病予防接種歴践問題 第3回3/6"],"a":0,"e":"飼い主の住所・氏名・電話、愛犬の名前・種類・性別・毛色・体重・登録番号・マイクロチップ番号・狂犬病予防接種歴・ワクチン接種歴・常備薬・ホームドクターなどを記録します。"},{"l":"m","u":13,"s":2,"q":"車の窓が曇ったときにすることとして、テキストに書かれているものはどれですか。","c":["湿度を下げる調整をする","窓を全開にして犬の顔を出させる","何もしない","暖房を最強にする"],"a":0,"e":"窓が曇ったら湿度を下げる調整をします。犬は高湿度が苦手です。"},{"l":"m","u":19,"s":5,"q":"寝たきりの犬の「床ずれ（褥瘡）」を防ぐために、一般に大切とされることはどれですか。","c":["数時間ごとに寝る向き（体位）を変え、やわらかいマットを使う","硬い床に直接寝かせる","ずっと同じ向きで寝かせる","毎日シャンプーをする"],"a":0,"e":"【テキスト外】床ずれは、同じ場所に長時間体重がかかり続けることでできます。数時間ごとに体位を変える、体圧を分散するマットを使う、皮膚を清潔に保つ、などが予防になります。テキストにあるように、高齢で心臓に疾患がある場合はシャンプーの負担に注意します。"},{"l":"m","u":3,"s":2,"q":"共生するためのしつけを、テキストでは犬への何と表現していますか。","c":["課外活動","高等教育","義務教育","自由研究"],"a":2,"e":"共生するためのしつけは「犬への義務教育」と表現されています。しつけられていない犬は野獣の範疇です。"},{"l":"m","u":18,"s":4,"q":"防災チェックシートの「その他の準備」で、引越しなどで住所が変わった場合に行うこととして挙げられているものはどれですか。","c":["犬の名前の変更","マイクロチップの情報や、犬の登録情報の変更","犬種の変更","ワクチンの再接種"],"a":1,"e":"引越しなどで住所が変わった場合、マイクロチップの情報や、犬の登録情報の変更を行いましたか？というチェック項目があります。ほかに、ご近所と良好な関係、防災訓練への参加、飼養ルールを守る、犬を連れて避難コースを歩いたことがあるか、などがあります。"},{"l":"m","u":18,"s":5,"q":"環境省のガイドラインで示されている、災害時にペットと一緒に安全な場所まで避難することを何と言いますか。","c":["一時預かり","同行避難","同伴避難","在宅避難"],"a":1,"e":"【テキスト外】環境省は、災害時にペットと一緒に避難所などの安全な場所まで避難する「同行避難」を推奨しています。同行避難は、避難所で人とペットが同じ部屋で過ごせること（「同伴避難」と呼ばれることもある）を意味するわけではありません。"},{"l":"m","u":4,"s":2,"q":"両目で捉えられる視野のことを何といいますか。","c":["視力","動体視力","立体視野","色覚"],"a":2,"e":"左右それぞれの目で見える範囲を視野といい、両目で捉えられる視野を立体視野といいます。"},{"l":"m","u":21,"s":3,"q":"フローリングの滑り止めとして、トイレのしつけができる前におすすめとされているものはどれですか。","c":["ペット用マット","新聞紙","じゅうたん","ペット用ワックス"],"a":3,"e":"トイレしつけができる前だと、マットの上で粗相をしがちなので、ペット用ワックスがお薦めです。"},{"l":"m","u":20,"s":3,"q":"ワンヘルス（One Health）の考え方で、連携して取り組むとされる3つの分野の組み合わせとして正しいものはどれですか。","c":["医師・薬剤師・看護師","人・動物・環境","人・食べ物・お金","犬・猫・鳥践問題 第3回4/6"],"a":1,"e":"テキストに「人・動物・環境の衛生に関わるものが連携して取り組むワンヘルスという考え方」とあります。人の健康・動物の健康・環境の健全性を一つのものとして考え、医師や獣医師などが分野を越えて協力する考え方です。"},{"l":"m","u":5,"s":3,"q":"使役犬について、紀元前1000年頃に狩猟犬やそり犬の役割を担っていたとテキストに書かれているのは、どこの人々ですか。","c":["イギリスの人々","中国の人々","カナダ北部のイヌイット","古代エジプトの人々"],"a":2,"e":"紀元前1000年頃、カナダ北部のイヌイットの間で狩猟犬やそり犬の役割を担っていました。"},{"l":"m","u":13,"s":3,"q":"アジリティの起源とされるのは何ですか。","c":["1978年のクラフトショーでのデモンストレーション","北極地方の犬ぞりレース","日本の流鏑馬","古代ローマの戦車競走"],"a":0,"e":"アジリティは1978年のクラフトショーでのデモンストレーションが起源とされています。"},{"l":"m","u":8,"s":4,"q":"「若齢期後半」（生後16週〜6か月）の特徴として、テキストに書かれているものはどれですか。","c":["耳が遠くなる","骨格の成長が止まる","経験が身につき、犬の性格が完成する","母犬が授乳と排泄を行う"],"a":2,"e":"若齢期後半は経験が身につき、犬の性格が完成する期間です。"},{"l":"m","u":22,"s":3,"q":"動物愛護管理法で、「みだりに」愛護動物を殺したり傷つけたりした場合の罰則として、テキストに書かれているものはどれですか。","c":["10年以下の懲役","5年以下の懲役または500万円以下の罰金","注意だけで罰則はない","1万円以下の罰金"],"a":1,"e":"テキストに「みだりに殺したり傷つけたりした場合は、5年以下の懲役または500万円以下の罰金です」とあります。動物の殺傷・虐待は犯罪行為です。"},{"l":"m","u":6,"s":3,"q":"「過剰な愛情？」で、公共の場で気をつけるべき理由としてテキストに挙げられているものはどれですか。","c":["ペットが苦手な人や、特定の動物にアレルギー反応が出る人もいるから","ペットは公共の場では眠くなるから","公共の場ではペットが太るから","法律で公共の場への同伴が全面禁止だから"],"a":0,"e":"世の中にはペットが苦手な人もいますし、特定の動物に対してアレルギー反応が現れる人もいます。"},{"l":"m","u":20,"s":2,"q":"犬に寄生するノミのほとんどは、何であるとみられていますか。","c":["猫ノミ","犬ノミ","鳥ノミ","人ノミ"],"a":0,"e":"ノミは宿主を限定することなく寄生し、犬・猫に寄生するノミはほとんどが猫ノミとみられています。"},{"l":"m","u":15,"s":3,"q":"犬が体内で合成できるため、人のようにあえて食べ物から摂取する必要がないとされるビタミンはどれですか。","c":["ビタミンD","ビタミンC","ビタミンB1","ビタミンA"],"a":1,"e":"犬の場合、体内でビタミンCを合成できるので、人のようにあえて食べ物から摂取する必要はありません。"},{"l":"m","u":24,"s":2,"q":"愛犬が亡くなった後、遺体を安置するときの方法として、テキストに書かれているものはどれですか。","c":["頭を体より上の位置にあげて寝かせ、保冷剤などを入れて直射日光のあたらない涼しい場所に安置する","日当たりのよい暖かい場所に安置する","毛布で何重にもくるんで温める","頭を体より下にして寝かせる"],"a":0,"e":"火葬の前に遺体が痛んでしまう前に、頭を体より上の位置にあげて寝かせ、頭・首・おなかの下に保冷剤やドライアイスを入れて直射日光のあたらない涼しい場所に安置します。特に夏の暑い時は遺体が痛みやすいので温度調節をします。"},{"l":"m","u":7,"s":5,"q":"法律の改正により、2022年6月から、ブリーダーやペットショップなどで販売される犬や猫への装着が義務づけられたものはどれですか。","c":["マイクロチップ","迷子札","GPS付きの首輪","鑑札"],"a":0,"e":"【テキスト外】動物愛護管理法の改正により、2022年6月から、ブリーダーやペットショップなどで販売される犬や猫には、マイクロチップの装着と情報の登録が義務づけられました。"},{"l":"m","u":20,"s":3,"q":"動物由来感染症が問題となる背景として、テキストに挙げられていないものはどれですか。","c":["先進国での高齢者など感染抵抗力が弱い人々の増加","ワクチンの開発が進みすぎたこと","野生動物のペット化","交通手段の発展による人ともの速やかな移動践問題 第3回5/6"],"a":1,"e":"背景には、人間の社会環境の変化と行動の多様化があげられています。交通手段の発展、人口の都市集中、土地開発と自然環境の変化、先進国では高齢者など感染抵抗力が弱い人々の増加や野生動物のペット化などです。"},{"l":"m","u":18,"s":2,"q":"犬の常備薬・処方薬の備えとして、テキストに書かれているものはどれですか。","c":["数日分を余分に用意し、処方箋のコピーと一緒に薬袋に入れて防水袋にいれる","人の薬で代用する","薬は持ち出さない","災害が起きてから動物病院でもらう"],"a":0,"e":"かかり付けの動物病院が被災し、診療を受けられなくなることも考えられます。犬の薬は数日分を余分に用意しておき、処方箋のコピーと一緒に薬袋に入れ、防水袋にいれます。"},{"l":"m","u":11,"s":2,"q":"子犬がひとりで餌を食べ、人間家族の家に引っ越すことができるようになるのは、生後何週からですか。","c":["4週から6週","8週から10週","20週から24週","2週から4週"],"a":1,"e":"子犬は生後8週から10週になるとひとりで餌を食べ、人間家族の家に引っ越すことが出来ます。"},{"l":"m","u":2,"s":3,"q":"オス犬の発情について、テキストの内容に合うものはどれですか。","c":["1年に1回、春だけ","毎月必ずある","発情は一生に1回だけ","1年に2回ほどで、季節には関係ない"],"a":3,"e":"オスの発情は1年に2回ほどで、季節には関係ありません。"},{"l":"m","u":22,"s":2,"q":"テキストの「資格について」の表で、「いぬ検定」はどの分野に分類されていますか。","c":["医療・福祉系","技術系","総合系","しつけ系"],"a":2,"e":"いぬ検定は「幅広く知識を身につけたい」という目的の総合系に分類されています。ペットの飼養管理やしつけの知識だけではなく、法令関係や人との関わり、獣医学や栄養学など学び、ペットのプロを目指せる資格です。"},{"l":"m","u":15,"s":4,"q":"ウエットフードの特徴として、テキストに書かれているものはどれですか。","c":["半生タイプ","水分10%以下のカリカリ","缶詰やパウチなどの密封容器で加圧・加熱・殺菌されている","ジャーキーなど践問題 第3回6/6"],"a":2,"e":"ウエットフードは缶詰・パウチなどの密封容器で加圧・加熱・殺菌したもので、風味が良いのが特徴です。"},{"l":"m","u":11,"s":3,"q":"子犬が生まれた後、二週間を過ぎてからの次の四週間で行うこととして、テキストに書かれているものはどれですか。","c":["交尾期を迎える","散歩のマナーを学ぶ","ひとりで人間の家に引っ越す","母の保護の下、自分の世界を探る"],"a":3,"e":"生後二週間で目を開け耳が聞こえるようになり、最初の乳歯が生え、よちよち歩きを始めます。次の四週間で母の保護の下、自分の世界を探ります。"},{"l":"m","u":17,"s":2,"q":"皮膚が破れて骨が露出している骨折を何と言いますか。","c":["開放性骨折","脱臼","捻挫","閉鎖性骨折"],"a":0,"e":"皮膚が破れて骨が露出する「開放性骨折」と、骨が露出していない「閉鎖性骨折」があります。開放性の場合は患部にガーゼがくっつかないように、生理食塩水などで湿らせたガーゼを巻きます。"},{"l":"m","u":20,"s":4,"q":"狂犬病の流行国で犬に接する機会がある場合や長期滞在する場合について、テキストではどうするのが望ましいとしていますか。","c":["何もしなくてよい","渡航前にワクチン接種を受ける","帰国後に検査だけ受ける","犬を連れていく"],"a":1,"e":"狂犬病の流行国で犬に接する機会がある場合や、長期滞在する場合は、渡航前にワクチン接種が望ましいです。"},{"l":"m","u":21,"s":2,"q":"クレートなど、愛犬の居場所として適しているのはどのような場所ですか。","c":["ドアや窓から離れた、人の行き来が少なく静かな場所","家族が一番よく通る廊下","玄関のドアのすぐ横","窓ぎわの日当たりのよい場所"],"a":0,"e":"愛犬が落ち着けるように、できるだけ人の行き来が少なく、外の刺激が受けにくい静かな場所に居場所をもうけます。安心できる居場所ができるとストレスがたまりにくくなります。"},{"l":"m","u":4,"s":3,"q":"犬の脳の「嗅脳」が持つとされる機能として、テキストに書かれているものはどれですか。","c":["体温を下げる機能","食欲や性欲など種の繁栄に重要な機能","音の高さを聞き分ける機能","色を見分ける機能"],"a":1,"e":"嗅脳は匂いを感知するのに優れた器官で、食欲や性欲など種の繁栄に重要な機能を持つといわれています。"},{"l":"m","u":13,"s":3,"q":"飲食店に入る前にすることとして、テキストに書かれているものはどれですか。","c":["愛犬のトイレを済ませる","愛犬にごはんを食べさせる","愛犬にたくさん水を飲ませる","愛犬をシャンプーする"],"a":0,"e":"飲食店に入る前に、愛犬のトイレを済ませます。"},{"l":"m","u":8,"s":3,"q":"飼い主が手助けが必要な「要介護状態」について家族で話し合うとき、どのくらい先をイメージするとよいとされていますか。","c":["1年先","10年以上先","1か月先","3年先践問題 第4回1/8"],"a":1,"e":"手助けが必要になる10年以上先をイメージして話し合います。"},{"l":"m","u":22,"s":3,"q":"法改正により、出生後何日を経過しない犬猫の販売が制限されましたか。","c":["1年","91日（13週）","30日（4週）","56日（8週）"],"a":3,"e":"出生後、56日（8週）を経過しない犬猫の販売を制限（交付2年以内に施行）しています。"},{"l":"m","u":17,"s":3,"q":"脱水症の原因として、テキストに挙げられていないものはどれですか。","c":["腎臓疾患","十分な水分摂取","熱中症","嘔吐や下痢"],"a":1,"e":"脱水症の原因は、熱中症・発熱・嘔吐・下痢・感染症（イヌパルボウイルスなど）・腎臓疾患・水分不足などです。"},{"l":"m","u":4,"s":2,"q":"犬の色覚で、網膜にあり色を感知する細胞を何と言いますか。","c":["錐状細胞","味蕾","嗅細胞","耳小骨"],"a":0,"e":"色は網膜の錐状細胞で感知します。犬の錐状体の数は人の1/6以下です。"},{"l":"m","u":8,"s":4,"q":"怖がりな犬に真正面から近づくと、どのように感じさせてしまうとされていますか。","c":["喜んで近寄ってくる","お腹がすく","眠くなる","威圧的に感じて不安になる"],"a":3,"e":"真正面から近づくと怖がりな犬は威圧的に感じて不安になります。ゆっくりと斜め横から近づきます。"},{"l":"m","u":16,"s":3,"q":"オプションサービスの「被毛処理」の例として、テキストに書かれているものはどれですか。","c":["カラーリング・エクステ","肉球ケア・アロママッサージ","泥パック・ハーブ","レイキング・プラッキング"],"a":3,"e":"被毛処理の例として、レイキング・プラッキング等が挙げられています。"},{"l":"m","u":1,"s":4,"q":"オオカミの群れのメンバーが洞窟の中で互いにする行動として、テキストに書かれていないものはどれですか。","c":["互いにまといつく","毛についた虫をかじり合う","獲物の奪い合いをする","互いの鼻をなめ合う"],"a":2,"e":"群れのメンバーは全員が洞窟の中にいて、互いにまといつき、毛についた虫をかじり合って食べ、互いの鼻をなめ合います。"},{"l":"m","u":8,"s":3,"q":"犬の年齢をヒトの年齢であらわした表で、10歳の大型犬はヒトの何歳にあたりますか。","c":["75歳","110歳","56歳","44歳"],"a":0,"e":"10歳の大型犬はヒトの75歳、小型犬・中型犬は56歳にあたります。"},{"l":"m","u":10,"s":3,"q":"『犬の十戒』の9番目で、犬は飼い主にどのようにしてほしいと伝えていますか。","c":["老犬になったら散歩はしなくてよい","若いうちだけ世話をしてほしい","老犬になったら施設に預けてほしい","老犬になっても、今まで通りに世話をしてほしい"],"a":3,"e":"十戒の9番目は、老犬になっても今まで通りに世話をしてほしい、あなたも歳を取る、という内容です。"},{"l":"m","u":18,"s":4,"q":"防災チェックシートで説明されている「生存空間」とは何ですか。","c":["避難所の中で犬を飼える場所","家の外に作る犬小屋","車の中の犬用スペース","建物や家具が倒れたときに、人と動物が生き残れるような隙間ができるよう、頑丈な家具を配置して固定し、寝場所やくつろげるスペースを作ること"],"a":3,"e":"生存空間とは、建物や家具が倒れたときに、人と動物が生き残れるような隙間ができるよう、あらかじめ頑丈な家具を配置して固定し、動物の寝場所やくつろげるスペースを作ることです。"},{"l":"m","u":13,"s":4,"q":"お泊まりの決まり事として、テキストに挙げられていないものはどれですか。","c":["クレートに慣れさせる","主治医の連絡先をメモする","犬用の布団を必ず持参する","ワクチン接種の証明書を持参する践問題 第4回2/8"],"a":2,"e":"トイレのしつけ、ワクチン接種の証明書の持参、主治医の連絡先のメモ、クレートに慣れさせる、お気に入りのおもちゃ、が挙げられています。"},{"l":"m","u":15,"s":3,"q":"子犬が誤飲しやすいものとして、テキストに挙げられていないものはどれですか。","c":["総合栄養食のドライフード","竹串","ストッキング・靴下","とうもろこしの芯"],"a":0,"e":"誤飲しやすいものとして、ストッキング・靴下・ひも・糸、竹串・とうもろこしの芯・くだものの種が挙げられています。"},{"l":"m","u":21,"s":2,"q":"人の食べ物をしまう場所として、テキストに書かれているものはどれですか。","c":["テーブルの上","床の上","戸棚や冷蔵庫など見えないところ","犬のクレートの中"],"a":2,"e":"中毒性のある食べ物を口にしてしまうと危険なので、戸棚や冷蔵庫など見えないところにしまいます。"},{"l":"m","u":8,"s":5,"q":"望ましい行動の直後にごほうびを与えて、その行動を増やしていく学習の方法を何といいますか。","c":["体罰","慣れ（馴化）","正の強化（陽性強化）","刷り込み"],"a":2,"e":"【テキスト外】望ましい行動の直後にほめ言葉やごほうびを与えて、その行動を増やす方法を「正の強化（陽性強化）」と呼びます。テキストの「ほめてしつけよう」の考え方です。"},{"l":"m","u":19,"s":2,"q":"「介護」と併せて考える必要がある、老化からくる体への支障（病気）への対策を何と言いますか。","c":["旅行","医療（動物医療）","美容","娯楽"],"a":1,"e":"シニア期で「介護」と併せて考えるのが、老化からくる体への支障、つまり「病気（動物医療）」についての対策です。「医療」と「介護」は切っても切れない関係です。"},{"l":"m","u":14,"s":2,"q":"テキストによると、3歳以上で約何%の犬が歯周病にかかっていると言われていますか。","c":["約30%","約80%","約50%","約10%"],"a":1,"e":"子犬の頃からケアが出来ていないために、3歳以上で約80%の犬が歯周病にかかっていると言われています。"},{"l":"m","u":3,"s":2,"q":"犬は自ら飼い主を選ぶことができず、飼うかどうかは人間の一方的な判断に委ねられます。ここで生じる責任を何と呼びますか。","c":["飼い主責任","家族責任","共同責任","社会責任"],"a":0,"e":"ここで飼い主としての責任が生じます。これを「飼い主責任」と呼びます。"},{"l":"m","u":19,"s":2,"q":"犬が成犬になるまでの期間は、人間と比べて何倍の早さとされていますか。","c":["20倍","4倍","2倍","10倍"],"a":3,"e":"人間の成人（18〜20年）と比較すると、成犬になるまでの期間（おおむね1〜2年）は人間にくらべて10倍の早さです。成犬以降は徐々にスピードダウンしてシニア期以降、おおむね人間の4倍のスピードに落ち着きます。"},{"l":"m","u":2,"s":2,"q":"犬の妊娠期間として、テキストに書かれているものはどれですか。","c":["約30日","6か月前後","約100日","58〜63日"],"a":3,"e":"妊娠期間は58〜63日です。交尾期に交尾をすると約60日後に赤ちゃんが生まれます。"},{"l":"m","u":14,"s":3,"q":"ノミ・ダニの予防薬を年間を通して投与する理由として、テキストに書かれているものはどれですか。","c":["薬の値段が安いから","夏は薬が効かないから","空調（暖房）が発達した現代では、年間を通して寄生のおそれがあるから","冬にしか寄生しないから"],"a":2,"e":"ノミの予防薬は、空調（暖房）が発達した現代では年間を通して投与します。"},{"l":"m","u":14,"s":3,"q":"テキストで、散歩前に歯磨きをするとよいとされている理由として正しいものはどれですか。","c":["散歩中に歯垢が自然に取れるから","気持ちが高揚していて少しくらいの嫌なことは我慢しやすく、歯磨き⇒散歩を一連の行為として覚えるから","散歩の前は口の中の細菌が少ないから","散歩の後は疲れて口を開けないから"],"a":1,"e":"散歩を前にして気持ちが高揚しているので、少しくらいの嫌なことは我慢してくれるかも知れないからです。繰り返し行うことで、犬は歯磨き⇒散歩と一連の行為として覚えるので受入れやすくなる可能性があります。"},{"l":"m","u":22,"s":3,"q":"動物愛護管理法で定められている飼い主の責務（テキストより）の第2項はどれですか。","c":["愛犬の身元が分かるように表示すること","愛犬が繁殖しすぎることがないように対策を取ること","犬の病気について正しい知識を持ち、予防すること","愛犬が命を終えるまで適切に飼うこと"],"a":2,"e":"第2項は「犬の病気について正しい知識を持ち、予防すること」です。"},{"l":"m","u":21,"s":2,"q":"フローリングに滑り止め対策をする理由として、テキストに書かれているものはどれですか。","c":["骨や関節への負担を少なくするため","掃除を減らすため","犬が早く走れるようにするため","床を傷つけないためだけ"],"a":0,"e":"滑りやすい床には、ペット用のマットを敷いたり滑らない加工を施したりすると良いです。滑りにくくすることで、骨や関節への負担も少なくなります。"},{"l":"m","u":20,"s":4,"q":"遺伝病とそれが多い犬種の組み合わせとして、テキストの内容に合うものはどれですか。","c":["ひざ蓋関節亜脱臼症 ― 大型犬","股関節形成不全症 ― 小型犬","皮膚筋炎 ― コリー、シェルティー","筋緊強症 ― ダックスフンド"],"a":2,"e":"皮膚筋炎はコリー・シェルティーに発生します。ひざ蓋関節亜脱臼症は小型犬、筋緊強症はチャウチャウ、股関節形成不全症は大型犬に多発します。"},{"l":"m","u":23,"s":4,"q":"テキストでは、犬は「3つの随伴性」と何によって行動を強化するとしていますか。","c":["遺伝だけ","本能だけ","オペラント条件付け（行動の直後に良いことがあれば行動が増え、悪いことが起こると減る）","刷り込み"],"a":2,"e":"犬は人と同じように、3つの随伴性とオペラント条件付けによって行動を強化します。行動の仕組みは、きっかけ→行動→結果（これを随伴性と呼びます）。学習の過程は、オペラント条件付け（行動の直後に良いことがあれば行動が増え、悪いことが起こると行動は減る）によって強化されます。"},{"l":"m","u":18,"s":2,"q":"災害に備えて、寝るときに枕元においておくとよいとされているものはどれですか。","c":["スリッパ・靴","おやつ","テレビのリモコン","犬のおもちゃ"],"a":0,"e":"枕元にスリッパ・靴をおいて寝る習慣をつけましょう。ガラスや瓦礫に注意して避難するためです。"},{"l":"m","u":3,"s":4,"q":"犬の飼養で「飼い主責任」が生じる理由として、テキストに書かれているものはどれですか。","c":["犬が高価だから","犬が自分で飼い主を選ぶから","犬は自ら飼い主を選択できず、飼うかどうかは人間の一方的な判断に委ねられるから","法律で犬の値段が決められているから"],"a":2,"e":"犬は自ら飼い主を選択することはできず、飼うかどうかは人間の一方的な判断に委ねられます。ここで飼い主としての責任が生じます。"},{"l":"m","u":6,"s":4,"q":"テキストでは、十分に検討し家族で一つの結論を出す経験は、ペットを飼うことだけでなく、どのような時に生きてくるとしていますか。","c":["犬の名前を決める時だけ","後々に家族で様々なことを決めていく時","子どもが学校の宿題をする時","子どもが友達とけんかした時"],"a":1,"e":"結論がどうであれ、十分に検討し家族で一つの結論を出す経験は、ペットを飼うことだけでなく、後々に家族で様々なことを決めていく時に生きてくることでしょう、と書かれています。"},{"l":"m","u":2,"s":2,"q":"自家製の食事で与えてはいけない食材として、第2章に挙げられているものの組み合わせはどれですか。","c":["にんじん・キャベツ・ささみ","タマネギ・ニラ・鶏の骨","ささみ・白身魚・豆腐","ごはん・かぼちゃ・りんご"],"a":1,"e":"自家製の食事では、タマネギ・ニラ・鶏の骨など与えてはいけない食材に注意が必要です。"},{"l":"m","u":5,"s":3,"q":"視覚ハウンドタイプの犬を飼うときの注意点として、テキストに書かれているものはどれですか。","c":["胴長短足なのでヘルニアに注意","吠え声が大きいので無駄吠えのしつけが必要","穴を掘る習性がある","動物を追い立てる習性があるので、他の動物との同居には注意が必要"],"a":3,"e":"視覚ハウンドタイプは優れた視覚と走力で獲物を追跡・捕獲します。動物を追い立てる習性があり、他の動物との同居には要注意です。"},{"l":"m","u":18,"s":4,"q":"屋外飼育の犬が驚いて逃げ出すことに備えて、見直すとよいとされているものはどれですか。","c":["食器の大きさ","柵の高さ","犬小屋の屋根の色","首輪の色"],"a":1,"e":"驚いて逃げ出すことも考えられるので、柵の高さなども見直します。"},{"l":"m","u":22,"s":3,"q":"テキストに書かれている、動物愛護管理法で定められている飼い主さんの責務として、誤っているものはどれですか。","c":["愛犬が逃げたり、迷子になったりしないように対策を講じる","愛犬の健康・安全を保ち、周囲に迷惑をかけない","愛犬の身元が分かるように表示する","愛犬をできるだけたくさん繁殖させる"],"a":3,"e":"第5項は「愛犬が繁殖しすぎることがないように対策を取ること」です。"},{"l":"m","u":2,"s":2,"q":"年齢を基準としたフードのうち、「高齢犬用」は何歳以上の犬が対象ですか。","c":["5歳以上","12歳以上","7歳以上","10歳以上"],"a":2,"e":"12か月齢までの幼犬用、1〜6歳の成犬用、7歳以上の高齢犬用のフードがあります。"},{"l":"m","u":18,"s":5,"q":"犬の所有者明示の方法のうち、狂犬病予防法にもとづき市区町村から交付され、犬に装着することが義務づけられているものはどれですか。","c":["鑑札と注射済票","迷子札","GPS首輪","名前入りの洋服"],"a":0,"e":"【テキスト外】狂犬病予防法では、犬の登録をすると交付される「鑑札」と、狂犬病予防注射を受けると交付される「注射済票」を犬に装着することが義務づけられています。迷子札は任意です。"},{"l":"m","u":15,"s":2,"q":"毎日の主要な食事として、新鮮な水と一緒に与えることで健康維持できるフードはどれですか。","c":["総合栄養食","その他の目的食","療法食","間食"],"a":0,"e":"総合栄養食は毎日の主要な食事で、新鮮な水と一緒に与えることで健康維持できる栄養バランスのフードです。"},{"l":"m","u":16,"s":3,"q":"トリミングサロンを選ぶ上で利用したい基準として、テキストに挙げられていないものはどれですか。","c":["技術・仕上がり","清潔感","スタッフが私服で作業していること","ペットの扱い方・優しさ"],"a":2,"e":"私服姿は店舗での不快要素として挙げられています。"},{"l":"m","u":11,"s":1,"q":"犬はどのような動物の仲間ですか。","c":["鳥類","両生類","爬虫類","哺乳類"],"a":3,"e":"犬は私達人間と同じ哺乳類であり、巣立つまで親と一緒に暮らす動物です。生後自分では食料を調達出来ず、親から母乳や餌を与えられます。"},{"l":"m","u":19,"s":3,"q":"犬の認知症の原因として、テキストに書かれているものはどれですか。","c":["運動のしすぎ","食べすぎ","老化に伴う脳神経細胞の衰えからくる自律神経機能の低下","ワクチンの接種"],"a":2,"e":"認知症は、老化に伴う脳神経細胞の衰えからくる自律神経機能の低下が原因とされます。最近ではマンションでの室内飼いが増えたことで夜鳴きに関する相談も多いですが、完治が難しいので対処法（介護）が主体になります。"},{"l":"m","u":20,"s":2,"q":"厚生労働省が人の健康問題という視点から使っている言葉はどれですか。","c":["家畜伝染病","新興感染症","人獣共通感染症","動物由来感染症"],"a":3,"e":"人と動物に共通する感染症（ズーノーシス）は「人獣共通感染症」や「人と動物の共通感染症」とも言われますが、厚生労働省は人の健康問題という視点から「動物由来感染症」という言葉を使っています。"},{"l":"m","u":8,"s":2,"q":"犬や人との関わり方を身につける社会化を学ぶ「最も重要な時期」とされている第一次社会化期は、いつ頃ですか。","c":["生後4週〜13週齢頃","生後2週齢まで","生後2歳〜8歳","生後6か月〜2年"],"a":0,"e":"社会化期（第一次社会化期）は生後4週〜13週齢頃で、犬や人との関わり方を身につける社会化を学ぶ最も重要な時期です。"},{"l":"m","u":17,"s":3,"q":"運動していない・気温が高くない時の過剰なパンティングで疑われることとして、テキストに書かれているものはどれですか。","c":["しつけ不足","呼吸不全や心臓・肺の病気","空腹","眠気"],"a":1,"e":"運動していない時や気温が高くない時に過剰なパンティングをしている場合は、呼吸不全や心臓や肺の病気などが疑われるので注意が必要です。"},{"l":"m","u":24,"s":2,"q":"ペットロスの悲しみについて、テキストではどのように説明していますか。","c":["悲しみは誰にも起こらない","心の支えでないほど悲しみは深い","ペットが心の支えであればあるほど悲しみは深く、立ち直るまでに時間がかかる","悲しみはすぐに消える"],"a":2,"e":"ペットが心の支えであればあるほど悲しみは深く、立ち直るまでに時間がかかります。"},{"l":"m","u":15,"s":3,"q":"犬の水についての記述として、誤っているものはどれですか。","c":["水は体内の物質の運搬や体温調節など様々な役割を担う","ドライフードは水分含有量が多いので、水は少なめでよい","体に必要な水分のほとんど（90〜95%）は、飲み水及びフードから摂取される","水分量は、フードの種類や気温、運動量などによって大きく左右される践問題 第4回6/8"],"a":1,"e":"ドライフードは水分含有量が少ない（10%以下）ため、与える時には必ず新鮮な水と一緒に与えます。"},{"l":"m","u":20,"s":2,"q":"ひざ蓋関節亜脱臼症が多発するとされている犬はどれですか。","c":["小型犬","コリー","チャウチャウ","大型犬"],"a":0,"e":"ひざ蓋関節亜脱臼症は小型犬に多発します。股関節形成不全症は大型犬、筋緊強症はチャウチャウ、皮膚筋炎はコリー・シェルティーです。"},{"l":"m","u":20,"s":3,"q":"ワンヘルス（One Health）の考え方で、連携して取り組むとされる3つの分野の組み合わせとして正しいものはどれですか。","c":["医師・薬剤師・看護師","犬・猫・鳥","人・動物・環境","人・食べ物・お金"],"a":2,"e":"テキストに「人・動物・環境の衛生に関わるものが連携して取り組むワンヘルスという考え方」とあります。人の健康・動物の健康・環境の健全性を一つのものとして考え、医師や獣医師などが分野を越えて協力する考え方です。"},{"l":"m","u":20,"s":3,"q":"生物テロに用いられる可能性があるものとして、テキストに挙げられているものの組み合わせはどれですか。","c":["炭疽菌・ペスト菌・野兎病菌","花粉・ほこり・カビ","回虫・ノミ・ダニ","乳酸菌・納豆菌・酵母"],"a":0,"e":"生物テロに用いられる可能性があるものとして、炭疽菌・ペスト菌・野兎病菌などの細菌、ウイルス性出血熱等の原因ウイルス等があげられていますが、いずれも動物由来感染症の病原体です。"},{"l":"m","u":21,"s":3,"q":"ティッシュが犬にイタズラされやすい理由として、テキストに書かれているものはどれですか。","c":["音が出るから","色が派手だから","甘い味がするから","犬には動くモノに反応しやすい習性があり、ひらひら動くから"],"a":3,"e":"犬には動くモノに反応しやすい習性があり、ひらひら動くティッシュはイタズラされやすいものの一つです。"},{"l":"m","u":18,"s":3,"q":"避難先での過ごし方として、テキストの内容と合わないものはどれですか。","c":["糞尿の後始末をしっかりとする","苦情や咬傷事故が発生しないように十分に注意する","飼養場所の清掃をし、常に清潔にする","給餌は犬が欲しがるたびに、時間を決めずに行う"],"a":3,"e":"不衛生にならないよう、給餌は時間を決め、給餌の後はキレイに片付けます。"},{"l":"m","u":13,"s":3,"q":"わんちゃんと散歩に出かけるだけで延伸するとされる男性の健康寿命はどのくらいですか（ペットフード協会のデータ）。","c":["2.79才","0.44才","9年","12年半"],"a":1,"e":"男性は0.44才、女性は2.79才の健康寿命を延伸するというデータが公表されています。"},{"l":"m","u":18,"s":2,"q":"防災用品の「動物の写真」の役割として、テキストに書かれているものはどれですか。","c":["避難所に飾るため","体重をはかるため","迷子の手がかりや、飼い主であることの証明","犬を落ち着かせるため"],"a":2,"e":"動物の写真は迷子になった時の手がかりや、飼い主の証明になります。"},{"l":"m","u":4,"s":1,"q":"人の嗅細胞は約500万個です。犬の嗅細胞はおよそいくつですか。","c":["約50億個","約500万個","約2億2千万個","約2,200万個"],"a":2,"e":"犬の嗅細胞は約2億2千万個にも上ります。人の約40倍以上です。"},{"l":"m","u":15,"s":2,"q":"キシリトール入りのガムを犬が食べた場合に起こるとされる症状として、テキストに書かれているものはどれですか。","c":["赤血球の破壊","のどや消化管の傷","腎不全","少量でも血糖値の低下や嘔吐、肝不全"],"a":3,"e":"キシリトール入りのガムは、少量でも血糖値の低下や嘔吐、肝不全を起こします。"},{"l":"m","u":5,"s":4,"q":"盲導犬の主な犬種が選ばれる理由として、テキストに書かれているものはどれですか。","c":["小さくて抱っこしやすいから","人とともに生活することが得意で、人間を誘導できる大きさを兼ね備えているから","毛が抜けないから","吠え声が大きいから"],"a":1,"e":"盲導犬の主な犬種（ラブラドール・ゴールデン・ジャーマン・シェパード）は、人とともに生活することが得意で、人間を誘導できる大きさを兼ね備えた犬種です。"},{"l":"m","u":11,"s":2,"q":"テキストでは、規則正しい日課は犬に何を与えるとしていますか。","c":["競争心","退屈","緊張感","安心感"],"a":3,"e":"犬は明確なルールを必要とし、自分の生活の中にルーティーンワークがあることを欲します。規則正しい日課は、犬に安心感を与え、犬は心地よいと感じます。"},{"l":"m","u":8,"s":3,"q":"災害など「もしもの時」に備えたしつけや準備として、テキストで挙げられていないものはどれですか。","c":["日頃からクレートに慣れさせる","他人や様々な環境に慣れさせる","特定のフードしか食べないように習慣づける","ペットシーツで排泄できるようにする"],"a":2,"e":"テキストでは、クレートに慣れさせる、ペットシーツでの排泄、他人や様々な環境に慣れさせる、ハーネス・首輪・迷子札の装着、数日間のフードの準備、どのようなタイプの食事でも食べられるように、を挙げています。"},{"l":"m","u":19,"s":3,"q":"体調に関わる変化のうち、「声掛けの反応が鈍くなった」で疑われるものとしてテキストに書かれているものはどれですか。","c":["視覚の支障","聴覚の支障","心臓疾患","関節の支障"],"a":1,"e":"声掛けの反応が鈍くなったのは、聴覚の支障などが疑われます。"},{"l":"m","u":7,"s":1,"q":"第7章「出会い」で、犬を探す場所として挙げられていないものはどれですか。","c":["保健所","ペットショップやブリーダー","動物園から譲り受ける","保護団体からの引き取り"],"a":2,"e":"テキストでは、ペットショップやブリーダー、保健所、保護団体からの引き取り、知り合いから譲り受ける、インターネットで見つける、を挙げています。"},{"l":"m","u":2,"s":3,"q":"犬の主要な疾病のうち、ウイルスによるものとしてテキストに挙げられていないものはどれですか。","c":["犬ジステンパー","犬コロナウイルス","犬レプトスピラ症","犬パルボウイルス"],"a":2,"e":"犬レプトスピラ症は細菌による疾病です。"},{"l":"m","u":1,"s":3,"q":"犬が性成熟（出産可能な体になること）に達するまでに必要な期間として、テキストに書かれているものはどれですか。","c":["3〜5か月","6〜14か月","3〜4年","2〜3年"],"a":1,"e":"性成熟までに必要な期間は、オオカミが2〜3年かかるのに対して、犬は6〜14か月と短期間です。"},{"l":"m","u":14,"s":4,"q":"犬の被毛について、テキストに書かれているものはどれですか。","c":["犬には下毛がない","体幹の毛が伸び続ける犬種と、一定の長さまでしか伸びない犬種がある","すべての犬種で毛は一定の長さまでしか伸びない","すべての犬種で毛は伸び続ける"],"a":1,"e":"被毛は、体幹の毛が伸び続ける犬種と、長さが一定にまでしか伸びない犬種があります。"},{"l":"m","u":22,"s":4,"q":"動物愛護管理法の考え方の移り変わりとして、テキストの説明に合うものはどれですか。","c":["『管理する』→『動物愛護』→『動物愛護を実現する手段としての動物福祉』","最初から変わっていない","『動物福祉』→『管理する』→『動物愛護』","『動物愛護』→『管理する』→『動物福祉』"],"a":0,"e":"当初は『管理する』という色合いが強い法律でしたが、途中から『動物愛護』に、そして近年には『動物愛護を実現する手段としての動物福祉』の考えが取り入れられてきています。"},{"l":"m","u":16,"s":3,"q":"トリミングサロンでの歯石取りで使われる器具として、テキストに書かれているものはどれですか。","c":["鉗子やスケラー","ドライヤー","バリカンとハサミ","爪切り"],"a":0,"e":"トリミングサロンでの歯石取りは、鉗子やスケラーという器具を使用して歯石を取ります。5〜20分程度を目安として、麻酔をかけない施術を行います。"},{"l":"m","u":20,"s":2,"q":"世界保健機関（WHO）が確認している動物由来感染症は、何種類以上ありますか。","c":["200種類以上","20種類以上","2,000種類以上","2万種類以上"],"a":0,"e":"動物由来感染症は、世界保健機関（WHO）が確認しているものだけでも、200種類以上あります。"},{"l":"m","u":22,"s":2,"q":"動物を殺傷・虐待したり、捨てたりすることについて、テキストではどのように説明していますか。","c":["届け出をすれば問題ない","犯罪行為として懲役や罰金を科せられる","注意を受けるだけ","自分の犬なら自由である"],"a":1,"e":"動物を殺傷・虐待したり、捨てたりすると犯罪行為として懲役や罰金を科せられます。"},{"l":"m","u":24,"s":1,"q":"「ペットロス」とは何ですか。","c":["ペットを失った時の悲しみ","ペットの毛が抜けること","ペットの体重が減ること","ペットが迷子になること"],"a":0,"e":"ペットロスとは、ペットを失った時の悲しみのことをいいます。その悲しみから様々な症状が出る場合があります。"},{"l":"m","u":21,"s":3,"q":"住環境の10のポイントについての記述として、誤っているものはどれですか。","c":["スリッパや靴下は片付ける","ティッシュは犬が取りやすいよう床に置いておく","ゴミ箱はふた付きのものにする","人の食べ物は戸棚や冷蔵庫など見えないところにしまう"],"a":1,"e":"犬には動くモノに反応しやすい習性があり、ひらひら動くティッシュはイタズラされやすいものの一つです。床に置きっぱなしにせず犬が届かない高い場所に置くことを習慣づけます。"},{"l":"m","u":17,"s":3,"q":"心肺蘇生法についての記述として、誤っているものはどれですか。","c":["呼吸停止の場合も心臓停止の場合も、必ず心臓マッサージから始める","気道確保は、顎を上げて頭を背中側に倒し、喉を伸ばす","可能であれば体の左側を上にして横たわらせる","人工呼吸の前に、喉の奥に何か詰まっていないかを確認する"],"a":0,"e":"呼吸停止した場合は1（気道確保）と2（人工呼吸）を、心臓停止している場合は1から3（心臓マッサージ）までを大至急行います。心臓マッサージは心臓が動いていない時にのみ、人工呼吸とセットで行います。"},{"l":"m","u":6,"s":2,"q":"子どもと一緒に家族で考えることとして、テキストに例として挙げられていないものはどれですか。","c":["犬のためのスペースはあるのか","ずっと世話は出来るのか","今いちばん人気のある犬種はどれか","お金の面は大丈夫か"],"a":2,"e":"テキストでは「犬のためのスペースはあるのか」「ずっと世話は出来るのか」「お金の面は大丈夫か」などを、お子さんと一緒に家族で考えることを挙げています。結論がどうであれ、無駄にはなりません。"},{"l":"m","u":18,"s":2,"q":"迷子札が「必須」とされている犬はどれですか。","c":["しつけができていない犬だけ","大型犬だけ","子犬だけ","屋外で飼っている犬や、屋内でフリーにしている犬"],"a":3,"e":"動物に迷子札をつける。とくに屋外で飼っている犬や屋内でフリーにしている犬には必須です。"},{"l":"m","u":19,"s":2,"q":"「寝る時間が増えた」「余り遊ばなくなった」などの行動に関わる変化について、テキストではどのように説明していますか。","c":["必ず重い病気のサインである","しつけ不足が原因である","病気ではなく、老化そのものによる気力の衰えなど自然の摂理であることが多い","若い犬にだけ見られる"],"a":2,"e":"行動に関わる変化は、病気ではなく、老化そのものによる気力の衰えなど自然の摂理であることが多く現れます。"},{"l":"m","u":4,"s":4,"q":"犬が舌を口から垂らして、とても早く呼吸するときに起きていることとして、テキストに書かれているものはどれですか。","c":["舌の色が変わって体温が上がる","舌から汗が大量に出る","舌の上で蒸気が気化し、吸い込んだ空気が冷やされる","舌で匂いを感じている"],"a":2,"e":"舌を口から垂らし、とても早く呼吸すると、舌の上で蒸気が気化し、吸い込んだ空気が冷やされます。犬は汗をかかないので、長い舌を使った激しい呼吸で体温を下げます。"},{"l":"m","u":17,"s":3,"q":"舌の黒い斑点が大きく、固く盛り上がっている場合に考えられるものとして、テキストに書かれているものはどれですか。","c":["貧血","チアノーゼ","メラノーマ（悪性腫瘍）","脱水"],"a":2,"e":"舌の黒い斑点が大きく・固く盛り上がる場合はメラノーマ（悪性腫瘍）の可能性があります。"},{"l":"m","u":2,"s":2,"q":"水は人や動物の体を構成する重要な成分です。体のおよそ何%を占めていますか。","c":["80〜90%","60〜70%","40〜50%","20〜30%"],"a":1,"e":"水は体の60〜70%を占めています。水がなくなると脱水状態に陥り、危険な状態になることもあります。"},{"l":"m","u":9,"s":4,"q":"テイルを巻き込んで耳を後ろに置いている犬と、テイルを高く伸ばして歯をむき出しにしている犬の気持ちの組み合わせとして正しいものはどれですか。","c":["前者：楽しい気分 後者：遊びたがっている","前者：縄張りを守ろうとしている 後者：怖がっている","前者：怖がっている 後者：縄張りを守ろうとしている","前者：遊びたがっている 後者：服従している"],"a":2,"e":"テイルを巻き込み耳を後ろに置いているのは怖がっているしぐさ、テイルを高く伸ばしたまま立ち歯をむき出しにするのは縄張りを守ろうとしているしぐさです。"},{"l":"m","u":20,"s":2,"q":"犬の健康管理で、特に詳しい観察が必要とされているのはどのような動物ですか。","c":["幼齢動物や施設に新たに来た動物","毛の長い犬だけ","健康そうな犬だけ","成犬だけ"],"a":0,"e":"幼齢動物及び施設に新たに来た動物は、環境の変化などからストレスを受けやすく疾病にかかりやすいため、より詳しい観察が必要です。"},{"l":"m","u":17,"s":2,"q":"おぼれた犬への手当として、テキストに書かれているものはどれですか。","c":["何もせずに寝かせる","すぐに冷たい水につける","頭を高くして水を飲ませる","頭が低くなる体勢（逆さ）にして水を吐かせる"],"a":3,"e":"おぼれた場合は頭が低くなる体勢（逆さ）にして水を吐かせます。体温が低下していればタオルで拭き温め、停止していれば心肺蘇生を行います。"},{"l":"m","u":18,"s":3,"q":"災害とペットについての記述として、テキストの内容と合わないものはどれですか。","c":["生き残ったペットが野外で繁殖しても、生態系に影響はない","おびえたペットが人を攻撃することも考えられる","ペットは世話をしてくれる飼い主がいないと生きていけない","家族同様のペットと生き別れとならないよう、十分な準備をしておく"],"a":0,"e":"生き残ったペットが繁殖し、日本古来の生態系を破壊する原因ともなります。"},{"l":"m","u":13,"s":2,"q":"犬を車から降ろすときにすることとして、テキストに書かれているものはどれですか。","c":["リードは外に出てから付ける","車内でリードを付けてから外に出す","リードは付けなくてよい","窓から飛び降りさせる"],"a":1,"e":"愛犬を車から降ろす時は、車内でリードを付けてから外に出します。飛び出し事故を防止します。"},{"l":"m","u":16,"s":4,"q":"トリミングサロンでの歯石取りについての記述として、テキストの内容と合わないものはどれですか。","c":["いやがって動く犬や攻撃的な犬にはできない","鉗子やスケラーという器具を使用する","無麻酔での施術は基本的にはおすすめしない","無麻酔なので犬の負担がなく、全ての歯石を完全に除去できる"],"a":3,"e":"テキストでは、全ての歯石を完全に除去することは難しいと思われます、としています。また無麻酔での施術は基本的にはおすすめしません。"},{"l":"m","u":12,"s":3,"q":"テキストの初期費用の表で、混合ワクチン接種（8種混合を2回）の金額として書かれているものはどれですか。","c":["40,000円","3,500円","3,000円","16,000円"],"a":3,"e":"混合ワクチン接種（8種混合の場合2回）は16,000円で、大きさに関係なく同じです。"},{"l":"m","u":8,"s":3,"q":"吠える・興奮する・トイレの失敗などの問題行動について、テキストではどのように説明していますか。","c":["犬自身のせいではなく、どう振舞ってほしいのかを教えてもらっていないだけ","必ず病気が原因である","犬の性格が悪いから","犬が飼い主を嫌っているから"],"a":0,"e":"問題行動は犬自身のせいではなく、環境や、どう振舞ってほしいのかを教えてもらっていないだけです。叱らずに振舞ってほしい行動を教えます。"},{"l":"m","u":15,"s":4,"q":"総合栄養食で、カルシウムとリンの比率はどの範囲になるよう定められていますか。","c":["1：1〜2：1","1：5〜1：10","比率は定められていない","5：1〜10：1"],"a":0,"e":"総合栄養食はカルシウムの上限が設定され、リンとの比率が1：1〜2：1の範囲になるように定められています。"},{"l":"m","u":18,"s":3,"q":"避難所で犬がおびえて鳴いたり暴れたりしないために、普段から心がけることとして、テキストに書かれているものはどれですか。","c":["社会化トレーニングと、無駄吠えをしないしつけ","一日中ケージから出さない","他の犬に会わせない","人に慣れさせない"],"a":0,"e":"避難所は日常の環境と異なるため、おびえて鳴いたり暴れたりすることがあります。普段から社会化トレーニングを心がけ、無駄吠えなどをしないようにしつけておきます。"},{"l":"m","u":1,"s":3,"q":"犬が人間の家族に入ったときの行動として、テキストに書かれているものはどれですか。","c":["自分の群れのリーダーを探し、家族の中で自分の地位を探る","家族全員を自分の子どもと考える","家族の中で一番弱い立場を選ぶ","家族を観察せずに好きに行動する"],"a":0,"e":"犬は人間の家族に入ると、家族のメンバーをとても正確に観察します。自分の群れのリーダーを探し、家族の中で自分の地位を探り、自分の義務を知りたいと思います。"},{"l":"m","u":8,"s":2,"q":"クレートトレーニングの効果として、テキストに書かれているものはどれですか。","c":["毛づやがよくなる","吠え声が大きくなる","落ち着ける場所になり、管理にも役立つ","体重が減る"],"a":2,"e":"クレートトレーニングは落ち着ける場所になり、管理にも役立ちます。"},{"l":"m","u":15,"s":2,"q":"ぶどう・干しぶどうを犬に与えてはいけない理由として、テキストに書かれているものはどれですか。","c":["腎不全の原因になる","のどや消化管を傷つける","赤血球を破壊する","血糖値が低下する"],"a":0,"e":"ぶどう・干しぶどうは犬にとって腎不全の原因になります。特にぶどうの皮は与えてはいけません。"},{"l":"m","u":4,"s":2,"q":"食べ物の味を受容する、舌にある器官を何といいますか。","c":["嗅毛","水晶体","味蕾（みらい）","鼓膜践問題 第5回5/7"],"a":2,"e":"食べ物の味は、舌にある味蕾（みらい）で受容され、大脳皮質に伝えられます。"},{"l":"m","u":3,"s":3,"q":"犬からもらう「生理的な効果」として、テキストに書かれているものはどれですか。","c":["命の尊さを学ぶ","散歩や駆け足で高コレステロール・高血糖・高血圧などが下降する","ストレスや不安からリラックスを得られる","人間関係がスムーズになる"],"a":1,"e":"生理的な効果は、散歩や駆け足などで高コレステロール・高血糖・高血圧などが下降すること、肥満の予防・解消、不眠症の改善などです。"},{"l":"m","u":20,"s":4,"q":"DNAコードについて、テキストに書かれているものはどれですか。","c":["数字だけでできている","26文字のアルファベットでできている","犬にはDNAはない","4つのアルファベット文字でできている"],"a":3,"e":"4つのアルファベット文字でできたDNAコードによって、犬の体を作り上げるタンパク質を特定する遺伝子がコントロールされています。"},{"l":"m","u":10,"s":3,"q":"テキストでは、犬にはどのような能力があると説明していますか。","c":["人の言葉をすべて理解する能力","人の考えていることを文字で読み取る能力","感情を持たず、命令どおりに動く能力","言葉は分からなくても、私たちの気配を敏感に感じ取る能力"],"a":3,"e":"犬には人間と同じように豊かな感情があり、私達が嬉しい時や悲しいと感じている時には、言葉は分からなくてもその気配を敏感に感じ取ってくれる能力があります。"},{"l":"m","u":4,"s":3,"q":"犬が非常に好むとされる糖のうち、牛乳・乳製品に含まれるものはどれですか。","c":["ブドウ糖","果糖","砂糖","乳糖"],"a":3,"e":"犬は特に「砂糖」と、果物の糖である「果糖」、牛乳・乳製品に含まれる「乳糖」を非常に好む習性があります。"},{"l":"m","u":23,"s":2,"q":"譲渡を受ける人の条件として、テキストでは原則として何であることとしていますか。","c":["60歳以上であること","犬を飼った経験があること","成人であること","一人暮らしであること"],"a":2,"e":"譲渡の条件の一つに「原則として成人であること」があります。"},{"l":"m","u":14,"s":3,"q":"人にはあって犬にはない骨として、テキストに書かれているものはどれですか。","c":["鎖骨","頸椎","尾椎","陰茎骨"],"a":0,"e":"犬の骨格のうち、オスの陰茎骨は人にはみられません。反対に鎖骨は人にあって犬にはないものです。"},{"l":"m","u":23,"s":3,"q":"保護犬の譲渡を受ける条件で、集合住宅もしくは借家等の場合に必要とされていることはどれですか。","c":["大家さんが犬を飼っていること","動物の飼養が承認されていること","1階に住んでいること","庭があること"],"a":1,"e":"飼養場所が集合住宅もしくは借家等の場合、動物の飼養が承認されていることが条件です。"},{"l":"m","u":20,"s":3,"q":"テキストで、小型犬と大型犬がなりやすい病気の例として挙げられている組み合わせはどれですか。","c":["小型犬：皮膚病 大型犬：認知症","小型犬：心臓の病気 大型犬：股関節の病気","小型犬：白内障 大型犬：歯周病","小型犬：股関節の病気 大型犬：心臓の病気"],"a":1,"e":"犬は、例えば小型犬なら心臓の病気、大型犬なら股関節の病気など犬種や体型によってなりやすい病気があります。"},{"l":"m","u":24,"s":4,"q":"ペットロスを克服するために重要なこととして、テキストに書かれているものはどれですか。","c":["愛犬のことを早く忘れること","悲しみを誰にも見せず、我慢すること","思い出の品を整理しながら供養をし、我慢せずに泣くこと","周囲の価値観に合わせること践問題 第5回6/7"],"a":2,"e":"愛犬の喪失から立ち直る時、愛犬との出会いに感謝するという過程を踏む人が非常に多くいます。周囲の価値観ではなく自分の価値観で人生を見つめ直し、出会えたことを肯定することで立ち直ることが出来ます。克服するためには、思い出の品を整理しながら、供養をし我慢せずに泣くことが重要です。"},{"l":"m","u":12,"s":2,"q":"テキストの初期費用の表で、犬の大きさによって金額が変わる項目はどれですか。","c":["生活用具の購入","狂犬病予防注射","健康診断","畜犬登録"],"a":0,"e":"生活用具の購入（クレート・サークル・トイレシート・首輪など）は、小型犬30,000円・中型犬35,000円・大型犬40,000円です。畜犬登録3,000円、狂犬病予防注射3,500円、健康診断4,000円、混合ワクチン16,000円は大きさに関係なく同じです。"},{"l":"m","u":5,"s":2,"q":"愛玩犬の特徴として、テキストに書かれているものはどれですか。","c":["番犬・警護をする","優れた走力で獲物を追う","見た目や仕草の愛らしさが魅力で、人や他の動物にもフレンドリーで飼いやすい","鳥の猟を手伝う"],"a":2,"e":"愛玩犬は家庭犬、伴侶や愛玩目的の犬で、見た目や仕草の愛らしさが魅力です。人や他の動物にもフレンドリーで飼いやすいです。"},{"l":"m","u":3,"s":1,"q":"犬が家族の一員と位置づけられるようになり、ペットのほかに何と呼ばれるようになりましたか。","c":["ワーキング・ドッグ","コンパニオンアニマル","セラピー・ドッグ","ショー・ドッグ"],"a":1,"e":"近来は家族の一員と位置づけられる飼い方が普通となり、ペットと呼ぶほかに「コンパニオンアニマル」とも称されています。"},{"l":"m","u":19,"s":4,"q":"退職後に犬を飼い始めた場合について、テキストではどのようなことを考えていく必要があるとしていますか。","c":["犬の寿命を縮めること","犬を飼わないこと","世代を越えて飼養を引き継げること","犬を若いうちに手放すこと"],"a":2,"e":"退職年齢（60歳前後）で犬を飼い始めると、人間の健康寿命と犬の高齢期が一致し、同時に介護状態になることもあります。世代を越えて飼養を引き継げることを考えていく必要があります。"},{"l":"m","u":15,"s":1,"q":"筋肉や皮膚、内臓、血液など、犬の体そのものになる栄養素はどれですか。","c":["炭水化物","脂質","タンパク質","ビタミン践問題 第5回7/7"],"a":2,"e":"タンパク質は筋肉や皮膚、内臓、血液など犬の体そのものになる栄養素です。成長期の犬には特に重要なので、子犬用ドッグフードには多く含まれています。"},{"l":"m","u":15,"s":2,"q":"鶏の骨を与えてはいけない理由として、テキストに書かれているものはどれですか。","c":["赤血球を破壊するから","血糖値が下がるから","縦にさけやすく、尖った形状になりのどや消化管を傷つけるから","腎不全を起こすから"],"a":2,"e":"鶏の骨は縦にさけやすく、尖った形状になり、のどや消化管を傷つけます。"},{"l":"m","u":3,"s":2,"q":"犬は自分の毛をなめ回し、肛門や足の裏もなめます。そのため、犬の口の周辺にはどのようなものが付着していると考えるべきですか。","c":["糞や泥","何も付着していない","ほこりだけ","歯みがき粉の成分"],"a":0,"e":"犬は肛門や足の裏もなめるので、犬の口の周辺は糞や泥が付着していると考えるべきです。"},{"l":"m","u":9,"s":1,"q":"犬が他の犬たちと話をする「二つの方法」とは何ですか。","c":["目と耳","匂いと味","体と声","声と表情だけ"],"a":2,"e":"犬は他の犬たちと二つの方法で話をすることができます。体と声です。"},{"l":"m","u":20,"s":2,"q":"動物由来感染症に感染しないための日常生活での注意として、テキストに挙げられているものはどれですか。","c":["できるだけ野生動物にふれる","生肉を与える","動物に触ったら必ず手洗いをする","糞尿はしばらく置いてから処理する"],"a":2,"e":"過剰なふれあいは控える、野生動物の家庭での飼育や野外での接触は避ける、動物に触ったら必ず手洗いをする、生肉を与えてはいけない、身の回りは清潔にする、糞尿は速やかに処理する、砂場や公園で遊んだらすぐに手を洗う、が挙げられています。"},{"l":"m","u":23,"s":2,"q":"セラピー・ドッグが活躍する場所として、テキストに挙げられていないものはどれですか。","c":["学校","競馬場","老人ホーム","災害地域"],"a":1,"e":"病院・老人ホーム・ホスピス・養護施設・保育園・学校・図書館・災害地域などで活躍します。"},{"l":"m","u":13,"s":4,"q":"一般社団法人ペットフード協会のデータで、わんちゃんと散歩に出かけるだけで延伸するとされる女性の健康寿命はどのくらいですか。","c":["2.79才","12年半","0.44才","9年"],"a":0,"e":"わんちゃんと散歩に出かけるだけで男性は0.44才、女性は2.79才の健康寿命を延伸するというデータを公表しています。"},{"l":"m","u":4,"s":5,"q":"犬は人のように全身で汗をかくことはありませんが、汗をかく場所がわずかにあります。それはどこですか。","c":["耳の内側","背中","肉球","しっぽ"],"a":2,"e":"【第4章の範囲外】犬は鼻や肉球くらいでしか汗をかけないため、体温調節が苦手です（テキスト第17章「熱中症」）。汗で体温を下げる効果は小さいので、舌を使った呼吸（パンティング）で体温を下げます。"},{"l":"m","u":16,"s":2,"q":"トリミングサロンでの歯石取りができないとされている犬はどれですか。","c":["7歳以上の犬","長毛の犬","いやがって動く犬や攻撃的な犬","小型犬"],"a":2,"e":"トリミングサロンでの歯石取りは、いやがって動く犬や攻撃的な犬にはできません。"},{"l":"m","u":2,"s":2,"q":"犬の生活環境で、室内飼育の場合にしっかり行うこととして、テキストに書かれているものはどれですか。","c":["窓を開けっぱなしにする","室内の危険物の管理と、子犬の時の排便・排尿のしつけ","一日中ケージに入れておく","人の食事を一緒に食べさせる"],"a":1,"e":"室内飼育では、室内の危険物の管理を十分に行い、排便・排尿のしつけは子犬の時にしっかり行います。"},{"l":"m","u":20,"s":3,"q":"ロンドンでコレラが流行した時に感染源を特定した方法として、テキストに書かれているものはどれですか。","c":["流行地域を分析し、特定の水道や井戸を使っている人たちを中心に感染が広がっていることを突き止めた","空気の温度を測った","犬の糞を調べた","患者一人ひとりの手術をした"],"a":0,"e":"19世紀にはロンドンでコレラが流行した時に流行地域を分析し、特定の水道や井戸を使っている人たちを中心に感染が広がっていることから、感染源を特定したこともあります。"},{"l":"m","u":1,"s":3,"q":"テキストで、犬科に属する動物として挙げられているものの組み合わせはどれですか。","c":["クマ・パンダ・アライグマ","ジャッカル・コヨーテ・タヌキ","ウマ・ウシ・ヒツジ","ライオン・トラ・ネコ"],"a":1,"e":"犬科には飼い犬のほかにジャッカル・コヨーテ・リカオン・キツネ・タヌキ・ヤブイヌなどが属します。"},{"l":"m","u":8,"s":3,"q":"「第二次社会化期」とも呼ばれる時期はどれですか。","c":["移行期","成年期","若齢期前半（生後13〜16週齢）","新生子期"],"a":2,"e":"若齢期前半（第二次社会化期：生後13週齢〜16週齢）は、13週齢以降も継続的な社会化が必要で、好奇心よりも警戒心が強く出始めます。"},{"l":"m","u":24,"s":3,"q":"愛犬を一時預かりの施設に預けることの目的として、テキストに書かれているものはどれですか。","c":["犬の体重を減らす","日常の繁忙から一時的に距離を置き、介助者自身の休憩の時間をとる","犬を手放す準備をする","犬にしつけを覚えさせる"],"a":1,"e":"一例として愛犬を一時預かりの施設に預けるなどの方法を取ることで日常の繁忙から一時的に距離を置くことができ、介助者自身の休憩の時間をとることも出来ます。"},{"l":"m","u":20,"s":4,"q":"フィラリア症の予防で、感染する時期にプラスして駆除薬を投与する期間として、テキストに書かれているものはどれですか。","c":["＋1週間","＋半年","＋1か月間","＋1年"],"a":2,"e":"フィラリア症は蚊が媒介する虫が原因の病気です。感染する時期＋1か月間は体内に寄生したフィラリアを駆除する薬を投与し予防する必要があります。"},{"l":"m","u":19,"s":2,"q":"犬の見た目の変化で、観察（確認）することが必要とされているのはいくつですか。","c":["10","2つ","3つ","5つ"],"a":3,"e":"体毛・皮膚・目・口内・全体の変化の5つを観察（確認）することが必要です。"},{"l":"m","u":2,"s":5,"q":"狂犬病のワクチンとは別に、犬ジステンパーや犬パルボウイルス感染症など複数の病気をまとめて予防するワクチンを、一般に何と呼びますか。","c":["混合ワクチン","単独ワクチン","追加ワクチン","生ワクチン"],"a":0,"e":"【テキスト外】複数の病気をまとめて予防するワクチンを「混合ワクチン」と呼びます。犬の混合ワクチンには、犬ジステンパー・犬パルボウイルス感染症・犬レプトスピラ症などを組み合わせたものがあります。狂犬病ワクチンは法律で義務、混合ワクチンは任意の接種です。"},{"l":"m","u":18,"s":4,"q":"防災用品について、全て持ち出せるとは限らないことから、テキストではどうするとよいとしていますか。","c":["持ち出しの優先順位をつける","何も準備しない","すべて避難所に置いておく","全部車に積んでおく"],"a":0,"e":"全て持ち出せるとは限らないので、持ち出しの優先順位をつけておきます。"},{"l":"m","u":15,"s":1,"q":"犬の体重は、どのくらいの頻度ではかるのがよいとされていますか。","c":["一年に一回","体重ははからなくてよい","一か月に一回","毎食ごと践問題 第6回2/7"],"a":2,"e":"犬が太りすぎないように一か月に一回は犬の体重をはかります。犬に沢山ご褒美をあげる時にはメインの食事を少なくしなければなりません。"},{"l":"m","u":13,"s":4,"q":"犬ぞりで、ソリに乗る人を何と呼びますか。","c":["マッシャー","ハンドラー","ブリーダー","トリマー"],"a":0,"e":"犬ぞりは北米・ロシア・ヨーロッパなど北極地方のウインタースポーツで、マッシャーがソリに乗り、移動タイムを競います。"},{"l":"m","u":3,"s":3,"q":"「適切な飼養管理を」で、良い獣医師をホームドクターとしたうえで、疾病の予防治療のほかにすることとして書かれているものはどれですか。","c":["しつけを全部任せる","散歩を代わりに頼む","何でも相談する","トリミングを頼む"],"a":2,"e":"犬にも良い獣医師をホームドクターとし、疾病の予防治療の他に何でも相談しましょう、とあります。"},{"l":"m","u":14,"s":2,"q":"犬の骨の数は、およそいくつと言われていますか。","c":["150個","320個","500個","206個"],"a":1,"e":"犬の骨の数は32
